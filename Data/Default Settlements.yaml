services:
  - name: Selling Used Equipment
    description: "Undamaged gear can be sold for 50% of the sale price, to a merchant or artisan that vends the gear originally."
    cost: "50% of sale price"
    availability: [Village, Small Town, Large Town, City]
  - name: Repairing Equipment
    description: "Repairing damaged gear costs 50% of the sale price, and requires an artisan of the same type and skill that created the gear originally."
    cost: "50% of sale price"
    availability: [Village, Small Town, Large Town, City]
  - name: Lending
    description: "Borrow money from moneylender only. The moneylender will demand collateral worth at least double the value of the loan; collateral cannot be magic items. Characters with good reputations may receive better terms."
    cost: "10% interest per month"
    availability: [Large Town, City]
  - name: Banking/Bailment
    description: "Coins and valuables can be deposited with a moneylender or moneychanger, and some goldsmiths or jewelers. Bailment of most magic items will be refused, for fear of cursed magic."
    cost: "10% of value deposited"
    availability: [Small Town, Large Town, City]
  - name: Exchange Coins, Gems and Jewelry
    description: "Exchange coins, gems, and jewelry with moneylender, moneychanger, or selected merchants."
    cost: "10% discount to face value"
    availability: [Village, Small Town, Large Town, City]
    limits:
      Village: "up to 100 gp per season"
      Small Town: "up to 1,000 gp per season"
      Large Town: "up to 10,000 gp per season"
      City: "no limit"
  - name: Sell Art and Treasure
    description: "Sell art and treasure to antiquarian, collector or selected merchants."
    cost: "50% of value"
    availability: [Village, Small Town, Large Town, City]
    limits:
      Village: "up to 50 gp per season"
      Small Town: "up to 500 gp per season"
      Large Town: "up to 5,000 gp per season"
      City: "no limit"
  - name: Identifying Herbs
    description: "All herbalists can identify common herbs and fungi. An herbalist's ability to identify rare herbs and fungi depends on their skill."
    cost: "1 sp per specimen"
    availability: [Village, Small Town, Large Town, City]
  - name: Identifying Herbal Potions
    description: "All herbalists can identify common herbal potions by smell and taste. An herbalist's ability to identify rare herbal potions depends on their skill."
    cost: "1 gp per specimen"
    availability: [Village, Small Town, Large Town, City]
  - name: Identifying Alchemical Potions
    description: "All alchemists can identify common alchemical potions by alchemical analysis. An alchemist's ability to identify rare potions depends on their skill."
    cost: "5 gp per specimen"
    availability: [Large Town, City]
  - name: Divine Spellcasting
    description: "Priests are generally willing to cast spells for Church members in good standing, so long as the priest is convinced it is for a good cause. The priest may request a service or favor in return."
    cost: "Service or favor"
    availability: [Village, Small Town, Large Town, City]
    availability_by_rank:
      1: Village
      2: Small Town
      3: Large Town
      5: City
  - name: Sage - General Question
    description: "The sage either knows the answer to the question or does not. If the sage knows, it will charge 25 gp for the answer. If sage doesn't know, it will charge 5 gp for a suggestion about how the question may be answered."
    cost: "25 gp (known) / 5 gp (suggestion)"
    availability: [Large Town, City]
  - name: Sage - Specific Question
    description: "The sage will know if it is possible to answer the question. If an answer is possible, there is a 25% chance that the sage knows immediately, and a 25% chance the sage will be able to answer with 1-3 weeks research."
    cost: "250 gp per day (minimum 250 gp)"
    availability: [Large Town, City]

