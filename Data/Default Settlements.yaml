pharmacopoeia:
  - name: Adder Poison
    slots: "½"
    cost: "15 gp"
    availability: [Varies]
    description: "Adder poison comes in a glass vial. The poison may be applied to a weapon that deals piercing or slashing damage, and remains potent for up to 1 hour after applied. The target of a successful attack struck by the poisoned weapon must make a DC 10 Strength saving check or take 1d4 venom damage. The damage repeats each minute until the target succeeds on a saving check. If a character using the poisoned weapon rolls a natural 1 on an attack check, the character must succeed on a DC 10 Luck saving check or nick itself and be affected as if attacked."
  - name: Burn Salve
    slots: "½"
    cost: "5 gp"
    availability: [Small Town, Large Town, City]
    description: "Burn salve comes in a clay jar that holds a pint. A character that applies Burn Salve to wounds caused by fire or acid damage regains hit points (up to its maximum) equal to one roll of the character's Hit Die or the amount of fire/acid damage. Hit points are regained over a minute."
  - name: Everyday Potion
    slots: "½"
    cost: "1-5 gp"
    availability: [Village, Small Town, Large Town, City]
    description: "This entry covers many unremarkable potions that are rarely useful for adventuring characters. It includes anti-itch potion, beauty potion, digestive potions, emetic potion, fertility potion, hirsute potion (grows hair over a week) and sedative potion (make drowsy)."
  - name: Feigned Death Potion
    slots: "½"
    cost: "50 gp"
    availability: [Varies]
    description: "A character that drinks a feigned death potion will fall into a cataleptic state that is indistinguishable from death. The cataleptic state will last 24 hours, and when the character awakes, it will be groggy for 1 hour."
  - name: Healing Potion
    slots: "½"
    cost: "50 gp"
    availability: [Small Town, Large Town, City]
    description: "A character that drinks a healing potion regains hit points and will points (up to its maximum) equal to one roll of the character's hit die and will die, respectively. Hit points and will points are regained over a minute."
  - name: Love Potion
    slots: "½"
    cost: "50 gp"
    availability: [Varies]
    description: "A character that drinks a love potion must make a Heart saving check (DC 10). If it fails, it takes 1d4 psychic damage and falls in love with the next suitable character it sees. This love lasts 24 hours or indefinitely if the character's will points are reduced to 0. Some love potions are more potent, with a higher DC and causing more damage."
  - name: Moonsight Potion
    slots: "½"
    cost: "100 gp"
    availability: [Varies]
    description: "A character that drinks a moonsight potion can see in a 20-foot range in dim light as well as bright light for 4 hours."
  - name: Nausea Poison
    slots: "½"
    cost: "5 gp"
    availability: [Varies]
    description: "A character that drinks nausea poison must make a Strength saving check (DC 10). If it fails, it is nauseated for 10 minutes, with disadvantage on attack checks, spell checks and ability checks."
  - name: Oddberry Wine
    slots: "½"
    cost: "5 gp"
    availability: [Unavailable]
    description: "A character that drinks oddberry wine must make a Heart saving check (DC 14) or be subject to daydreams, poetry, madness, orgiastic dances, and wild doings under the moon, as well as a longing for faerie lands."
  - name: Pain Relief Potion
    slots: "½"
    cost: "5 gp"
    availability: [Varies]
    description: "A pain relief potion eases the pains of a character that drinks it, granting advantage on saving checks against pain effects for 1 hour."
  - name: Pipeleaf
    slots: "½"
    cost: "1 gp"
    availability: [Small Town, Large Town, City]
    description: "Cured pipeleaf comes in a linen or leather pouch. It is smoked in a special pipe. When vexed by a problem, a group of at least 2 characters may spend time smoking pipeleaf in contemplation and debate. After an undisturbed hour, the most Intelligent player may make an Intelligence check, with a +1 bonus for each companion beyond the second (maximum +4). If the check meets a DC set by the GM, the GM gives a clue about the problem being contemplated."
  - name: Pipeleaf Pipe
    slots: "½"
    cost: "5-50 gp"
    availability: [Small Town, Large Town, City]
  - name: Restful Potion
    slots: "½"
    cost: "5 gp"
    availability: [Varies]
    description: "A character that drinks a restful potion before sleep has advantage to the character's rest check."
  - name: Snake Antivenom
    slots: "½"
    cost: "25 gp"
    availability: [Varies]
    description: "A character that drinks snake antivenom gains advantage on saving checks to resist venom from snakes and other reptiles for 1 hour."
  - name: Suggestibility Potion
    slots: "½"
    cost: "5 gp"
    availability: [Varies]
    description: "A character that drinks a suggestibility potion must make a Heart saving check (DC 10). If it fails, it takes 1d6 psychic damage and is more easily convinced to follow a reasonable course of action. The character also has disadvantage on saving checks against mind-affecting spells and effects. The suggestibility lasts 1 hour or 1 day if the character's will points are reduced to 0."
  - name: Waking Potion
    slots: "½"
    cost: "10 gp"
    availability: [Varies]
    description: "A character that drinks a waking potion can stay awake a single night without ill effects; afterwards, a character cannot benefit from waking potion for a week."
  - name: Wigend Brew
    slots: "½"
    cost: "10 gp"
    availability: [Varies]
    description: "An old Geatish mead recipe, favored by warriors before battle. A character that drinks wigend brew gains advantage on saving checks to resist fear effects for 1 hour."

