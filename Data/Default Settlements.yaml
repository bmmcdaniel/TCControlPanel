spellcasting_equipment:
  - name: Arcane Cane
    category: Arcane Equipment
    slots: "1"
    cost: "10 gp+"
    availability: [Small Town, Large Town, City]
    description: "A carved length of wood used as a focus for evocation spells. A damaged arcane cane is usable, but imposes disadvantage on the caster's spell checks when used as an arcane focus."
  - name: Arcane Orb, Glass
    category: Arcane Equipment
    slots: "½"
    cost: "25 gp+"
    availability: [Large Town, City]
    description: "A glass orb used as a focus for illusion spells. A damaged glass orb shatters and is destroyed."
  - name: Arcane Orb, Crystal
    category: Arcane Equipment
    slots: "½"
    cost: "100 gp+"
    availability: [City]
    description: "A crystal orb used as a focus for illusion spells. A damaged crystal orb is usable, but imposes disadvantage on the caster's spell checks when used as an arcane focus."
  - name: Arcane Staff
    category: Arcane Equipment
    slots: "2"
    cost: "25 gp+"
    availability: [Large Town, City]
    description: "A carved length of wood used as a focus for evocation spells. An arcane staff can be used as a quarterstaff weapon. A damaged arcane staff is usable, but imposes disadvantage on the caster's spell checks when used as an arcane focus."
  - name: Arcane Wand
    category: Arcane Equipment
    slots: "½"
    cost: "5 gp+"
    availability: [Small Town, Large Town, City]
    description: "A carved length of wood used as a focus for evocation spells. A damaged arcane wand is usable, but imposes disadvantage on the caster's spell checks when used as an arcane focus."
  - name: Elemental Ring, Gold
    category: Arcane Equipment
    slots: "-"
    cost: "150 gp+"
    availability: [City]
    description: "A heavy gold ring set with precious or semi-precious stones representing the four elements, used as a focus for elemental spells. A damaged elemental ring is usable, but imposes disadvantage on the caster's spell checks when used as an arcane focus."
  - name: Elemental Ring, Silver
    category: Arcane Equipment
    slots: "-"
    cost: "50 gp+"
    availability: [Large Town, City]
    description: "A heavy silver ring set with precious or semi-precious stones representing the four elements, used as a focus for elemental spells. A damaged elemental ring is usable, but imposes disadvantage on the caster's spell checks when used as an arcane focus."
  - name: Elemental Ring, Copper
    category: Arcane Equipment
    slots: "-"
    cost: "15 gp+"
    availability: [Large Town, City]
    description: "A heavy copper ring set with precious or semi-precious stones representing the four elements, used as a focus for elemental spells. A damaged elemental ring is usable, but imposes disadvantage on the caster's spell checks when used as an arcane focus."
  - name: Ring, Lead
    category: Arcane Equipment
    slots: "-"
    cost: "5 gp+"
    availability: [Large Town, City]
    description: "A plain lead metal ring, used as a focus for certain spells. A damaged lead ring is usable, but imposes disadvantage on the caster's spell checks when used as an arcane focus."
  - name: Spellbook
    category: Arcane Equipment
    slots: "2"
    cost: "25 gp+"
    availability: [City]
    description: "A leather-bound book used by wizards to record arcane spells. An ordinary spellbook can record up to 12 spells."
  - name: Spellbook, Grimoire
    category: Arcane Equipment
    slots: "4"
    cost: "50 gp+"
    availability: [City]
    description: "A larger, heftier version of an ordinary spellbook. A grimoire can record up to 36 spells."
  - name: Spellbook, Traveling
    category: Arcane Equipment
    slots: "1"
    cost: "15 gp+"
    availability: [City]
    description: "A smaller, lighter version of an ordinary spellbook designed for travel. A traveling spellbook can only record up to 4 spells."
  - name: Spell Scroll, Arcane
    category: Arcane Equipment
    slots: "½"
    cost: "Varies"
    availability: [Varies]
    description: "A heavy vellum scroll storing a single arcane spell. A character can attempt to use the scroll to cast an arcane spell by making an Intelligence-based spell check. The scroll can be used by any character that can read, but if the character does not have the arcane magic class ability or the arcane theory skill, the spell check is made at disadvantage. Regardless whether the spell check succeeds, the magic fades from the scroll when used. Focus and cost components are not needed to cast a spell from a scroll. A scroll's rank is equal to the rank of the spell it stores."
  - name: Smokepot (1 use)
    category: Arcane Equipment
    slots: "1"
    cost: "3 gp+"
    availability: [Small Town, Large Town, City]
    description: "A single-use clay pot that produces a thick volume of smoke. Often used in summoning rituals."
  - name: Summoning Chalk (6 pieces)
    category: Arcane Equipment
    slots: "-"
    cost: "5 gp"
    availability: [Large Town, City]
    description: "Specially prepared chalk impregnated with powdered metals and gems used to prepare a summoning circle, a focus for summoning spells."
  - name: Cassock
    category: Divine Equipment
    slots: "-"
    cost: "5 gp+"
    availability: [Large Town, City]
  - name: Figurine of Saint
    category: Divine Equipment
    slots: "-"
    cost: "5 gp+"
    availability: [Large Town, City]
    description: "A small figurine of a saint. These figurines are popular devotional items and a focus for some specific divine spells. A damaged figurine is not functional."
  - name: Holy Chalice, Silver
    category: Divine Equipment
    slots: "1"
    cost: "100 gp+"
    availability: [Large Town, City]
    description: "A blessed silver chalice decorated with symbols of the Sovereign. A holy chalice is a spellcasting focus for certain divine spells involving food and drink. A damaged holy chalice is usable, but imposes disadvantage on the caster's spell checks when used as a divine focus."
  - name: Holy Chalice, Wood
    category: Divine Equipment
    slots: "1"
    cost: "10 gp+"
    availability: [Small Town, Large Town, City]
    description: "A blessed wooden chalice decorated with symbols of the Sovereign. A holy chalice is a spellcasting focus for certain divine spells involving food and drink. A damaged holy chalice is usable, but imposes disadvantage on the caster's spell checks when used as a divine focus."
  - name: Holy Symbol, Gold
    category: Divine Equipment
    slots: "½"
    cost: "50 gp+"
    availability: [City]
    description: "A gold pendant or amulet representing the power of the Sovereign, often a solar cross, a winged disc or the divine eye. Many divine spells require a holy symbol as a spellcasting focus. To use a holy symbol as a focus, the caster must actually hold it in hand. A damaged holy symbol is usable, but imposes disadvantage on the caster's spell checks when used as a divine focus."
  - name: Holy Symbol, Silver
    category: Divine Equipment
    slots: "½"
    cost: "10 gp+"
    availability: [Large Town, City]
    description: "A silver pendant or amulet representing the power of the Sovereign, often a solar cross, a winged disc or the divine eye. Many divine spells require a holy symbol as a spellcasting focus. To use a holy symbol as a focus, the caster must actually hold it in hand. A damaged holy symbol is usable, but imposes disadvantage on the caster's spell checks when used as a divine focus."
  - name: Holy Symbol, Wood
    category: Divine Equipment
    slots: "½"
    cost: "2 gp+"
    availability: [Small Town, Large Town, City]
    description: "A wooden pendant or amulet representing the power of the Sovereign, often a solar cross, a winged disc or the divine eye. Many divine spells require a holy symbol as a spellcasting focus. To use a holy symbol as a focus, the caster must actually hold it in hand. A damaged holy symbol is usable, but imposes disadvantage on the caster's spell checks when used as a divine focus."
  - name: Holy Water
    category: Divine Equipment
    slots: "½"
    cost: "25 gp"
    availability: [Small Town, Large Town, City]
    description: "Holy water comes in a glass flask that holds 1 pint. As an action, a character can splash holy water on an adjacent target (no attack check required) or use it as a thrown weapon, shattering on impact. Throwing holy water requires a ranged attack as an improvised weapon (20-foot range, or 40-foot at disadvantage), but ignoring armor. On a hit, if the target is an undead, demon or faerie creature, the target takes 1d12 holy damage. If used by a cleric, the cleric can add its level to the damage. A damaged flask of holy water leaks and is nonfunctional."
  - name: Incense (6 pieces)
    category: Divine Equipment
    slots: "-"
    cost: "5 gp"
    availability: [Small Town, Large Town, City]
    description: "Specially prepared incense prepared with blessed oils."
  - name: Spell Scroll, Divine
    category: Divine Equipment
    slots: "½"
    cost: "Varies"
    availability: [Varies]
    description: "A heavy vellum scroll storing a single divine spell. The user attempts to use the scroll to cast a divine spell by making a Wisdom-based spell check. The scroll can be used by any character that can read, but if the character does not have the divine magic class ability or the theology skill, the spell check is made at disadvantage. Regardless whether the spell check succeeds, the magic fades from the scroll when used. Focus and cost components are not needed to cast a spell from a scroll. A scroll's rank is equal to the rank of the spell it stores."
  - name: Thurible Censer
    category: Divine Equipment
    slots: "2"
    cost: "100 gp+"
    availability: [Large Town, City]
    description: "A metal vessel used to burn incense. In many ceremonies, a priest swings an incense-burning thurible from chains."

adventuring_gear:
  - name: Acid
    slots: "½"
    cost: "50 gp"
    availability: [City]
    description: "Acid comes in a clay flask that holds 1 pint. As an action, a character can splash acid on an adjacent target (no attack check required) or use it as a thrown weapon, shattering on impact. Throwing acid requires a ranged attack as an improvised weapon (20-foot range, or 40-foot at disadvantage), but ignoring armor. On a hit, the target immediately takes 1d4 acid damage, and for 4 turns thereafter. Acid may also be used to dissolve organic material. A damaged flask of acid is destroyed (and may damage the carrying character)."
  - name: Backpack
    slots: "-"
    cost: "3 gp"
    availability: [Village, Small Town, Large Town, City]
  - name: Bedroll
    slots: "2"
    cost: "1 gp"
    availability: [Village, Small Town, Large Town, City]
    description: "A bedroll is a light wool blanket wrapped in canvas and secured by straps. It is invaluable for sleeping outdoors. It is treated as bedding when camping."
  - name: Blanket, Wool
    slots: "2"
    cost: "0.5 gp"
    availability: [Village, Small Town, Large Town, City]
    description: "A heavy wool blanket. It is treated as bedding when camping."
  - name: Block and Tackle
    slots: "2"
    cost: "20 gp"
    availability: [Large Town, City]
    description: "A set of heavy-duty pulleys that can be used to lift objects. With a rope threaded through them, a block and tackle allows a character to hoist four times the weight it can normally lift. If used to lift around 1,000 pounds or more, the character must make a DC 10 Luck saving check or the block and tackle is damaged."
  - name: Book, Blank
    slots: "½"
    cost: "20 gp"
    availability: [Large Town, City]
  - name: Caltrops
    slots: "1"
    cost: "5 gp"
    availability: [Large Town, City]
    description: "A sack of 2 inch high, iron spikes arranged in a tripod so that one spike always faces upwards. As an action, a character can scatter caltrops to cover a 10-feet square area. A creature that enters the area must succeed on a DC 15 Dexterity saving check or take 1d3 piercing damage and stop moving this turn. A creature moving through the area at one-quarter speed may avoid the caltrops."
  - name: Candles (6)
    slots: "½"
    cost: "0.3 gp"
    availability: [Village, Small Town, Large Town, City]
    description: "For 1 hour, a candle sheds dim light out to 5-foot range. A candle carried in combat, moving quickly or other vigorous activity is automatically extinguished."
  - name: Chain (10 ft.)
    slots: "2"
    cost: "4 gp"
    availability: [Large Town, City]
    description: "A light, iron chain. If used to lift around 1,500 pounds or more, the character must make a DC 10 Luck saving check or the chain is damaged. The chain can also be damaged with a DC 25 Strength check."
  - name: Chalk (6 pieces)
    slots: "-"
    cost: "0.5 gp"
    availability: [Small Town, Large Town, City]
  - name: Chisel
    slots: "½"
    cost: "2 gp"
    availability: [Village, Small Town, Large Town, City]
  - name: Cloak, Ghillie
    slots: "3"
    cost: "2 gp"
    availability: [Unavailable]
    description: "A ghillie cloak is a heavy cloak that allows its wearer to hide in underbrush. It incorporates bits of local flora and other natural materials that must be updated to match local terrain. Those materials make the ghillie cloak extremely bulky, so it is usually discarded before combat. If stripped of natural materials, a ghillie cloak takes only 1 slot. Like a regular cloak, it protects against rain and can be used as bedding when camping."
  - name: Cloak, Oilcloth
    slots: "2"
    cost: "5 gp"
    availability: [Large Town, City]
    description: "A long, sleeveless outer garment made of wool boiled in linseed oil, tar and wax, often used by sailors for its superior protection against water. It is bulkier and stiffer than an ordinary wool cloak. It protects against rain and can be used as bedding when camping."
  - name: Cloak, Wool
    slots: "1"
    cost: "2 gp"
    availability: [Small Town, Large Town, City]
    description: "A long, sleeveless outer garment made of treated wool, often used by travelers. It protects against rain and can be used as bedding when camping."
  - name: Coffer, Iron
    slots: "2"
    cost: "25 gp"
    availability: [Large Town, City]
    description: "A coffer is a 1-foot long strongbox used to store valuables."
  - name: Coffer, Silver
    slots: "2"
    cost: "50 gp"
    availability: [City]
    description: "A coffer is a 1-foot long strongbox used to store valuables."
  - name: Coffer, Wood
    slots: "2"
