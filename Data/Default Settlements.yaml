    description: "A bundle of wood suitable for a night's campfire. A bundle contains about 10 small logs. A campfire made with the bundle burns brightly for 4 hours, and has smoldering embers for 4 hours. The campfire provides dim light out to 40-foot range. A campfire makes it easier to sleep well while camping."
