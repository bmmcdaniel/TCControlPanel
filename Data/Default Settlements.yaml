    description: "Iron spikes can be useful for spiking doors, crude pitons and many other uses."
  - name: Tent, 2 Person
    slots: "4"
    cost: "3 gp"
    availability: [Small Town, Large Town, City]
    description: "A simple and portable canvas tent, sleeping two. A tent provides shelter."
  - name: Tinderbox
    slots: "-"
    cost: "0.5 gp"
    availability: [Small Town, Large Town, City]
    description: "This small container holds flint, fire steel, and tinder (usually dry cloth soaked in light oil) used to kindle a fire. Using a tinderbox to light oil, a torch, or anything else with abundant, exposed fuel requires both hands and takes an action with a DC 10 Luck check. In darkness, the DC increases to 20."
  - name: Torch
    slots: "1"
    cost: "0.2 gp"
    availability: [Village, Small Town, Large Town, City]
    description: "A torch is a hefty stick or bundle of reeds with oil-soaked rags. A torch burns for 1 hour, providing dim light out to 20-foot range. After 1 hour, the torchbearer must make a DC 10 Luck check each 10 minutes or the torch burns out. A torch may be used to make a melee attack; a burning torch deals 1d4 fire damage."
  - name: Twine (100 ft.)
    slots: "½"
    cost: "0.4 gp"
    availability: [Village, Small Town, Large Town, City]
    description: "Thin hemp twine. If used to lift around 25 pounds or more, or in environments with sharp/fraying edges, the character must make a DC 10 Luck saving check or the twine is damaged. Twine can also be damaged with a DC 10 Strength check."
  - name: Vial, Clay (½ cup)
    slots: "-"
