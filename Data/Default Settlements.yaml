  - name: Rations, Preserved (6 days)
    slots: "1"
    cost: "2 gp"
    availability: [Village, Small Town, Large Town, City]
    description: "Dry rations consist of water and dry foods suitable for extended travel, including smoked jerky, salted fish, dried fruit, hardtack, and nuts."
  - name: Rations, Perishable (6 days)
    slots: "2"
    cost: "0.5 gp"
    availability: [Village, Small Town, Large Town, City]
    description: "Perishable rations consist of water and bread, cheese, fruit, sausage, handpies, salt pork and corned beef; suitable for travel but perishable."
  - name: Rations, Wayloaf (6 days)
    slots: "½"
    cost: "10 gp"
    availability: [Large Town, City]
    description: "Wayloaf rations consist of water and wayloaf, a special formula of twice-baked unleavened bread baked with tallow, meat and vegetable. Wayloaf is prized by travelers for its lightness and sustaining properties."
  - name: Razor
    slots: "-"
    cost: "2 gp"
    availability: [Small Town, Large Town, City]
  - name: Rope, Hemp (50 ft.)
    slots: "1"
    cost: "2 gp"
    availability: [Small Town, Large Town, City]
    description: "1/2 inch thick hemp rope. If used to lift around 500 pounds or more, or is used in environments with sharp/fraying edges, the character must make a DC 10 Luck saving check or the rope is damaged. The rope can also be damaged with a DC 20 Strength check."
  - name: Rope, Cable Hemp (50 ft.)
    slots: "4"
    cost: "10 gp"
    availability: [City]
    description: "2 inch thick hemp rope. If used to lift around 2,500 pounds or more, the character must make a DC 10 Luck saving check or the cable is damaged. The cable can also be damaged with a DC 30 Strength check."
  - name: Rope, Rawhide (25 ft.)
    slots: "1"
    cost: "5 gp"
    availability: [Large Town, City]
    description: "1/2 inch thick rawhide, leather rope. Rawhide leather rope is stronger than hemp rope, but less flexible, prone to stretching and vulnerable to water. If used to lift around 750 pounds or more, or in wet environments, the character must make a DC 10 Luck saving check or the rope is damaged. The rope can also be damaged with a DC 22 Strength check."
