vehicles:
  - name: Carriage
    cost: "50 gp"
    notes: "250 slots"
    description: "A four-wheeled private vehicle typically used to transport nobles. A carriage is enclosed on all sides and has benches in the interior. A carriage requires a pair of horses to pull. A carriage can carry 250 slots of cargo, including riders."
  - name: Cart
    cost: "15 gp"
    notes: "100 slots"
    description: "A two-wheeled open vehicle used to transport cargo. A single driver sits upfront. A cart requires a horse or mule to pull. A cart can carry 100 slots of cargo, including the rider."
  - name: Handcart
    cost: "5 gp"
    notes: "20 slots"
    description: "A small, two-wheeled open vehicle used to transport cargo for short distances. A handcart is pushed by a man. A handcart can carry 20 slots of cargo."
  - name: Wagon
    cost: "75 gp"
    notes: "1,000 slots"
    description: "A four-wheeled open vehicle used to transport cargo. One or two drivers sit upfront. A wagon requires two or four horses, mules or oxen to pull. A wagon can carry 1,000 slots of cargo, including riders."

