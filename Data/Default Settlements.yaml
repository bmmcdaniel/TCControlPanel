    availability: [Small Town, Large Town, City]
    description: "A small brass or animal horn used to signal over long distances. A signal horn can be heard up to 1/2 to 1 mile away (depending on terrain, forest cover, etc.). Larger horns can be heard over longer distances. A damaged signal horn is nonfunctional."
  - name: Ink, Vial
    slots: "-"
    cost: "12 gp"
    availability: [Large Town, City]
    description: "Common oak gall ink sufficient to write 50 pages. Ink comes in a glass vial. A damaged vial of ink is destroyed."
  - name: Knife
    slots: "½"
