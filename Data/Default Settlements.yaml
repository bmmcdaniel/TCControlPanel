    availability: [Village, Small Town, Large Town, City]
  - name: Lamp, Bronze
    slots: "½"
    cost: "3 gp+"
    availability: [Large Town, City]
    description: "An oil lamp is a bronze wicked vessel. It casts dim light out to 20-foot range. Once lit, it burns for 4 hours on a flask (1 pint) of oil. Lamps are generally unsuitable for adventuring; a lamp carried in combat, moving quickly or other vigorous activity is automatically extinguished. A damaged lamp is destroyed."
  - name: Lamp, Clay
    slots: "½"
    cost: "1 gp"
    availability: [Village, Small Town, Large Town, City]
    description: "An oil lamp is a clay wicked vessel. It casts dim light out to 20-foot range. Once lit, it burns for 4 hours on a flask (1 pint) of oil. Lamps are generally unsuitable for adventuring; a lamp carried in combat, moving quickly or other vigorous activity is automatically extinguished. A damaged lamp is destroyed."
  - name: Lock and Key
    slots: "-"
    cost: "15 gp"
    availability: [Large Town, City]
    description: "A common iron or brass lock can be opened by a character with the Lockpicking skill using lockpicks with a successful DC 15 Dexterity check. A lock can be damaged with a successful DC 25 Strength check. A damaged lock is stuck in its current position, open or closed."
  - name: Lockpicks
    slots: "-"
    cost: "20 gp"
    availability: [Large Town, City]
    description: "A set of tools used to pick locks."
  - name: Mirror, Small Bronze
    slots: "-"
    cost: "3 gp"
    availability: [Large Town, City]
    description: "A 6 inch mirror made of bronze. A damaged mirror reflects still light but the reflected image is broken and distorted."
  - name: Mirror, Small Silver
    slots: "-"
    cost: "20 gp"
    availability: [Large Town, City]
    description: "A 6 inch mirror made of silver. A silver mirror provides a superior image. A damaged mirror reflects still light but the reflected image is broken and distorted."
  - name: Oil Flask
    slots: "½"
    cost: "0.2 gp"
    availability: [Small Town, Large Town, City]
    description: "Oil comes in a clay flask that holds 1 pint. As an action, a character can douse oil on an adjacent target (no attack check required) or use it as a thrown weapon, shattering on impact. On a hit, the target is covered in oil. If the target takes any fire damage, the target immediately takes an additional 1d6 fire damage from the burning oil for that round, and two rounds thereafter. Oil can also be poured on the ground to cover a 5-foot square area. If lit, oil burns for 3 rounds and deals 1d6 fire damage to any character that enters the area or ends its turn in the area."
  - name: Pallet, Feather
    slots: "3"
