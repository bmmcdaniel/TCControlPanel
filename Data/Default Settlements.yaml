  - name: Shackles
    slots: "1"
    cost: "3 gp"
    availability: [Large Town, City]
    description: "Iron metal restraints that can bind the hands or feet of a humanoid or creature with similar anatomy. Escaping shackles requires a successful DC 22 Dexterity check. Damaging shackles requires a successful DC 25 Strength check. A character with the contortionism skill can escape shackles without a check."
  - name: Shovel
    slots: "2"
