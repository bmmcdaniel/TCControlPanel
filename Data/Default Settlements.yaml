weapon_properties:
  - name: Longspear
    description: "A character wielding a longspear one-handed has disadvantage when using a longspear to attack an adjacent target."
  - name: Min Str
    description: "A character must have at least this Strength score to use this weapon."
  - name: Missile
    description: "Normal and long range is shown in parenthesis, in feet. A character can use a missile weapon to make ranged attacks up to normal range with no penalty, or up to long range at disadvantage. Each attack with a missile weapon expends a piece of ammunition."
  - name: No Stealth
    description: "Characters carrying heavy weapons generally cannot act stealthily."
  - name: Offhand
    description: "Offhand weapons can be wielded in a character's off-hand for two-weapon fighting. Two-weapon fighting threatens from multiple angles and grants a +2 bonus to attacks."
  - name: Quarterstaff
    description: "A quarterstaff can be used defensively or to threaten from multiple angles. A character using a quarterstaff can choose to gain a +1 bonus to armor class or a +1 bonus to attack."
  - name: Reach
    description: "A character can use a reach weapon to attack targets that are adjacent or at 10-foot range."
  - name: Thrown
    description: "A thrown weapon can be used to make melee or ranged attacks. Normal and long range is shown in parenthesis, in feet. Thrown weapons cannot be used again until recovered."
  - name: Torch
    description: "If used to make a melee attack, a burning torch deals 1d3 fire damage."
  - name: Two-Handed
    description: "This weapon requires two hands when a character attacks with it."

special_material_notes:
  - name: Silvered
    description: "Pure silver is too weak and malleable to fashion into usable weapons. However, iron weapons can be inlaid with silver runes and designs that are especially effective against undead and lycanthropes. Only metal weapons benefit from being silvered."
    cost: "+50 gp"
  - name: Hawthorn
    description: "Hawthorn is weaker and more brittle than most woods used for weapons. However, hawthorn weapons can effect ghosts and other incorporeal spirits. Only all-wooden weapons benefit from being made from hawthorn. If any effect allowing a saving check would damage a hawthorn weapon, the wielder has -4 penalty on the saving check."
    cost: "+25 gp"
  - name: Meteoric Iron
    description: "Darker than terrestrial iron, meteoric iron contains unearthly alloys. Only all-metal weapons benefit from being made from meteoric iron. If any effect allowing a saving check would damage a meteoric iron weapon, the wielder has +4 bonus on the saving check."
    cost: "+250 gp (not including raw material)"
  - name: Mithril
    description: "A light, silvery metal favored by fey. Mithril weapons are especially effective against undead and lycanthropes. In addition, because of its lightness and tensile strength, mithril can be fashioned into a rapier."
    cost: "Varies (not including raw material)"
