calendar:
  name: Mittlands Common Calendar
  description: A 12-month calendar with 4 seasonal festivals, totaling 364 days.
  days_per_week: 6
  lunar_cycle_length: 27
  blood_moon_chance: 10
  current:
    calendar_month: 15
    calendar_day: 21
    lunar_day: 21
    is_blood_moon: false
  week_days:
  - Oathday
  - Travelday
  - Marketday
  - Homeday
  - Kingsday
  - Godsday
  months:
  - name: Rainmote
    days: 30
    season: Spring
  - name: Ostara
    days: 1
    season: Spring
  - name: Sproutmote
    days: 30
    season: Spring
  - name: Foalmote
    days: 30
    season: Spring
  - name: Haymote
    days: 30
    season: Summer
  - name: Litha
    days: 1
    season: Summer
  - name: Greenmote
    days: 30
    season: Summer
  - name: Highsunmote
    days: 30
    season: Summer
  - name: Ripenmote
    days: 30
    season: Autumn
  - name: Meath
    days: 1
    season: Autumn
  - name: Wardmote
    days: 30
    season: Autumn
  - name: Readymote
    days: 30
    season: Autumn
  - name: Cullmote
    days: 30
    season: Winter
  - name: Yule
    days: 1
    season: Winter
  - name: Hearthmote
    days: 30
    season: Winter
  - name: Bidingmote
    days: 30
    season: Winter
  holidays:
  - name: Brithan, Winter/Spring Cross-Quarter
    description: Mid-way between Yule and Ostera. The end of snows and beginning of
      spring rains. Celebrated with role-reversals, including the appointment of the
      King of Misrule. Traditional gifts are fish or eels.
    month: Readymote
    day: 15
  - name: Ostara, Spring Equinox
    description: Spring equinox festival. Traditional gifts are cooked eggs, often
      decorated.
    month: Ostara
    day: 1
  - name: Beltane, Spring/Summer Cross-Quarter
    description: Mid-way between Ostara and Litha. Fertility-themed. Dancing around
      maypoles. A teenage girl will be elected the Queen of Beltane. Traditional gifts
      are early flowers, especially to youth.
    month: Foalmote
    day: 15
  - name: Litha, Summer Solstice
    description: Summer solstice festival. Traditional gifts are ivy, especially to
      soldiers.
    month: Litha
    day: 1
  - name: Lammas, Summer/Autumn Cross-Quarter
    description: Mid-way between Litha and Meath. The first day of harvest. Traditional
      gifts are elaborate breads baked with the first harvested wheat, especially
      to churchmen.
    month: Highsunmote
    day: 15
  - name: Meath, Autumn Equinox
    description: Autumn equinox festival. As it occurs mid-harvest, it is a low-key
      holiday. Gambling is common. Traditional gifts are dried herbs and flowers,
      especially to immediate family.
    month: null
    day: 1
  - name: Samhain, Autumn/Winter Cross-Quarter
    description: Mid-way between Litha and Meath. The end of the harvest season, and
      the beginning of winter. This is also the season of ghosts and spooks. It is
      celebrated with bonfires. Traditional gifts are salt, especially to elders.
    month: Readymote
    day: 15
  - name: Yule, Winter Solstice
    description: Winter solstice festival, the shortest day of the year. Traditional
      gifts are toys to children, and honeyed sweets mulled mead to anyone in the
      community.
    month: Yule
    day: 1
  - name: Embers
    description: The day prior top the Feast of Revelation. Officially intended to
      be spent in prayer and contemplation, but observed only by the truly faithful.
    month: Hearthmote
    day: 6
  - name: Feast of the Revelation
    description: Feast celebrating the Aperitor's revelation. One of two key feasts
      of the liturgical calendar.
    month: Hearthmote
    day: 6
  - name: Vigil
    description: First day of Holy Week. Annual oaths of fealty are renewed on this
      day.
    month: Sproutmote
    day: 13
  - name: Alms
    description: Second day of Holy Week. Alms for the poor are given on this day.
    month: Sproutmote
    day: 14
  - name: Contemplation
    description: Third day of Holy Week. On this day, churchmembers meditate.
    month: Sproutmote
    day: 15
  - name: Innocents
    description: Fourth day of Holy Week. Communal activities are emphasized this
      day.
    month: Sproutmote
    day: 16
  - name: Procession of Saints
    description: Fifth day of Holy Week. The saints are honored on this day.
    month: Sproutmote
    day: 17
  - name: Feast of the Ascension
    description: Sixth and final day of Holy Week. The day when Saint Piello ascended
      to the heavens. One of two key feasts of the liturgical calendar.
    month: Sproutmote
    day: 18
  - name: Saint Maximillian Magnus's Feast Day
    description: Feast of Emperor and Saint Maximillian Magnus, patron saint of leadership
      and the Empire.
    month: Wardmote
    day: 3
  - name: Saint Adso's Feast Day
    description: Feast of Saint Adso, patron saint of youth, students and novices.
    month: Sproutmote
    day: 17
  - name: Saint Anselm's Feast Day
    description: Feast of Saint Anselm, patron saint of soldiers and service.
    month: Wardmote
    day: 29
  - name: Saint Arno's Feast Day
