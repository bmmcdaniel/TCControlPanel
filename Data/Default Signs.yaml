version: 1
signs_chance: 25%
signs:
- name: Encounter Sign
  type: Sign
  description: Foreshadowing of a future encounter.
  habitat: [Any]
  habitat_notes: null.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 100%}
  sparks:
  - Animals - tracks; scat; fur; eggs; half-eaten prey/food; gnawed bones; scratched bark from claw sharpening; muddy wallows (aurochs, boars, catobeplas); distant howls (wolves); shed skin (snakes); molted feathers; upturned dirt from burrowing; den.
  - Bugs - tracks; frass; eggs; half-eaten prey/food, sometimes wedged in tree limbs; shed exoskeleton; upturned dirt from burrowing; den; young trees stripped of bark (beetles); spider webs (spiders); mucus trail (snails and slugs).
  - Dragons - tracks; seen flying at a distance; residue of breath weapon; huge shed scales; claw gouges; storm smell - ozone, sharp, and clean.
  - Fey - fairy ring; rainbows; rushing water; lingering dusk/dawn; unnatural moon; shimmering air; silvery mists; blooming flowers; scent of roses; mithril arrow; faerie-stuff gold; music carried on the breeze; sharp cold (frost elves).
  - Fungus - floating spores; fruiting bodies, immature mushrooms or puffballs; crushed mushrooms; musty, earthy smells; creatures infected with fungus.
  - Humanoids - tracks; broken or discarded equipment; old campfire; food leavings; sound of a signal horn; trail blazes; cut firewood; traps (trappers).
  - Mutants - pools of raw chaos; "off" colors; senseless destruction; signs from base creature.
  - Oozes - mucus trail; dissolved leaves and organic matter; skeletal remains of prey; pitted surfaces; oily, discolored water.
  - Spirits, Elemental - ashes and burnt areas (fire); soaked ground and pools of water (water); disturbed ground (earth); ice shards (ice).
  - Spirits, Effigy - face carved in tree trunk (treowere); scarecrow; statues; carved object generally.
  - Spirits, Ghost - call of po-whit birds; sunlight dims; cold breeze; sound of rattling chains; foreboding feeling; flames dying spontaneously; animals acting oddly; spectral mists; distant, mournful wailing; flickering lights (will-o-wisp). 
  - Spirits, Golem - heavy tracks; broken things; arcane materials. 
  - Spirits, Angels - sunbeams through clouds; sound of choirs; golden, light motes; scent of myrrh, sweet and resinous; symmetrical patterns of stones and sticks; peacful feelings; pure white birds.
  - Spirits, Demons - pools of raw chaos; summoning circle; sulfur smell; black ichor; flies and maggots; teeth and bone fragments; sign of possessed creature (werewolf, werebear, wendigo, shadow, succubus).
  - Undead - strange silence; necrosis smell; corrupted/darkened vegetation; moaning winds; screams (vargul).
false_signs_chance: 15%
