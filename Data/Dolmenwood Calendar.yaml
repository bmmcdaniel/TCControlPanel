  - Colly
  - Chime
  - Hayme
  - Moot
  - Frisk
  - Eggfast
  - Sunning
  months:
  - name: Grimvold
    days: 30
    season: The onset of winter
    wysendays:
    - Hanglemas
    - Dyboll’s Day
    moon: Grinning moon
  - name: Lymewald
    days: 28
    season: Deep winter
    moon: Dead moon
  - name: Haggryme
    days: 30
    season: The fading of winter
    wysendays:
    - Yarl’s Day
    - The Day of Virgins
    moon: Beast moon
  - name: Symswald
    days: 29
    season: The onset of spring
    wysendays:
    - Hopfast
    moon: Squamous moon
  - name: Harchment
    days: 29
    season: High spring
    wysendays:
    - Smithing
    moon: Knight’s moon
  - name: Iggwyld
    days: 30
    season: The fading of spring
    wysendays:
    - Shortening
    - Longshank’s Day
    moon: Rotting moon
  - name: Chysting
    days: 31
    season: The onset of summer
    wysendays:
    - Bradging
    - Copsewallow
    - Chalice
    moon: Maiden’s moon
  - name: Lillipythe
    days: 29
    season: High summer
    wysendays:
    - Old Dobey’s Day
    moon: Witch’s moon
  - name: Haelhold
    days: 28
    season: The fading of summer
    moon: Robber’s moon
  - name: Reedwryme
    days: 30
    season: The onset of autumn
    wysendays:
    - Shub’s Eve
    - Druden Day
    moon: Goat moon
  - name: Obthryme
    days: 28
    season: Deep autumn
    moon: Narrow moon
  - name: Braghold
    days: 30
    season: The fading of autumn
    wysendays:
    - The Day of Doors
    - Dolmenday
    moon: Black moon
  holidays:
  - name: The Feast of Cats
    month: Symswald
    day: 2
    description: Spring dances with cat masks.
  - name: The Feast of St Clewyd
    month: Reedwryme
    day: 25
    description: Patron saint of Dolmenwood; unicorn-effigies burned.
  - name: Festival of the Green Man
    month: Reedwryme
    day: 30
    description: Memorial to the slain king; moss manikins hung from trees.
  - name: The Hunting of the Winter Hart
    month: Braghold
    day: 30
    description: Twilight hunt for the white fairy stag.
