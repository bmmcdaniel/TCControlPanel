  - An enormous sturgeon surfaces and slaps its tail. If the adventuring company is nearby or in a boat, it will slap those, +5 attack/1d4 bludgeoning damage and make DC 11 Strength saving check or fall prone/turn over boat. If nobody is nearby, it will merely slap the water.
  - The adventuring company hears three clicks. Then, a sturgeon jumps from the water into the air.
  - A giant surgeon's head breaks the surface of the water. It has caught a giant frog and is gulping it down into its gullet.
- name: Succubus Demon
  type: Creature
  description: Lovely, but indistinct, humanoid; bat wings, small horns, and fangs.
  habitat: [Farmland, Roads, Ruins, Dungeons]
  habitat_notes: Anywhere humans live or travel.
  watch: {dawn: 5%, morning: 5%, afternoon: 15%, dusk: 15%, early night: 30%, late night: 30%}
  season: All 100%
  sparks:
  - At night, a succubus demon attempts to seduce and possess a member of the adventuring company (using its phantasmal seduction ability).
  - The adventuring company meets Lord Jellicoe, a wealthy noble traveling with an entourage. One of his pages asks if the adventuring company has any skill with medicine; Lord Jellicoe is suffering from an infection. He is covertly possessed by a succubus, who is draining his life.
- name: Swanmay
  type: Creature
  description: Elf form- platinum blonde hair; willowy frame; white dress. Swan form- brilliant white plumage; black mask; curved neck.
  habitat: [Rivers, Lakes]
  habitat_notes: Especially forest waterways that encroach on faerie.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 50%}
  sparks:
  - The swanmays, in swan form, are paddling around a lake. Their leader, White-Flashes-on-Blue, will converse politely, but is suspicious of the adventuring company.
  - The swanmays (Pearly-Wings-Aloft, Buttery-Delight, Crowned-with-Water-Diamonds, Serenity-in-Motion), in elf form, are bathing naked in a stream, their swan cloaks lying on the shore. If they see the adventuring company, they will grab their cloaks and fly away.
  - Silvery-Crown, a swanmay, is trapped in human form, cursed by a jealous Drunewife, who stole her feathered cloak. She asks the adventuring company for assistance.
  - Turbin, a fisherman, is looking for help. A swanmay stole his fishnet because he was encroaching on her lake.
  - Roses-on-Water, a swanmay, is guarding a healing spring. Only those that can pass her judgement may drink. She will "look into the heart" of those she questions.
  - Lady Lightly-Stepping-Through-Lillies, a swanmay queen, is hosting a dinner party between swanmays and female elves. The party is hosted on gigantic lily pads and features roasted frogs in garlic. Female humans and changelings may join the dinner, but all others are refused.
  - The adventuring company hears applause. If they sneak closer, they see Odette, a young swanmay ballerina, dancing on the water, to the applause of her peers. If confronted, the swanmays will transform and fly away.
  - Gracefully-Gliding, the swanmay, sings a mournful song near a misty lake. She is mourning the death of her mortal lover.
  - Peaceful-Waters-are-Deep, a swanmay, is seeking help to rescue her sister who has been taken prisoner by a human cottager (or perhaps an elf lord).
  - Delight-under-Moon, a black swanmay corrupted by chaos, seeks to sow disharmony among humans. She tempts the men in the adventuring company, setting them against each other.
  - A swanmay (Amber-Lights-Above) flies overhead in swan form, calling out to the adventuring company. The swanmay is attempting to warn the company of a group of devil-goats ahead.
- name: The Hag
  type: Creature
  description: Shapeshifter taking many forms, but always female.
  habitat: [Dense Forest, Thorny Forest, Bogs, Swamps]
  habitat_notes: Rarely far from the Hag's Addle. See page 82 of DCB.
  watch: {dawn: 10%, morning: 15%, afternoon: 15%, dusk: 30%, early night: 15%, late night: 15%}
  season: All 100%
  sparks:
  - The Hag in her form as a rustic maid gathering marsh herbs. She will not reveal her identity, but will hint that she has great power and can assist those that favor her. She will smile prettily and attempt to charm any handsome mortal men.
  - The Hag in her form as longhorn breggle woman, capering in a forest glade. She will gesture for female members of the adventuring company to join her. If any do so, she says that she is a friend of the hag, and invites them to gain a favor from the hag.
  - The Hag in her form as a gaunt, wide-eyed girl, tall beyond her years. She interrogates the adventuring company about what they are doing in her territory. She tries to draw them into a scheme to release her from fairy bondage.
  - The Hag in her form as a pregnant woman with eyes of blood red. If the adventuring company attempts to interact with her, she will use her finger snap ability to transform one into a candle, but will otherwise ignore them.
  - The Hag in her form as an elderly lady (perhaps mossling) with skin covered in fungus. She invites the adventuring company back to her cottage for dinner. At dinner, she will complain incessantly about her sister, the queen of blackbirds. Any man that eats her food must make a DC 13 Luck saving check, or be susceptible to seduction (see pg 82 of DCB).
  - The Hag in her form as a wooden woman, carved from a rotting log. She is in a mood to prophesize and will (eventually) offer to do so for the adventuring company for "a favor to be named later." See pg 83 of DCB.
  - The Hag in her form as a crow-headed lady, dressed in sodden lace. She asks the adventuring company to accompany her to her garden, where she asks them to dig royal mandrakes. If the company does so, she will reward them by gifting a single mandrake.
  - The Hag in her form as a pale, wailing corpse, lurching through the bog. If the Hag sees the adventuring company she will scream "out of my way, you fools- can't you see I'm busy."
  - The Hag in her form as an elven matron. The Hag is engaged in a game of tongue twisters with a poor peasant woman. The tongue twister is as follows- "Theophilus Thistle, the thistle sifter, while sifting a sieve full of un-sifted thistles, thrust three thousand thistles through the thick of this thumb." At stake is the soul of the woman's daughter. The Hag will allow a member of the adventuring company to substitute for the woman, and if they win, they can ask a favor of the Hag.
- name: Treowere
  type: Creature
  description: Living tree with face carved in trunk; face may be crude or elaborate, sometimes augmented with paint. Rustling branches and roots.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: Liminal forests, especially those encroaching on faerie.
  watch: {dawn: 15%, morning: 25%, afternoon: 25%, dusk: 15%, early night: 10%, late night: 10%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 60%}
  sparks:
  - An enormous yggnut tree, with a 10-foot tall face carved just above its roots. It was once the abode of a treowere, but is now dormant.
  - Nutter (a black walnut) is freshly awakened. It is curious about its body and is wandering the woods. His face is quite crude.
  - Old Man Willow (a white willow) sits beside a river campsite. He will awaken at night and attempt to kill and feed on campers.
  - Burl-Eyes (a daur oak) is humming a merry song to himself, accompanied by the wind through his branches.
  - Crickgrown (a silver birch) is feuding with a dryad.
  - BlackOak (a black oak), a chaotic treowere with red painted eyes, prowls the forest, slaughtering all.
  - Mossbeard (a majestic oak) is dormant. It will not awaken unless the adventuring company camps in its glade, in which case it will awaken and tell them to leave. If they refuse, it will visit terrible fury upon them.
  - Wardbones (an ash) the treowere was created to guard a Drune site of power, buried under the earth. Wardbones has mystic runes carved around his trunk and his eyes are embedded quartz crystals.
  - An unnamed treowere (an elm) is chortling as hundreds of squirrels run about its branches.
  - Longbranch (a birch) is a rather philosophical treowere. It is smoking pipeleaf and contemplating the stars. It will invite the adventuring company to join it, and will point out various constellations and stars.
  - Burlley (a majestic oak) is a giant, gnarled oak. He moves stiffly and refers to humanoids as "little ones." He has a terrible lightning scar down one side.
  - The Watchman (a large yew); his face is surrounded by whorls carved into the wood. He stands guard over an ancient Geatish barrow. If the adventuring company approaches, he warns them off, saying that a terrible barrow-wight rests within. He was carved by a Drune wizard, and has an especial fondness for Drune of any kind.
- name: Treowere, Corrupted
  type: Creature
  description: Living tree with cruel face carved in trunk; often with red painted eyes or chaotic markings; thorns or twisted features. Rustling branches and roots.
  habitat: [Dense Forest, Thorny Forest, Fungal Forest]
  habitat_notes: Corrupted or chaotic forests.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 60%}
  sparks:
  - BlackOak, a chaotic treowere with red painted eyes, prowls the forest, slaughtering all.
  - Thorncank is a corrupted treowere in a crabapple tree. His slam attack and whirlwind attacks do 1d20 piercing damage, but he has only 35 hit points. Thorncank hates humans and Drunes especially, blaming them for his existence.
- name: Troll
  type: Creature
  description: 12-foot tall stocky humanoid; light brown skin; large bulbous nose; hide or heavy wool clothing with elaborate beads; simple wood and stone weapons. Deep, booming voice.
  habitat: [Rolling Hills, Craggy Hills, Mountains, Light Forest, Dense Forest, Caverns]
  habitat_notes: Rocky areas with plentiful caverns and water.
  watch: {dawn: 10%, morning: 5%, afternoon: 5%, dusk: 25%, early night: 30%, late night: 25%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A tall pillar of stone. Upon closer examination, it is a troll recently turned to stone, as yet not weathered.
  - A trio of trolls (Carl, Orla, Spund) are gathering giant mushrooms in a mushroom forest. Spund is their leader.
  - Shipley the troll is carrying a slain deorling on its shoulders.
  - Smed the troll is lurking under an ancient stone bridge in a forest. In a booming voice, it demands a toll from all who cross the bridge. It won't leave the protection of the bridge during the day, but at night it might track down those who refuse the toll.
  - Gornt the troll is smashing a recent farmstead that encroached too close on its territory.
  - Nic and Tomtom, a pair of trolls, are practicing boxing in a glade.
  - Fide the troll is trading with a group of mosslings, led by Ulmor. Fide offers flint blanks, while the mosslings offer smottlebread and velvet flounder (see DCB pg 429).
  - Enver the troll is searching for a human wife and a copper bathtub. He's heard good things about both, but isn't really sure what they are.
  - Garmin the troll is sitting on a stump watching his magical goose while it lays a silver egg. He will attempt wave off the adventuring company.
  - A deep booming pervades the forest night. Far away, forest trolls are drumming on hollow logs.
  - Robin the troll is throwing boulders at a church steeple, hoping to silence the bell.
  - At night, pale trollfires illuminate the hills under a starry sky. If the adventuring company, approaches, several trolls are gathered around the trollfire, but they warn off the adventuring company from their private affair. If the company refuses, the trolls will attack.
  - The adventuring company sees a troll with a swollen, disfigured face. Ringon the troll is suffering from bee stings after foolishly trying to steal honey from a wild hive. His nose is swollen to a ridiculous size, and it is in a foul, defensive mood.
- name: Troll, Moss
  type: Creature
  description: 13-foot tall gangly humanoid; light green skin; moss and foliage growing on body; large bulbous nose; primitive clothing; simple wood weapons. Deep, gargly voice.
  habitat: [Rolling Hills, Bogs, Swamps, Rivers, Caverns]
  habitat_notes: Marshes, moors and rivers.
  watch: {dawn: 10%, morning: 5%, afternoon: 5%, dusk: 25%, early night: 30%, late night: 25%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 60%}
  sparks:
  - An out of place boulder amidst the bog. Upon closer examination, it is a moss troll recently turned to stone.
  - Meorling the moss troll dog paddles in the water, with only its eyes and nose above the surface. If he notices the adventuring company, he may leap from the water and attack, or he may simply observe.
  - Tag the moss troll is digging peat with a crude wooden shovel.
  - Bose the moss troll is smashing a wooden boat that encroached too close on its territory. He is just as happy to smash the adventuring company also.
  - Till the moss troll is fishing for giant sturgeon using a chain baited with giant frog.
  - Ferngilly the moss troll is skinning a giant viper with a sharp rock.
  - Billian the moss troll has got a stack of turtle shells. She wants to trade them for quilted blankets, and is heading to a rendezvous.
- name: Troll, Mountain
  type: Creature
  description: 15-foot tall stocky humanoid; light grey, cracked skin like weathered rocks; large bulbous nose; round curling horns reminiscent of bighorn sheep; hides or crude wool clothing; simple wood and stone weapons. Deep, booming voice.
  habitat: [Craggy Hills, Mountains, Caverns]
  habitat_notes: null
  watch: {dawn: 10%, morning: 5%, afternoon: 5%, dusk: 25%, early night: 30%, late night: 25%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 100%}
  sparks:
  - A huge stone boulder. Upon closer examination, it is a weathered troll turned to stone. Songbirds nest in the weathered cup of the troll's arms.
  - The adventuring company hears crashing noises. Karak, a mountain troll, is chucking stones from the top of a hill. If he sees the company, he will start tossing stones at them.
  - Booray, a mountain troll, is hurrying; he is afraid he won't make it back to his cave before sunrise. He will not wait for the adventuring company to make small talk.
  - Tomic the mountain troll is lying on his back watching the moon. He is a gruff fellow, but more willing than most trolls to talk to the adventuring company, but he detests priests of all kinds.
  - Hak the troll demands that the adventuring company surrender at least a weeks rations as "toll" for moving through his territory.
  - Peeder the troll is smelting mithril ore into raw mithril using a rock blast furnace.
- name: Tunnel Hulk
  type: Creature
  description: 12-foot tall beetle-like biped; large, uncanny compound eyes; dark brown thick carapace; oversized claws; prominent mandibles. Lumbering movement.
  habitat: [Caverns, Dungeons]
  habitat_notes: null
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 0%}
  sparks:
  - Underground, the adventuring company comes across a maze of twisty, interconnected tunnels. Suddenly, the company is face-to-face with a tunnel hulk.
  - The umber hulk stands in a burrow with a narrow crack on the main passage, waiting to ambush when prey comes within reach. When the umber hulk bursts forth, it is accompanied by a shower of debris and rubble.
  - An umber hulk has made its lair in a room with many, large (6 feet tall) crystals with surfaces that reflect the uncanny eyes of the umber hulk. Avoiding the umber hulk's gaze is harder than usual. Creatures attempting to avert their gaze must succeed on a DC 15 Luck check.
  - A recently excavated tunnel leads to an umber hulk burrow. Inside, an umber hulk guards a clutch of a dozen eggs.
  - A dwarf adventurer leads a tame umber hulk using a goad. The dwarf uses the umber hulk to excavate for raw ores and gems. The umber hulk seems compliant.
- name: Tunny Fish, Flying
  type: Creature
  description: 7-foot long fish; blue-gray scales; oversized wing fins.
  habitat: [Seas]
  habitat_notes: Warm seas.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 50%}
  sparks:
  - Flying tunnies are skimming over waves, racing the adventuring company's ship.
  - Flying tunnies leap from the water, pursued by sharks.
  - A school of flying tunnies swim by underwater.
- name: Turtle, Giant Snapping
  type: Creature
  description: 16 feet across; ridged, round shell; dark green and black; alert, black eyes with yellow ring; wickedly sharp mouth.
  habitat: [Rivers, Lakes]
  habitat_notes: null
  watch: {dawn: 15%, morning: 25%, afternoon: 30%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 80%, Summer: 100%, Autumn: 60%, Winter: 0%}
  sparks:
  - The turtle is lazily floating down the river, half out the water, a giant heron perched on its back.
  - While boating, the turtle attempts to flip the adventuring company's boat.
  - On the shore, the turtle is scarfing down a giant eel.
  - A turtle is swimming in a clockwise circle. If the adventuring company watches, they may notice that the turtle is recently blind in its right eye.
  - Something in the water spooks the turtle and it rushes up on the riverbank, where it eyes the adventuring company suspiciously, withdrawing inside its shell.
  - The adventuring company notices movement on weeds along the river's shore. Suddenly, a giant snapping turtle emerges, lumbering into the water.
  - A giant snapping turtle attacks a raft of timber logs managed by lumberjacks.
  - The skeleton of a massive snapping turtle, 30 feet across. Its bleached and white.
- name: Turtle, River
  type: Creature
  description: 3-foot long turtle; smooth, oval shell; brown and green coloring.
  habitat: [Bogs, Swamps, Rivers, Lakes]
  habitat_notes: null
  watch: {dawn: 15%, morning: 25%, afternoon: 30%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 80%, Summer: 100%, Autumn: 60%, Winter: 0%}
  sparks:
  - A group of turtles is sunning themselves on rocks. When they see the adventuring company, they slip off the rocks into the river.
  - A wolf has caught a turtle and is loping by with the turtle in its mouth.
  - A turtle is sitting on a nest of leathery eggs. It snaps at the adventuring company, and is reluctant to leave; but if attacked, it will retreat. The eggs are excellent eating.
- name: Unicorn
  type: Creature
  description: White, pink, or pearlescent horse; single ivory horn; white, silver, or gold mane and tail; often has a goat beard.
  habitat: [Dense Forest, Thorny Forest]
  habitat_notes: Often near faerie or holy shrines.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - Three unicorns graze in a field of wildflowers. With a successful reaction check, they will allow church members to approach them. Waldo the unicorn will be friendly to church members, but prefers not to be involved in worldly affairs.
  - Abthius the unicorn is guiding a distraught maiden out of the woods.
  - The unicorns (Gretchen, Eggort, Radiant) are kneeling at a lost saint's shrine.
  - A unicorn named Saint is healing a giant viper.
  - A pair of unicorns (Aevila, Goldenlight) are enduring a flight of sprites around them. The sprites (Morningburst, Betony, Cicely, Raincap) are pestering the unicorns, and tugging on their manes and tails. Aevila, clearly frustrated but unwilling to harm them, asks them to "leave us be."
  - Cuthebert the unicorn is bludgeoning a bog-corpse, which is already looking fairly weakened.
  - A unicorn (Gonfali) guards a bridge to a healing spring. It will allow only the pure of heart to pass.
  - The unicorn (Beatrix) briefly shows itself to the adventuring company, then disappears.
  - Guthac the unicorn approaches and will aid the adventuring company – but only if the unicorn judges that the adventuring company is on a noble or holy quest. (The unicorn's empath ability enables this.) Guthac tells the company that if they succeed on their quest, to return to him and he will give them a gift (his horn).
  - The adventuring company briefly glimpses a unicorn (Sunrise) in the underbrush, before it shyly retires.
  - While the adventuring company fights evil creatures (such as boggins or a manticore), an unexpected unicorn (Teresa) joins the battle. Afterwards, Teresa the unicorn thanks the company for "driving out chaos."
  - The adventuring company hears terrified bleating. A Drune cottager (Dylned) and two wanderers (Odrothynn, Ffaelcor) have captured a unicorn (Anselm) and are preparing to sacrifice it on a dolmenstone. If rescued, Anselm insists that he must accompany the company for a full season, rendering what aid he can (although he refuses to enter any settlement.).
  - The adventuring company finds a freshly slain unicorn, its horn harvested from its body by some cruel hunter.
- name: Vargul
  type: Creature
  description: "Corpse's shriveled head; floating; viscera trails from the neck; if howling, hung by the hair. Loud howling."
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Bogs, Ruins]
  habitat_notes: Near settlements.
  watch: {dawn: 10%, morning: 0%, afternoon: 0%, dusk: 25%, early night: 35%, late night: 30%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - While traveling, the adventuring company notices a distinct lack of animal life, and an overall feeling of dread. At night, the adventuring company hears the awful howling of varguls in the distance.
  - Villagers beg the adventuring company to free them from local varguls. The village headman is Orval and will greatly appreciate any help.
  - Varguls are howling their keening song. If the adventuring company approaches, they stumble upon a black tentacles, which ambushes the adventuring company.
  - At night, the adventuring company hears the awful howling of varguls in the distance. If they follow the noise, they discover that the varguls are hanging from a tree in a glade with a glowing dolmenstone. If they wait a minute, a Bwesmych the Drune cottager arrives and asks for help dealing with the varguls.
  - At dusk, while setting up a camp, a detached vargul head flies through the adventuring company's campsite. Assuming they are too surprised to follow, they will later hear the vargul's howling.
- name: Violet Mushroom
  type: Creature
  description: 4-foot tall mushroom; pale purple-grey cap and thick stem; dangling feelers. Closely resembles a shrieker.
  habitat: [Fungal Forest, Caverns, Dungeons]
  habitat_notes: null
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {Spring: 60%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - A group of violet mushrooms is intermixed with shriekers in a symbiotic relationship.
  - A single violet mushroom has grown next to a slow stream.
  - A trio of violet fungi are growing from the decomposing corpse of a cave newt – their most recent victim.
  - In a huge field of giant mushrooms, shriekers, violet mushrooms, gas spores and whitecaps are mixed throughout.
- name: Vulpine
  type: Creature
  description: Elf form- red hair; green eyes; lithe and quick. Fox form- classic red-brown fox.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: Forests near faerie.
  watch: {dawn: 20%, morning: 15%, afternoon: 15%, dusk: 35%, early night: 10%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 100%}
  sparks:
  - A crown-wearing vulpine named Hebert is hosting a dinner party for woodland animals, satyrs. The adventuring company is invited to join if they can keep the peace. At the conclusion of the dinner, the vulpine challenges everyone to a riddling contest; the vulpine's crown is the prize but losers must surrender an item of the vulpine's choice.
  - Jean, the vulpine, steals a valuable item, nips the owner to make it aware and leads the adventuring company on a merry chase. If the vulpine is caught, it has no hard feelings, but if it is wounded, it will disappear.
  - Lightfoot the vulpine is being chased by goblin merchants for something it stole from the goblin market. The vulpine offers to give it to the adventuring company, throwing the goblins off its trail.
  - Theriot the vulpine invites the adventuring company to spend the night in its faerie castle; spending the night makes a whole season pass.
  - The adventuring company is having difficulties travelling because of thicket of brambles. Reynard the vulpine appears and offers to guide them through if they can beat him in a game of cards, during which the vulpine will cheat outrageously. The brambles were created by the vulpine.
  - Vermal, a vulpine, is leading a band of bandits who demand tribute from the adventuring company. The vulpine is using them for his own amusement, but will object if they are slaughtered.
  - Davidot the vulpine is poking a giant snail with a stick. He challenges the party to see if they can make the snail race as fast as he.
  - A vulpine named Broussard is hanging by the tail from a tree. A witch he stole from has caught him and cursed him to remain there until he can convince someone to trust him by letting him have all their wealth overnight. He has hung here for a month. If he is trusted, there is a 50% chance he is truly contrite and will befriend the person who trusts him; 50% it is a trick and he will scamper off with the wealth.
  - Poroute the vulpine asks the company if they would like to help him rob the goblin market. Poroute will lead them through fairy roads, hither and yon. But it's actually a farce, and Poroute plans to steal valuables from the company.
- name: Walking Corpse
  type: Creature
  description: Disgusting, rotting remains of a humanoid; shambles. Foul smell of rot. Groans and shuffles.
  habitat: [Meadows, Rolling Hills, Light Forest, Dense Forest, Bogs, Ruins, Caverns, Dungeons]
  habitat_notes: Anywhere human remains may lie.
  watch: {dawn: 10%, morning: 7%, afternoon: 8%, dusk: 15%, early night: 30%, late night: 30%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - Foul chaos magic has caused the recent dead to rise from their graves. They wander about the graveyard.
  - A half-dozen rotting corpses are impaled on tree branches through their torsos. If the adventuing company investigates, the corpses stir to life. The (pinned) walking corpses can be dispatched without danger. This is the work of a drune wizard, but it will be difficult to discover.
  - The walking corpses hurl giant leeches at the adventuring company.
  - The walking corpses gamely try to push victims into a pit.
  - A walking corpse wanders by, ringing an ancient copper bell.
  - A walking corpse has lost half a leg, but still tries to attack the adventuring company.
  - A vulture perches atop a walking corpse, occasionally taking a bite of its flesh.
  - The walking corpse is fully clad in bronze armor and wielding a bronze-tipped spear.
  - The walking corpses are infested with giant centipedes.
  - Members of the adventuring company fall into a pit trap filled with water. Floating in the water are a half dozen walking corpses.
  - A walking corpse is caught in a thorn bush. It is trying to pull themselves out, but is failing.
  - A dozen walking corpses walk by in a single file line. If followed, they travel for 10 miles to a dolmenstone set in the densest part of the forest.
- name: Walking Corpse, Bog Corpse
  type: Creature
  description: Sodden remains of a humanoid; yellow-green marsh-flame in belly; shambles. Foul smell of rot. Groans and shuffles.
  habitat: [Bogs, Swamps, Ruins]
  habitat_notes: null
  watch: {dawn: 10%, morning: 7%, afternoon: 8%, dusk: 15%, early night: 30%, late night: 30%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - The walking corpses hurl giant leeches at the adventuring company.
  - A walking corpse wanders by, ringing an ancient copper bell.
  - The walking corpses are infested with giant centipedes.
  - Members of the adventuring company fall into a pit trap filled with water. Floating in the water are a half dozen walking corpses.
  - A dozen walking corpses walk by in a single file line. If followed, they travel for 10 miles to a dolmenstone set in the densest part of the forest.
  - Bog-corpses wade through the mud, moaning loudly.
  - The bog-corpses were sacrificial victims of ancient rites. Their bodies trail rotten ropes (which once tied them).
  - As the adventuring company are crossing a muddy area, rotten hands burst from the mud, seizing members by the ankle.
  - A pair of bog-corpses are chained to a post, guarding the entrance to a witch's hut.
  - A bog corpse sits on wooden stump, whispering secrets. Those that listen long may learn foul necromantic spells. But they must also succeed on a DC 10 Luck check or gain a point of Arcane Corruption.
  - A bloated corpse floats down a slow swamp-river. As it passes, it greets the adventuring company.
  - Bog corpses dressed in sacrificial bronze armor and wreathed in preserved flowers, are crowding around an ancient Geatish dolmen stone.
