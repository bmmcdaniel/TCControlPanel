  - The displacer cat fell into a prepared pit trap. He is leaping, trying to escape. If he escapes, he is very angry.
  - The adventuring company gets the eerie feeling they are being stalked. They are being stalked by a displacer cat. At night, the cat will attempt to kill and drag away any mount or small humanoid.
  - The adventuring company hears the keening growl of a displacer cat, but it is nowhere to be seen.
  - A pack of displacer cats is harrying a miniature mammoth.
