  habitat: [Farmland, Settlements, Ruins]
  habitat_notes: Always atop a building.
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {All: 100%}
  sparks:
  - A weathervane effigy creaks and turns in the wind, watching the adventuring company pass.
  - The adventuring company spots a weathervane effigy perched atop a ruined building, its eyes glowing faintly.
  - A weathervane effigy suddenly animates, pointing accusingly at intruders.
  - The wind shifts. A weathervane effigy rotates to face the adventuring company directly.
- name: Wendigo Demon
  type: Creature
  description: Emaciated human; withered limbs and sunken belly; red, sunken eyes; pale skin; long claw-like fingernails.
  habitat: [Craggy Hills, Mountains, Dense Forest, Thorny Forest, Swamps]
  habitat_notes: Remote wilderness areas, particularly in winter.
  watch: {dawn: 5%, morning: 5%, afternoon: 5%, dusk: 20%, early night: 30%, late night: 35%}
  season: {Spring: 100%, Summer: 10%, Autumn: 10%, Winter: 100%}
  sparks:
  - In the winter, the adventuring company runs out of food and at night, a wendigo demon attempts to possess creatures suffering fatigue.
  - In the early spring, before the snows are melted, the adventuring company meets an emaciated, gaunt man (Dewglid) on the trail. The man is possessed by a wendigo.
  - The adventuring company finds a young, lost hunter (Kestrel), separated from his group. The hunter is shivering and hungry. He claims he fled when a wendigo possessed one of their members and slew the rest.
  - The adventuring company discovers an emaciated man (Leckenby) possessed by a wendigo devouring his former companion. The wendigo-possessed man has burning red eyes, long nails and no hair.
- name: Werebear Demon
  type: Creature
  description: 12-foot tall bear; terrible gleam in eyes. Roaring, growling.
  habitat: [Craggy Hills, Mountains, Light Forest, Dense Forest]
  habitat_notes: Anywhere humans are found near bears, especially forests near Nords.
  watch: {dawn: 15%, morning: 25%, afternoon: 25%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 10%}
  sparks:
  - In the forest, a bear rises with a terrible gleam in its eye. The bear is covertly possessed by a werebear spirit and attacks.
  - A werebear berserker has slain a terrible manticore. Now it turns to see the adventuring company; it must make a Luck check or attack the company.
  - The adventuring company comes across an uncouth, burly traveler. If they travel together, the adventuring company is in danger, for the traveler is in fact a werebear.
  - A cottager living in the woods is a werebear. Telltale signs are the honey-mead, blackberries and smoked salmon. The cottager allows the adventuring company to stay the night, but warns them not to leave the cottage, while he roams at night as a werebear.
  - A band of Nord mercenaries with bears painted on their shields, willing to hire out. They are upfront about the fact that they are berserkers.
  - In the forest, a Geatish shaman protects a sacred shrine to a great bear spirit. The shaman is a werebear.
- name: Werewolf Demon
  type: Creature
  description: Huge 6-foot long, cruel wolf; fierce eyes. Howling and snarling.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Dense Forest]
  habitat_notes: Anywhere humans are found near wolves.
  watch: {dawn: 10%, morning: 5%, afternoon: 5%, dusk: 20%, early night: 30%, late night: 30%}
  season: {Spring: 70%, Summer: 100%, Autumn: 100%, Winter: 100%}
  sparks:
  - A large, cruel wolf leads a pack of wolves in attacking the adventuring company during the day. After biting the strongest player character and transmitting the covert werewolf spirit, the pack runs.
  - On the night of the full moon, a terrible lone wolf stalks the adventuring company and slaughters, starting with the weakest.
  - The adventuring company meets Anselm, a travelling monk, who explains he was expelled from his order for holding certain unorthodox beliefs. In reality, he was banished for suspicious activity. The monk is actually a werewolf and will murder the adventuring company in their sleep on the night of the full moon.
  - A knight (Sir Garis) disappears for three days every month. During that time, he is a werewolf and prowls the countryside. The adventuring company encounters him at night.
  - A troupe of murdering bandits is led by an especially vicious werewolf (Bors). When they see the adventuring company, they will attack.
  - The adventuring company meets Clark, a hunter. At the first nightfall, Clark, driven by uncontrollable urges, transforms into a werewolf and attacks the company. If wounded, he will flee back to the wilds.
  - In the mud, the adventuring company discovers wolf tracks that abruptly change to human footprints, suggesting the presence of a werewolf nearby. The werewolf is a trapper named Arvin.
  - A knight (Sir Garis) disappears for three days every month. During that time, he is a werewolf and prowls the countryside. The adventuring company encounters him at night.
  - A troupe of murdering bandits is led by an especially vicious werewolf (Bors). When they see the adventuring company, they will attack.
  - The adventuring company meets Clark, a hunter. At the first nightfall, Clark, driven by uncontrollable urges, transforms into a werewolf and attacks the company. If wounded, he will flee back to the wilds.
  - In the mud, the adventuring company discovers wolf tracks that abruptly change to human footprints, suggesting the presence of a werewolf nearby. The werewolf is a trapper named Arvin.
