  habitat: [Settlements, Ruins, Dungeons]
  habitat_notes: Anywhere placed or assisting a wizard.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: All 100%
  sparks:
  - The wax golem is standing waist-deep in a pool of water, pushing a water wheel.
  - The wax golem serves as the wizard's library assistant. It is carefully copying the contents of a book into a fresh book.
  - The wax golem's head is melted, and it stands mute and deactivated.
  - A wax golem's lower body is melted onto a small cart. It scoots around the floor.
- name: Weasel, Giant
  type: Creature
