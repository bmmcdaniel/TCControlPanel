  habitat: [Meadows, Rolling Hills, Light Forest, Dense Forest]
  habitat_notes: null
  watch: {dawn: 30%, morning: 15%, afternoon: 15%, dusk: 30%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 100%}
  sparks:
  - The weasel is stalking a giant viper snake.
  - A weasel is prowling through the underbrush.
  - The weasel is hanging on to the neck of a giant heron.
  - The weasel is listening to something beyond human range. It hears something and its hair stands on end.
  - A weasel is obviously pregnant on the way back to its burrow. If the adventuring company stays the day, it will give birth.
  - Two weasels are playing with a shiny mithril helmet, rolling it back and forth.
  - The weasel is peeing on a tree.
  - The adventuring company spots a giant weasel peering at them from the underbrush.
  - The adventuring company hears sharp barks. A giant weasel is fighting a basilisk. The adventuring company may notice that the weasel is immune to the basilisk's gaze.
  - During winter, a giant weasel is caught in a hunter's snare. It has an especially fine, white winter pelt.
- name: Weathervane Effigy
