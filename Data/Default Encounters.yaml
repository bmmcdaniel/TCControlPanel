  - Suddenly, the birds in the area fall silent. It feels ominous, but nothing happens.
  - The adventuring company hears singing. If they investigate, they find a boulder with a carved face housing an effigy spirit. Flower chains adorn the boulder. The spirit is carefree and talkative, but has little valuable information.
