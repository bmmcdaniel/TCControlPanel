  sparks:
  - A swarm of giant dragonflies descends near the adventuring company, but do not attack.
  - Three giant dragonflies are skimming the surface of a pond, looking for a meal.
  - A bank of thick mist rolls in. From the mists, a buzzing drone. It grows in intensity. Suddenly, six dragonflies buzz through the adventuring company.
  - 20 dragonflies pass overhead, for regions unknown.
  - At river's edge, the adventuring company sees scores of (helpless) dragonfly nymphs. If they linger, they will be attacked by a swarm of giant dragonflies.
  - A loud buzzing from a dragonfly caught in the web of a giant spider of some sort. The spider is not here.
  - A mossling fisher is under attack from giant dragonflies dive-bombing his pirogue. He would be grateful for any assistance. The dragonflies are after his fish.
  - The party comes under attack from giant gadflies. Almost immediately after, giant dragonflies pounce on the gadflies.
  - A vine-carved fey archway stands in the woods. If the adventuring company approaches, a dozen dragonflies guard it without care for their own lives.
  - A hunter carrying a case of giant dragonfly wings asks for help collecting more. He will not and cannot explain his purpose; he is under a geas from an elf sorcerer.
- name: Dwarf, Artisan
  type: Creature
  description: Stocky humanoid with thick beard; sturdy build; tools.
  habitat: [Farmland, Craggy Hills, Roads, Settlements]
  habitat_notes: Often traveling roads between settlements.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Kalvens Oak-Whisperer, a dwarf woodcarver, is carving a face into a linden tree. If asked, he will explain that he hopes it becomes a home for a treowere.
  - Dumi Grime-Finger the dwarf is searching for bog iron in a nearby bog. Although bog iron is often lower quality than mined iron, it can be made with a special greenish color and has magic properties.
  - Kalnins the Whistler, a dwarf jeweler, is traveling to a nearby town, hoping for employment. Kalnins is rather depressed.
  - Gatis the Polisher, the dwarf bellmaker, is traveling to examine Fort Vulgar. He has been commissioned by the Church to cast a fine new bell. The dwarf intends cast the bell from silver brass, hoping it will be especially effective to drive away trolls. Gatis is a devout church member and knows much hidden lore.
  - Svets Sweet-Cloud the dwarf makes fine porcelain pipeleaf pipes, and is searching for wild pipeleaf to cure the interior of his pipes. He will gladly smoke with the adventuring company. He is rather chubby and proud. He will sell his pipes only for very high prices.
  - Zobens Anvil-Singer the dwarf smith is travelling to Lankshorn, hoping to learn moon-forging from Joremy Whilpston. Zobens is a junior swordsmith, who plans to create cold iron swords with mithril runes. He carries a mithril ingot, and will purchase any mithril available from the adventuring company.
  - Dedze Gold-Bender, the dwarf has recently crafted a golden, mechanical bird. The dwarf is attempting to teach it to sing, but the dwarf is not a good singer. The dwarf will gift the bird to any member of the adventuring company that can sing well.
- name: Dwarf, Mercenary
  type: Creature
  description: Stocky humanoid with thick beard; sturdy build; arms and armor.
  habitat: [Farmland, Rolling Hills, Craggy Hills, Mountains, Roads, Settlements, Ruins]
  habitat_notes: Often traveling roads between settlements.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Sakta Shield-Biter and Durvik the Unbent, a pair of dwarf mercenaries, are seeking employment. They are equipped in heavy armor, shields and axes. They are indifferent about the cause they work for; however, they will request extra pay for hazardous activities, including dungeon delving.
  - A band of a dozen dwarven mercenaries are travelling to Castle Brackenwold. Their captain Kvilpaki the Thunderer is willing to travel with the adventuring company (assuming they are headed in the same direction), but will not reveal the reason for their travel.
  - Ralf the War-Boar, a dwarven hero, is on a mission of revenge. A crookhorn bandit named Mashker killed Ralf's brother, and Ralf will stop until he has killed Mashker.
  - A small company of mercenary dwarves recently won a battle. They dwarves are wounded, but happy. They intend to head to the nearest town and get celebratory drunk. They will invite the adventuring company to join them if shown any consideration. Their captain Piotr Pay-Axe is rough "salt of the earth" type, that doesn't mind a brawl or drunkenness. He is generally popular with the company, but some think he is bad with money.
  - A half-dozen dwarf mercenaries are practicing a tetsudo formation- shield facing out, bristling with short spears. Their leader, Rotapet Stone-Stander, shouts commands.
- name: Dwarf, Moneylender
  type: Creature
  description: Stocky humanoid with thick beard; sturdy build.
  habitat: [Farmland, Craggy Hills, Roads, Settlements]
  habitat_notes: Often traveling roads between settlements.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Orzen Copper-Keeper is traveling in disguise, transporting a substantial amount of gold bars from High Hankle to Castle Brackenwold.
  - Ulgen the Shrewd, together with a half dozen human mercenaries, is traveling to Castle Brackenwold. He is in a hurry because he is fearful of the wild.
  - Lakats White-Shirt is searching for unicorn horn. He will trade if he can, but is willing to kill a unicorn to get it.
  - Ziini Silverbeard, a dwarf moneylender, is accompanied by a band of dwarven guards. They are in the service of a wizard is searching for a vein of pure, primeval copper. Through divination magic, he knows that the location is in the northern half of Dolmenwood and is nearby tailings from an ancient copper mine. The actual location is hex 1801. The moneylender is getting desperate, and is willing to pay well if the adventuring company has any information, although the moneylender will reveal his actual purpose only in extremis.
- name: Dwarf, Stonemason
  type: Creature
  description: "Stocky humanoid with thick beard; sturdy build; mason's tools."
  habitat: [Farmland, Craggy Hills, Roads, Settlements]
  habitat_notes: Often traveling roads between settlements, construction sites and quarries.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Uzger Granite is surveying a wooden bridge. He has been commissioned to replace it with a stone bridge.
  - Adzil the Grinner is traveling to Castle Brackenwold, hoping for employment. Adzil is an expert at gargoyles and other stone decoration. Adzil cares mostly about his art, but needs living money. He is likely to complain about the need to work.
  - Stiklis the Tunneler is traveling to Prigwort. The rumor is that Lady Harrowmoor is building defensive fortifications against the Naglord. Stiklis is unkempt and slobby, but fundamentally smart and skilled.
- name: Dwarf, Tinker
  type: Creature
  description: "Stocky humanoid with thick beard; sturdy build; tinker's tools and wares."
  habitat: [Farmland, Craggy Hills, Roads, Settlements]
  habitat_notes: Often traveling roads between settlements.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Pokak Tap-Tap is a tinker making his rounds; he travels between far-flung settlements to sell and repair.
  - Goda Burnt-Finger is heading towards Fort Vulgar. He has heard rumors of a goose that lays silver eggs.
  - Schmeckli the dwarf and his companion scarecrow are happy-go-lucky individuals without a care in the world. They wander the Dolmenwood for fun and adventure. If they survive to winter, the scarecrow will murder Schmeckli.
  - Unser the dwarf is seeking crystals from the crystal caverns (hex 1207) as part of an alloy. Unser is quiet, serious and focused.
- name: Dwarf, Traveling Smith
  type: Creature
  description: "Stocky humanoid with thick beard; sturdy build; smith's tools."
  habitat: [Farmland, Craggy Hills, Roads, Settlements]
  habitat_notes: Often traveling roads between settlements.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Ked the dwarf is carrying ore to a ley-line intersection. He needs to cast the sword blanks at the intersection as part of weaving spells into the sword.
  - Vezote Red-Cloak has heard of a meteor that fell near Drigbolten, and is travelling there in hopes of finding meteoric iron. Vezote is gregarious and curious.
  - Szudens the dwarf is quiet about his reasons for traveling. He actually intends to visit the Naglord's court and offer his services as a blacksmith to the Naglord. Szudens appears friendly and cheerful. He is actually sociopathic and seriously evil.
  - Gudrs the dwarf, a smith, is traveling to his secret cache of bronzewood charcoal. Bronzewood is only found in the depths of the forest, but is especially efficacious for smithing. Gudrs is slow to take action, and will audibly articulate the pros and cons of any situation.
- name: Earth Elemental
  type: Creature
  description: Mass of churning earth and stone; roughly humanoid shape; grinding rocks and rumbling. Deep rumbling sounds.
  habitat: [Craggy Hills, Mountains, Caverns]
  habitat_notes: Anywhere there are masses of pure earth or stone.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 60%, Summer: 60%, Autumn: 100%, Winter: 60%}
  sparks:
  - A wizard has summoned an earth elemental to guard his cavern lair.
  - A gate in the earth's crust allows earth elementals to pass.
  - A powerful earthquake generates an earth elemental.
  - An earth elemental on an unspecified task burrows through solid rock, leaving a tunnel in its wake.
- name: Effigy Armor
  type: Creature
  description: Suit of heavy plate armor carrying a heavy weapon.
  habitat: [Settlements, Ruins, Dungeons]
  habitat_notes: null
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - A suit of effigy armor stands guard in a fairytale castle.
- name: Effigy Statue
  type: Creature
  description: Stone or marble statue of a humanoid.
  habitat: [Settlements, Ruins, Dungeons]
  habitat_notes: Often in gardens.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - A pair of statues standing at the side of a stone arch are the only remnants of an ancient temple. They still guard the arch.
  - Elegant marble statues grace an ancient, overgrown garden. The statues will come to life and dance.
- name: Elf, Courtier
  type: Creature
  description: Elegant humanoid with ethereal beauty; elaborate clothing; often with distinctive magical traits or companions.
  habitat: [Light Forest, Dense Forest, Thorny Forest, Ruins]
  habitat_notes: Wherever mortal lands encroach on faerie.
  watch: {dawn: 20%, morning: 15%, afternoon: 15%, dusk: 25%, early night: 15%, late night: 10%}
  season: All 100%
  sparks:
  - Elves are reclining on upholstered dining chairs in a tangled glade, languidly feasting at a table laden with glimmering provender. At their table are also a number of satyrs. Both the furniture and the food are faerie-stuff. Flicker-of-the-Autumn-Candle will take the lead in interacting with the adventuring company; unless they can prove they are elf-friends, he will imply they should leave.
  - The elf, Sword-Drawn-by-Sunrise, is perched upon levitating divans, dispassionately observing a diseased ogre and a valiant knight engaged in mortal combat.
  - Leaping-Hart, an elf courtier, is trapped within a cube of gel-like green energy emanating from a huge cauldron in the hands of 4 Drune Cottagers.
  - Inside an ivy-covered, ruined tower, Springs-Pour-Forth the elf courtier is treating with a pair of longhorn breggles emissaries (Franwhol and Shreg) of a longhorn noble seeking an alliance with the fairies. (Roll 1d6. 1–2 Lord Malbleat; 3–4 Lord Murkin; 5–6; Lord Ramius.).
  - Promise-of-the-Rosey-Dawn, the elf courtier, is taking a leave of absence from his demanding duties. He sits among birch trees playing a haunting melody on a silver flute. He has attracted a passel of woodland creatures- hedgehogs, weasels, rabbits, voles, a badger and even a stag.
  - Summer-Come-Early, the elf courtier, steps from behind a tree and offers a riddling contest. If the adventuring company wins, he will show them how to enter a fairy road. Consider this riddle- "What always runs, but never walks? Often murmurs, never talks. Has a bed but never sleeps. An open mouth that never eats?"; the answer is a river. Alternate riddle- "I have cities, but no houses; forests, but no trees; and water, but no fish. What am I?" The answer is a map.
  - Crickets-Sing-A-Lullaby, the elf courtier, is hosting a banquet among different factions of elves. Full of light, music and great smells. If the adventuring company enters, the elves invite them to join. However, the banquet crosses into faerie, and when the adventuring company wakes the next morning, they discover that an entire season has passed. And their memory of the night is foggy. However, one member of the company does have a mithril ring...
  - An elf courtier, is weeping inconsolably at a hidden spring; his long hair floating in the water. He is deeply touched at the realization that, in the mortal world, beauty passes with time. He has decided to change his name to "Weeps-with-Vanishing-Beauty." He earnestly asks mortals how they can stand to live like this.
  - Somewhat ridiculously, Eyes-Like-Newborn-Stars is chatting on equal terms with a nutcap mounted on a tree branch.
  - Night-Finds-a-Way proclaims that it is his duty to give one member of the adventuring company, the item that they desire the most in the world. After receiving an answer, the elf ponders a minute, then produces the item with an elaborate flourish. The item is, of course, pure faerie-stuff.
  - Grey-Sails-on-the-Horizon reveals that one of the humans in the adventuring company is actually a changeling, the scion of an elf lord. The courtier provides a gift of a bejeweled, superior quality mithril rapier. Reroll the character's Luck score, taking the new score as higher; the character also gains other characteristics of a changeling. The elf invites the character (only) to travel to Faerie, but warns that several years of mortal time will pass.
  - On behalf of his lord, the elf Falling-Stars-Reflected-on-the-Lake is seeking a specific item carried by a member of the adventuring company. He can offer pastries imbued with suggestion magic, mithril coins or even "a favor from his lord" in exchange.
  - The frost elf Winters-Breath-Soothes is seeking to enlist allies against the Drune. He will (truthfully) tell the adventuring company that a nearby Drune cottager is sacrificing ordinary humans as part of his arcane rituals, hoping to motivate the adventuring company to act against the Drune. Eventually, he hopes to enlist the adventuring company to act as agents inside Dwelmfurgh and even undermine the Ring of Chell.
  - A group of slightly drunk courtiers demand the adventuring company choose a member and dance for their amusement. If they do a good job, they will gift the dancer with a magic rose, granting +2 Luck so long as it is displayed, but causing -4 Luck if it is ever lost. Their names are Keeper-of-Autumns-Secrets, Glass-of-Twilight-Wine, and Laughter-Under-Leaves.
  - A group of elves are headed to Prigwort to purchase wine for the Earl in Yellow. Their leader, Crowned-with-Faded-Lilies, merrily invites the adventuring company to accompany them.
  - Lady Enchanting-Mists-at-Moonrise is borne on a litter carried by 9 goblins. The lady offers a prize to any member of the adventuring company that can amuse her. If one does, she gives a superior quality mithril longsword. Alas it is faerie-stuff and will melt away.
  - Two elves (Impudence-Hath-Victory and Song-of-Silver-Thread), seated on chair-sized mushrooms are playing a complex board game, using nutcaps as game pieces. The elves will shush anyone trying to interrupt them.
- name: Elf, Knight
  type: Creature
  description: Elegant humanoid with ethereal beauty; mithril arms and armor with elaborate decoration; often with distinctive magical traits.
  habitat: [Light Forest, Dense Forest, Thorny Forest, Ruins]
  habitat_notes: Wherever mortal lands encroach on faerie.
  watch: {dawn: 20%, morning: 15%, afternoon: 15%, dusk: 25%, early night: 15%, late night: 10%}
  season: All 100%
  sparks:
  - Blade-Beneath-the-Azure-Sky, an elf knight, is guarding a river ford; all who pass must joust with him. He is equipped with mithril plate armor and is mounted on a faerie horse bedecked in bright blue. If he is defeated, he will tell the adventuring company about how to reach the well of frozen knowledge, hidden in the Ice Prince's realm; this well grants knowledge to those who sup of its waters.
  - Swords-And-Roses, an elf knight mounted on a faerie horse, is questing for his human lover. She demanded that he be worthy of her love, and now he is seeking a suitable challenge. He believes that a particularly powerful wodewose would be appropriate and asks if the adventuring company knows of him.
  - Bound-by-Oaths-of-Ages, the elf knight, will test a mortal's resolve with a strange challenge (choose one of the following)- The mortal must guess the knight's true name; Allow the knight to sever the mortal's hand; The mortal must pluck the beard of a giant; The mortal must find the end of a rainbow.
  - Ancient-War-Horns-Sound, the elf knight, is holding a fallen leaf, composing poetry about mortality.
  - Comets-Cross-the-Night-Sky, the elf knight, is leading a captured griffon with chains of mithril. He intends to take it to his lord through fairy roads.
  - A thick fog. The fog parts, revealing an elf knight (Light-of-the-Sword's-Edge) singing and playing the lute. He beckons the adventuring company to join him, but does not stop his song. He leads the adventuring company on a 30 minute walk. When the walk is finished, they are in hex 0402, and the knight wishes to introduce them to the Lady of Spring Unending. The lady charges the adventuring company to revenge her on a satyr who compared her unfavorably to her sister; she cannot compel the company, but those that refuse cannot leave her lands. See hex 0402.
  - Wielder-of-Ruby-Fire, an elf knight, is seeking a dwarven smith to reforge his broken iron sword.
  - Banners-Softly-Flying, the elf knight, is practicing archery, expertly shooting wild apples.
  - Ward-of-the-Fallen-Court, the elf knight, faces an iron bull. The knight issues a challenge before combat begins.
  - Forest-Speaks-in-Silence, the elf knight and a spright mounted on a sparrow are discussing the fine art of fencing. Any character who listens may choose for any sword they possess to be a favored weapon (displacing a current favored weapon as normal).
  - Wreathed-in-Wars-Fury, a fey knight dressed in all-concealing armor speaks in a hollow voice. He is tracking a mortal human who dared to steal a golden harp from his lord. The knight demands assistance from the adventuring company. Regardless what happens, the elf knight is faerie-stuff and dissolves in the end. If the adventuring company helps recover the goblet, the knight explains that they may keep it as assistance; all he wanted was revenge.
  - Ice-Upon-Stepping-Stones, an elf herald, in a cold aura, appears with a message to the Duke of Brackenwold- "The Cold Prince will not suffer your people to interfere with the punishment of Princess Snowfall-at-Dusk." This a reference to Winter's Daughter. If delivered, the duke has no clue what it means, and asks player characters to investigate.'
  - Valor-Unending, an elf knight, lies mortally wounded, slowly succumbing to the poison of a giant viper (slain nearby). He is conscious, but speaks in a strained, painful voice. He is too proud to ask for assistance, but owes a debt of honor if the player characters revive him.
  - A cruel winter elf (Champion-of-the-Winter-Wind), seeks a suitable champion to duel. He will challenge the member of the adventuring company who appears the strongest. If the elf wins, he will not kill his opponent, but will leave him with a terrible scar that is painful if cold. If he loses, he will surrender his magic rapier that deals cold damage. Other (mortal) members of the adventuring company are magically compelled not to interfere.
- name: Elf, Maiden
  type: Creature
  description: Elegant humanoid with ethereal beauty; willowy frame; long, lacy dress; often with distinctive magical traits.
  habitat: [Light Forest, Dense Forest, Thorny Forest, Ruins]
  habitat_notes: Wherever mortal lands encroach on faerie.
  watch: {dawn: 20%, morning: 15%, afternoon: 15%, dusk: 25%, early night: 15%, late night: 10%}
  season: All 100%
  sparks:
  - Among-Fragrant-Ferns, the elf maiden, is picking oddberries from a bush. If a handsome male inquires, she invites him to join and explains she is making oddberry wine. After a night together, the male has fathered a child on her, and he is left with a taste for "daydreams, poetry, madness, suicide, orgiastic dances, and wild doings under the moon" as well as a longing for faerie.
  - Laughter-Among-the-Reeds, the elf maiden, is looking to steal a human baby. She asks the adventuring company if they know of any recent newborns.
  - Silence-Falls-Like-Night, the elf maiden, is weaving moonbeams into a dress. Motes of faerie lights surround her. The elf maiden is generous to any females, who she invites to join her in the land of faerie.
  - Mists-Cloak-Her-Beauty, the elf maiden, is singing melancholy songs next to a lake, with many fish watching her. She is mourning the loss of her lover, a knight who was humiliated at a faerie tournament and then changed identities. If anyone can cheer her with song or poetry, she will bestow a soft, fine white cloak that grants acute empathy for a season, before fading to grey. (Empathy Cloak- The wearer gains the innate ability to read the intentions and morality of mortals within 40 feet, including attempts to lie or mislead. Requires attunement.).
  - Ivy-Grows-on-Stone, the elf maiden, is casting a spell on her rival. She chants, then tosses strange colored leaves into a pool of water. If the adventuring company interrupts her, she will be furious.
  - Dreams-of-the-Linden-Grove, an elf maiden, is leading a unicorn, feeding it choice morsels and discussing life. Like most of its kind, the unicorn will be favorably disposed towards holy Church members.
  - Gifts-of-Pearls-and-Sapphires, an elf maiden, strides into camp. She tries to pick out the camp's leader. Without any preamble, she demands to know what name the leader would give to his first son. Any answer will satisfy her. As a gift, she gives a mithril arm-ring. She will not reveal this, but she intends to use the name for a child stolen from the mortal realm.
  - She-Lights-the-Waters is swimming naked in a clear forest pool. If the adventuring company makes themselves known, she is angry and demands that they shed all of their clothing and armor, which she then gathers into a cloak and whisks away into faerie.
  - The elf maiden is picking golden apples from a tree. She invites the company to pick a single apple, then disappears. If a single apple is picked and consumed by one member, that person gains 1d6 points of Luck at dawn the next day. If more than one apple is picked, the entire company is cursed with disadvantage on Luck saving checks until the end of the next season.
  - Silver-Leaves-Sigh, an elf maiden, requests that a character journey to the goblin king's market and procure an especially powerful love potion (normal elf potions don't work on fey). She provides payment and directs the adventuring company to the goblin merchant in the buzzing tree (hex 0705).
  - For a single gold coin, kissed by a company member, an elf sorceress (Follow-the-Chroma-Path) offers to show him/her an image of their "everlasting true love." If accepted, she will produce a crystal sphere and the person will see an image of the hag. The elf laughs cruelly then runs away.
- name: Elf, Wanderer
  type: Creature
  description: Elegant humanoid with ethereal beauty; fine but functional clothing; often with distinctive magical traits.
  habitat: [Rolling Hills, Light Forest, Dense Forest, Thorny Forest, Ruins, Caverns]
  habitat_notes: Wherever mortal lands encroach on faerie.
  watch: {dawn: 20%, morning: 15%, afternoon: 15%, dusk: 25%, early night: 15%, late night: 10%}
  season: All 100%
  sparks:
  - Steps-Lightly-Through-Life, the elf wanderer, is swimming in a creek. He has no purpose, other than to experience the mortal world.
  - Dew-on-Cherry-Blossoms, the elf wanderer, is reciting poetry to a group of rapt nutcaps.
  - River-Polished-Stones-Shine, an elf wanderer, is tasting mushrooms gathered from the roadside.
  - Paths-Cross-Without-Pattern, the elf wanderer, is watching the clouds. He prefers not to talk, but will allow the adventuring company to sit with him a while so long as they are silent.
  - Roaring-Waves-Break sits on a boulder, smoking pipeleaf and conversing with a fox.
  - Ancient-Lights-Shine, an elf wanderer, is hiding in a briar patch. He is hiding from Drune who believe he is a spy for the Cold Prince. The elf is not in the service of the Cold Prince, although he is sympathetic.
  - Watchful-Eyes-From-Shadows the elf was formerly a courtier but was banished and as punishment his memory was wiped. He wanders the woods aimlessly.
  - Silver-Revealed-in-Moonlight, the elf, is seeking to taste mortal food. He tries to befriend any cook in the party, and travels with the party for a time. If they can prepare a feast for him, he will be especially pleased and visit the cook once per year thereafter, each time bestowing a small magical gift that lasts one year.
  - Hunting-the-Elusive is curious about the Church. If anyone in the adventuring company is a cleric or similar holy person, the elf will ask to join the company for a while. He is very interested in any holy shrines uncovered. Eventually, the elf will ask to be introduced to Bishop Sanguine or Abbot Hargle. In reality, the elf is a servant of Duke Mai-Fleur who is seeking information about the Church.
  - Born-of-the-Mirror-Gate is a wizardly elf in a black velvet cloak. The elf is actually Lord Gladhand and will send the adventuring company on a quest, then take the role of the antagonist (see DCB).
- name: Elk
  type: Creature
  description: "7-foot long large deer with tan fur; antlers 4 feet wide (males). Deep \"bugle\" call."
  habitat: [Rolling Hills, Light Forest, Dense Forest]
  habitat_notes: Prefers intermixed forest and open.
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - Two stag elk rut in an astonishing show of strength. They will ignore onlookers unless approached very closely. An elk doe stands nearby, awaiting the outcome.
  - Several elk are rising on their hind legs to reach wild apple trees already almost picked clean.
  - Six elk have formed a circle, protecting their juveniles from a pack of wolves that prowl the circle.
  - An elk has tumbled into a pool of chaos. Now it is mutated and maddened. It will rush any creatures it sees.
  - The adventuring company hears an elf's bugle and glimpses an elk stag, its antlers apparently made of pure silver. The elk runs, but it may be tracked. Eventually, it enters a fairy road.
  - A wounded elk stag limps. Its antlers are covered in gore and tentacles from a mass of black tentacles it barely survived.
  - An elk herd takes turns at a crystal salt lick, while others stand guard.
  - An elk has fallen victim to sprites' prank. It stands perfectly still looking at its reflecting in a pool. It will remain there, oblivious to the world unless it is injured.
  - A herd of elk browse peacefully in a glade with a standing dolmenstone, seemingly unafraid of the adventuring company. The dolmenstone may or may not radiate peaceful magic.
- name: Everburning Salamander
  type: Creature
  description: Iron decorative element shaped like a curly lizard; wreathed in red-orange flames. Crackling fire sounds.
  habitat: [Settlements, Ruins, Dungeons]
  habitat_notes: Built into fire objects like forges, furnaces, fireplaces.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - A salamander fuels a wizard's hearth.
  - A salamander powers a magic dwarven forge.
  - In an abandoned dungeon, an ancient salamander is chained by magic to provide warmth. Time and loneliness have made it crazy angry.
- name: Familiar Demon
  type: Creature
  description: Normal version of the possessed animal (cat, goat, owl, rat, raven, toad, viper, or weasel).
  habitat: [Farmland, Settlements, Ruins]
  habitat_notes: Near its witch or wizard master.
  watch: {dawn: 10%, morning: 10%, afternoon: 5%, dusk: 25%, early night: 30%, late night: 20%}
  season: All 100%
  sparks:
  - A familiar stalks the adventuring company, scouting for a local witch.
- name: Fire Elemental
  type: Creature
  description: Mass of churning fire; crackling flames in roughly humanoid shape; intense heat. Roaring and crackling sounds.
  habitat: [Mountains, Ruins, Caverns]
  habitat_notes: Anywhere there are masses of pure fire. Often ephemeral, but may be resident in volcanoes or magma caverns.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 60%}
  sparks:
  - A wizard has summoned a fire elemental to guard his fiery demesne.
  - A bound fire elemental serves as garbage disposal for a fairy castle.
  - A gate in a burning gas crater allows fire elementals to pass.
  - A powerful forest fire generates a fire elemental.
- name: Firefly, Giant
  type: Creature
  description: 1.5-foot wingspan; glowing, bloated abdominal sac produces winking dim light (light green, yellow or orange). Slow, hovering flight.
  habitat: [Light Forest, Dense Forest, Thorny Forest, Fungal Forest, Swamps]
  habitat_notes: null
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 35%, early night: 35%, late night: 25%}
  season: {Spring: 80%, Summer: 100%, Autumn: 60%, Winter: 0%}
  sparks:
  - In a forest glade, suddenly a dozen fireflies light up the night.
  - In the dark of night, a bright yellow firefly arrives. If it is followed, it leads the adventuring company to a huldra's tree.
  - Flowing fireflies linger over a magical spring with healing properties.
  - The failed casting of an arcane spell attracts fireflies corrupted by chaos. The fireflies spit glowing arcane corruption at the party.
  - In the dark woods, a mossling (Smodrom) lights his way with a firefly attached to a string.
  - A stationary blinking light at night. If investigated, it is revealed to be a giant firefly caught in the web of a yellow-banded spider.
  - The adventuring company investigates a cavern. There is a huge cavity, with the lower part filled with water and nesting fireflies at the top. When the adventuring company enters, the fireflies light the entire cavern.
  - At day or night, fireflies are clustered on top of a giant mushroom, slowly eating it.
  - At night, fireflies gather over a new grave. A slow dirge comes from thin air.
  - At night, concentrated blinking in several colors. A Drune cottager (Hancith) has captured a half-dozen giant fireflies in a wicker cage. The Drune intends to use their lights to paint arcane runes as part of a ritual.
- name: Fly, Giant Bluebottle
  type: Creature
  description: 3-foot wingspan; blue-gray body; clear oval wings. Droning buzz.
  habitat: [Meadows, Rolling Hills, Light Forest, Bogs, Swamps, Ruins]
  habitat_notes: Prefers warm, shady environments, especially middens and sewers.
  watch: {dawn: 15%, morning: 35%, afternoon: 35%, dusk: 15%, early night: 0%, late night: 0%}
  season: {Spring: 80%, Summer: 100%, Autumn: 70%, Winter: 0%}
  sparks:
  - The bluebottle flies are swarming on the rotting corpse of a deer. The scatter when the adventuring company arrives, but if the company does not leave, individual flies will make experimental attacks.
  - In a bog, the stench of rotting filth. Giant bluebottle flies appear, but don't attack.
  - Without warning, bluebottle flies fly to a wounded character and bite. Anyone bitten by a fly is exposed to sewer filth.
  - Dozens of giant bluebottle flies are swarming the corpse of a dead human trapper.
  - A handful of giant bluebottle flies are chasing a wounded boar.
  - A mule drover hurries down a trail, his mules burdened by iron ore. Giant bluebottle flies swoop and harass the drover.
- name: Fly, Giant Gadfly
  type: Creature
  description: 3-foot wingspan; black or iridescent green body; clear, oval wings. Droning buzz.
  habitat: [Meadows, Rolling Hills, Light Forest, Bogs, Swamps, Ruins]
  habitat_notes: Prefers warm environments.
  watch: {dawn: 15%, morning: 35%, afternoon: 35%, dusk: 15%, early night: 0%, late night: 0%}
  season: {Spring: 80%, Summer: 100%, Autumn: 70%, Winter: 0%}
  sparks:
  - Smelling a meal, a group of gadflies descend on the adventuring company.
  - Gadflies circle overhead, but they've recently eaten and don't attack.
  - Giant gadflies are buzzing around an aurochs, which can't drive them off.
  - Gadflies aggressively attack the adventuring company. Any person who is bitten is exposed to pox disease.
- name: Fly, Giant Robberfly
  type: Creature
  description: 4-foot wingspan; elongated, segmented body; bristles. Droning buzz.
  habitat: [Meadows, Rolling Hills, Craggy Hills, Light Forest, Bogs, Swamps]
  habitat_notes: Prefers areas populated by giant insects.
  watch: {dawn: 15%, morning: 35%, afternoon: 35%, dusk: 15%, early night: 0%, late night: 0%}
  season: {Spring: 80%, Summer: 100%, Autumn: 70%, Winter: 0%}
  sparks:
  - A giant robberfly bursts from the underbrush angling to a trio of giant dragonflies.
  - Three giant robberflies are sucking on the corpse of a giant beetle. They will leave only as a last resort.
  - A group of giant fireflies circle the adventuring company. They will eventually leave, and will definitely leave if attacked.
  - Robberflies are swarming a giant morscauda scorpion from all sides. The scorpion is wounded and will soon succumb.
  - As the adventuring company passes underneath an old tree, giant robberflies emerge from its branches.
- name: Frog, Maneating
  type: Creature
  description: 5-foot long frog; wet, green skin; yellow eyes. Deep croaks or chirps.
  habitat: [Meadows, Light Forest, Bogs, Swamps, Rivers, Lakes]
  habitat_notes: Prefers moist areas near water.
  watch: {dawn: 10%, morning: 15%, afternoon: 25%, dusk: 30%, early night: 15%, late night: 5%}
  season: {Spring: 90%, Summer: 100%, Autumn: 80%, Winter: 5%}
  sparks:
  - The frog is noisily crunching a giant fly.
  - Beginning at dusk, the frogs croak loudly all night, disturbing the sleep of nearby campers (unless dealt with).
  - The giant frog is laying a string of 6-inch diameter eggs in still waters.
  - A giant leech is attached to the frog's belly, where the frog cannot reach it.
  - The frogs are sitting on giant water lilies, watching for a next meal.
  - The frog lost its rear legs to a giant viper. Now it crawls along on its forelimbs.
  - Three giant frogs attacks without warning, but only Small or smaller characters.
  - A giant gadfly buzzes near the adventuring company. However, before it can attack, a hidden giant frog takes it out.
  - The adventuring company notices that they are being watched by a giant frog in a nearby pond; only its eyes and nostrils are visible.
  - An old woman gathers mandrakes from a shallow, reedy pond. Nearby, her pet three giant frogs watch carefully.
- name: Froghemoth
  type: Creature
  description: 25-foot tall, pear-shaped frog; four tentacles; three bulbous eyes on a stalk; toothy maw with lolling tongue. Deep, guttural rumble; rarely-used croak audible over a mile.
  habitat: [Bogs, Swamps, Lakes]
  habitat_notes: Prefers deep water where it can lurk with only its eyestalk visible.
  watch: {dawn: 10%, morning: 15%, afternoon: 15%, dusk: 30%, early night: 20%, late night: 10%}
  season: {Spring: 90%, Summer: 100%, Autumn: 80%, Winter: 10%}
  sparks:
  - The froghemoth lies in wait, with most of its bulk underwater. Only its eyestalk is above water.
  - A bellowing froghemoth crashes its way through the swamp.
  - The froghemoth is eyeing a pool of tadhemoths.
  - The froghemoth is following a giant slug.
  - The adventuring company hears a deep, guttural rumble, echoing through the swamp. The rumble repeats every couple of minutes. If they track it down, it's a froghemoth.
  - A froghemoth clumsily stalks the adventuring company, the noise of passage audible to all.
- name: Gallows-Wight
  type: Creature
  description: Hanged corpse amid amalgamation of timber beams and ropes; may have chains, gibbet pieces and death bells. Unnatural, jerking movement. Thumping, creaking and rattling.
  habitat: [Farmland, Roads, Ruins]
  habitat_notes: Cross-roads, town outskirts, gibbet fields and places where criminals are left to rot after execution.
  watch: {dawn: 0%, morning: 0%, afternoon: 0%, dusk: 20%, early night: 40%, late night: 40%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - Black Bron, a notorious murderer, was tarred and gibbeted. Now the gibbet is gone, and a gallows-wight stalks the cross-roads at night.
  - Jasper the bandit was hung from the branch of a lightning-scarred oak tree. At night, the adventuring company hears the creaking of branches, then a gallows-wight appears.
  - The adventuring company comes across a gibbet, together with the emaciated corpse. As they stand there, the gibbet unfolds into a gallows-wight.
  - After a siege, the castellan was hung from keep's rafters. Now, a gallows-wight haunts a ruined tower.
- name: Galosher
  type: Creature
  description: Writhing mass of greenish-brown lampreys; in vaguely humanoid congregate shape or dissipated as swarm. Projects phantasmal beauty when in humanoid form.
  habitat: [Bogs, Swamps, Rivers]
  habitat_notes: Marshy waterways and muddy pools.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 10%, late night: 10%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 60%}
  sparks:
  - The adventuring company sees a beautiful woman, playing a lute and singing while sitting on rocks in the middle of a pond. It's a galosher of course.
  - The galosher is standing in a pool of water in the appearance of a beautiful fey, beckoning a marsh hunter to come to it.
  - A galosher is slithering through the underbrush, looking for fresh victims and a new pool. It is not using its phantasmal beauty ability.
  - The galosher is in a stone well chocked with mud and overflowing with dirty water. The galosher's phantasmal beauty ability compels mortals to toss a coin in the well.
  - The adventuring company sees a treasure chest, with fine armor and sword, sitting in a muddy field. It's a galosher.
  - Degery the shorthorn breggle is searching for champions to help the tiny hamlet of Applerun, which has been losing population. See Crisis at Kelpie's Run in separate adventure Dolmenwood Dozen.
- name: Gargoyle
  type: Creature
  description: Carved grotesque stone figure; teeth; horns; claws; wings; often with exaggerated features and leering expressions.
  habitat: [Settlements, Ruins, Dungeons]
  habitat_notes: Architectural features, especially in fantastic locations.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - A clutch of gargoyles guards the entrance to an ancient sorcerer's barrow.
  - A massive gargoyle guards a sacred spring.
  - An enormous dungeon room with many columns. Gargoyles peer down from the columns.
  - A pair of gargoyles guards a minor saint's tomb in a long-overgrown graveyard.
  - The gargoyle is perched as a lookout at the top of a stone tower.
  - Gargoyles are pelting loose roof tiles on passerby's.
- name: Gas Spore
  type: Creature
  description: 2-foot diameter floating sphere; mottled tan and brown; viny growths.
  habitat: [Dense Forest, Thorny Forest, Fungal Forest, Swamps, Caverns, Dungeons]
  habitat_notes: Dim lighting, especially mushroom forests.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 60%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - In the dim light in the darkest part of the forest, the adventuring company sees several floating spheres.
  - Several gas spores float above a violet fungus.
  - In a boggy area, the path winds among fungi, including gas spores. The adventuring company will need to maneuver carefully to avoid the gas spores.
  - Crookhorn breggles have strategically located disguised gas spores near their camp. If they are attacked, they will throw ranged weapons to detonate the gas spored near intruders.
- name: Gelatinous Cube
  type: Creature
  description: Large, tall mound of transparent gelatinous material. Metal items may be suspended inside.
  habitat: [Ruins, Caverns, Dungeons]
  habitat_notes: Avoids sunlight
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 10%, early night: 40%, late night: 45%}
  season: {Spring: 85%, Summer: 100%, Autumn: 85%, Winter: 50%}
  sparks:
  - The gelatinous cube is sweeping a dungeon corridor.
  - The gelatinous cube is sweeping a sewer.
  - The gelatinous cube is hung up on a stalactite.
  - The gelatinous cube recently ate a beetle, and its partially dissolved carapace is floating in the cube.
  - A pierce is stuck inside the gelatinous cube.
  - The gelatinous cube was nearly cleaved in two by a portcullis. Now, it's like two wobbly mounds, slightly kept together at the bottom.
  - The gelatinous cube is laying a trail of podlings.
- name: Ghost, Antler-Wraith
  type: Creature
  description: "Translucent form veiled in heavy mists; stag's skull head with prominent antlers; long, bony claws; empty eyes. Silent, incorporeal movement."
  habitat: [Dense Forest, Thorny Forest, Ruins, Caverns]
  habitat_notes: Tied to dolmen rings and sites where sacrifices occurred.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 10%, early night: 45%, late night: 40%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - The adventuring company nears a dolmen-ring. Antler-wraiths attack, attempting to drag victims to a pit filled with humanoid bones in the center of the ring. The pit reduces the maximum hit points of creatures thrown inside it.
  - The adventuring company hears screaming. If they investigate, they find an antler-wraith is dragging an unlucky trapper back to its dolmen-ring.
  - A pair of Drune cottagers (Keldwyr and Yhornwyr) are attempting to drive an antler-wraith from a dolmen circle. They are using a crystal skull emanating sunlight as an arcane focus, and are backed by bramble golems.
  - A dolmen-ring. The interior or the ring is blasted and blackened; even the sunlight is dimmed to a dusty shadow. Antler-wraiths are bound to the ring, and cannot escape, but will attack anyone entering the ring. Entering the ring also spoils any food, alchohol, herbs, etc. 
  - The antler-wraiths are mystically bound to a ring of wooden stakes. They sacrifice victims by impaling them on the stakes.
  - In ancient times, men were drowned in a peat bog as sacrifice to ancient wood gods. Now, they have risen as antler wraiths. They will try to drown and drag player characters into the peat bog.
  - An enormous black obelisk, with throbbing red veins. If the obelisk is touched, a double-strength antler-wraith materializes, day or night. The antler-wraith wears a cursed golden crown.
  - In the center of a dark, misty lake, is a small island with granite altar carved with skeletons wreathed in arcane energy. If anyone intrudes on the lake, the antler-wraiths (who can walk on water), attempt to drag them to the altar and sacrifice them with bronze knives.
  - In a forest glade, thousands of sharpened antlers are half-buried in the first. Antler wraiths appear and will attempt to drag victims across the sharpened antlers.
- name: Ghost, Banshee
  type: Creature
  description: "Woman's translucent form veiled in heavy mists, merging into floating hair. Frightful groaning and moaning."
  habitat: [Ruins, Dungeons]
  habitat_notes: Tied to the place of death.
  watch: {dawn: 10%, morning: 0%, afternoon: 0%, dusk: 20%, early night: 35%, late night: 35%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - The banshee is gazing at her own reflection in a pool, sobbing, then screaming in rage. Her protector, a cleric, hypocritically abandoned her to marauding soldiers in order to save his life. Now she particularly focuses her revenge on holy types.
  - A banshee emerges from mists over a pond where she, a peasant woman, was cruelly drowned by orc raiders.
  - A noblewoman was murdered, together with her children, and buried in a (now-abandoned tower). Her banshee will not rest until her children are given a proper burial in consecrated ground.
  - A travelling harpist and her entourage were cruelly slain by forest bandits. Now, she haunts the road, particularly preying on those that appear as bandits. While attacking, she plays her ghostly harp; her groan manifests as a doleful chorus.
  - The queen of an ancient Nord kingdom was killed in her family catacombs while pleading for her life. Now, she slays any men entering her catacombs that do not wear the heraldry of her kingdom.
  - A bride was murdered on her wedding day by a jealous suitor, who buried her unconsecrated body in a nearby orchard to avoid detection. Now, her banshee haunts the orchard, which has turned wild.
  - A woman died of rape. Now she appears to the adventuring company at night in a seductive form, beckoning a man to join her. Doing so would be a fatal mistake.
  - On a small tor, a banshee has assembled her bones and decorated it with flowers. If her bones are disturbed, the banshee attacks without warning.
  - A villager was slain by marauders. Now, in the form of a banshee, she wanders the woods moaning and searching for her lost children.
  - A banshee keens from within an abandoned mine. Village children have put jars of fireflies near the entrance to keep her company.
  - A banshee haunts ruins of a manor house. In life, her illegitimate child was taken from her and given to her (married) sister. The banshee seeks vengeance upon her sister and extended family. She will preferentially attack females.
- name: Ghost, Dullahan
  type: Creature
  description: "Knight's translucent form; headless, carrying own head at waist; riding a black horse; veiled in heavy mists. Sound of galloping hooves."
  habitat: [Farmland, Rolling Hills, Roads, Ruins]
  habitat_notes: Country roads and countryside where it died.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 30%, early night: 35%, late night: 30%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - On a country road, the dullahan stops the adventuring company and questions them about its quarry.
  - The dullahan is bearing down on its quarry, who is fleeing from the dullahan.
  - A dullahan haunts the cross-road, challenging all comers to joust.
  - The dullahan challenges a mounted traveler to a night-time horse-race.
  - The dullahan speeds past the adventuring company, intent on a chasing his unknown quarry.
  - The dullahan kneels at the entrance to church grounds. He is unable to enter but begs forgiveness for his sins from all who pass.
  - A local noble seeks help from the party. He has been marked by a dullahan, and now the dullahan rides around his keep every night.
  - Jorrey, a merchant whose great-grandfather falsely testified against a knight, seeks protection from the knight's dullahan. Later, the knight will offer a bargain- hand over the merchant or one of the adventuring company will be marked for death.
  - Gold is scattered on the road. It was scattered there by peasants to appease the ghost of a long-dead knight, who imposed onerous taxes, executed for betraying his vows. If the adventuring company takes the gold, the dullahan will track them mercilessly.
- name: Ghost, Generic
  type: Creature
  description: Translucent humanoid form veiled in mists; appearance based on deceased. Moans and groans.
  habitat: [Roads, Settlements, Ruins, Dungeons]
  habitat_notes: Tied to place of death or other personally significant location.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 30%, early night: 35%, late night: 30%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - Near an ancient Nord battlefield, a warrior's ghost charges the adventuring company. The warrior betrayed its oath to protect his chieftain. Now he is trapped in the mortal realm.
  - A greedy merchant cannot go to rest because of its attachment to its gold fortune, now dispersed. It appears to the adventuring company, carrying handfuls of gold coins. It will not attack if the adventuring company gives it whatever gold coins they hold.
  - The ghost of a young child, lost in the deep woods and cruelly slain by wolves. The ghost is bound to the material plane by fear and longing. It cannot leave the area where it died. It will not attack, but will fade away if its family is brought to the area.
  - Near a bridge, where a jilted lover committed suicide. The lover's ghost, approaches with a melancholic groan. If there are any women in the adventuring company, he switches to anger and will attack them.
  - A miner was trapped in a collapsed mine, dying of starvation while trapped beneath rubble. The miner's ghost lashes out at anyone in anger.
  - A woman's ghost haunts the moors. She is wracked with guilt because her illicit lover, with no alibi, was hanged for murder. He was with her, and she did not speak out.
  - A ghostly piper plays a haunting dirge over the moors, causing fear damage. He cannot rest until another musician accompanies him. The ghost is mute but will try to communicate with gestures.
  - A noble was murdered in his sleep by his corrupt brother, who usurped his title. The noble cannot go to rest until the brother is dead. He will plead with the adventuring company to avenge his rights.
  - A stonemason was betrayed by a fellow guildmember who crushed him beneath a stone. Now the stonemason's ghost haunts the area. He seeks revenge against his former guild. His body can be found crushed beneath the fallen stone.
  - Evil knight(s) were sworn to uphold their lord in life. Now they are cursed in death to guard his tomb. They have a frightful appearance with skull heads.
  - A messenger was killed by a random griffon, and failed to deliver a letter to his lord. His ghost requests the adventuring company to locate the letter and deliver it to the messenger's lord. The letter can be found in a silver scroll case in the griffon's nest.
  - On an ancient battlefield, the ghosts of rival Geat war parties battle each other all night (to different outcomes). A dozen ghosts on each side. Armed with bronze armor and shields, spears and short swords. After 30 minutes, 1-3 ghosts remain standing. During the battle, the ghosts will ignore the adventuring company. Afterwards, they will call out to the company in ancient Geatish "That will show them"; "We have achieved final victory over our enemies"; etc. The next night, all will rise and repeat. If the site is searched, ancient broken bronze weapons can be found.
- name: Ghost, Will-o-Wisp
  type: Creature
  description: Translucent, floating glowing sphere; yellow-green flickering light. Cacophonous moaning.
  habitat: [Bogs, Swamps]
  habitat_notes: Tied to the mire, quicksand, or bog where it drowned.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 30%, early night: 35%, late night: 30%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - Three children chased after a will-o-wisp in the forest mire. Now there are four will-o-wisps. The adventuring company see the lights in the distance, and can choose whether to investigate.
  - One of the will-o-wisps is a hunter. His superior quality bow still lies in the mire. The will-o-wisp suppresses its light until the adventuring company is right next to them.
  - The will-o-wisp is the remains of the paralyzed victim of a dark widow spider. Her webs linger above, but she is immune to the will-o-wisps abilities. If the spider is slain, the will-o-wisp will pass into the afterlife.
  - There are many will-o-wisps here in open water. They were passengers on a boat caught in a rain squall. They boat overturned and they all drowned.
  - A pilgrim was searching for a lost shrine when it was ambushed by a mass of black tentacles. The pilgrim escaped but was stuck in the mud and drowned. Unusually, the will-o-wisp does not try to drown victims. Instead, it telepathically asks them to disinter its body and bury it in consecrated ground.
  - A herbalist searching for witch's oyster fell into quicksand and drowned. Her spirit can be put to rest only if witch's oyster is thrown into the quicksand.
  - Two thieves, chased by guards, fled across the swamps. They drowned, becoming will-o-wisps. Nearby is their loot, silver and gold plates from a church.
  - The will-o-wisp was a Drune apprentice. It retains the ability to cast Magic Darts and Shield with a successful spell check (DC 11).
  - The will-o-wisps were a group of trappers. They are otherwise unremarkable.
  - The Hag (or possibly a harridan) has bound the will-o-wisp into a skull mounted on a pole. While bound, the will-o-wisp cannot take action. There is no deeper meaning; it is just a cruel jape.
  - At night, across the bogs, the adventuring company sees bobbing lights, like a will-o-wisp. If they investigate, it is a Herne, a fisher.
- name: Ghost, Wraith
  type: Creature
  description: Translucent form veiled in heavy mists like a hooded cloak; black, angry void instead of eyes. Silent, incorporeal movement.
  habitat: [Ruins, Dungeons]
  habitat_notes: Tied to the place where it died, especially battlefields and places of violent death.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 15%, early night: 40%, late night: 40%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - A village priest turned away from the worship of the Holiest One, desecrating the altar with unholy rites. He was executed, but his wraith still haunts the abandoned church.
  - On an ancient battlefield, prisoners were butchered and their bodies dumped in a mass grave. Now, those soldiers' ghosts emerge as wraiths at night to slay the living, especially soldier types.
  - An abandoned catacomb, whose builders walled living servants into the walls. While exploring, the adventuring company is surprised by wraiths emerging from the walls.
  - In a necromancer's tower, the necromancer attracted wraiths to act as guards and bound them to the tower. The wraiths appear to be dragging chains, which represent the binding of the necromancer.
  - An ancient Geatish ruin. A young nobleman's promising life was cut short by a surprise nighttime raid by a rival clan. His wraith, jealous of the life of living still haunts the ruin. The wraith will preferentially attack young warriors.
  - At a bridge in the countryside, an innocent horse drover was executed for a murder he did not commit. Only on the night of the new moon, the drover rises as a wraith, seeking to punish the living as he was punished. The drover's wraith focuses his anger on representatives of the law and the Church. The story is known to nearby villagers, who avoid the bridge on the night of the new moon. The drover's wraith is constantly surrounded by a thick mist.
  - An elder, infected with buboes, was hounded out of town to die alone of exposure in the wilds. Now his wraith haunts the roads, seeking to kill the living. His gaunt form exhibits grotesque black buboes on his armpits and neck.
  - A pair of wanderers discovered a vein of gold in a shallow cave. The greedier of the two killed the other to keep it a secret. Now its wraith haunts the cave, refusing to allow anyone to profit from the vein. He wields a pickaxe.
  - A merchant was betrayed by his traveling companion to bloodthirsty bandits, who severely wounded him, and left him helpless to be devoured by wolves. Now the merchant's wraith haunts the road.
  - A laborer was killed when the ditch he was digging collapsed. In order to avoid recompense, the landowner left the laborer's body buried and pretended he knew nothing. The laborer's spirit rose as a wraith, so the field had to be abandoned. Now the wraith haunts the field, attacking all, but especially the wealthy and powerful.
- name: Ghost, Yeth Hound
  type: Creature
  description: Semi-translucent; coal-black fur; yellow eyes; sharp teeth. Maddening howls.
  habitat: [Farmland, Rolling Hills, Light Forest, Roads, Ruins]
  habitat_notes: Near human habitation where the hound was killed by its master.
  watch: {dawn: 0%, morning: 0%, afternoon: 0%, dusk: 50%, early night: 25%, late night: 25%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - As the adventuring company crosses a desolate moor, they hear the yeth hound's dreadful howl. Next, they see the yeth hound standing athwart their path.
  - A cairn-grave holds the remains of the yeth hound's master. Now the yeth hound guards the cairn, even though the yeth hound was killed by its master. The yeth hound will depart if defeated, and its master's grave is opened and his remains scattered.
  - Dunstan (a travelling human) rushes into the adventuring company's campsite, pale and shaking. He explains he is fleeing a yeth hound that is the curse of his family. His great-grandfather cruelly killed a hunting dog, which gave rise to the yeth hound. The yeth hound soon appears, but it will not molest anyone other than the traveler.
  - At a misty pond, the adventuring company hears the howl of a yeth hound. This yeth hound was bound in a sack and drowned by its master in the pond. Now the yeth hound haunts the pond. This yeth hound may walk on water.
  - This yeth hound was killed by a wolfsangel blade trap set by its own master. It haunts the forest. Its body is wrapped in chains which holds the wolfsangel. It can multiattack with both its bite and the wolfsangel (at +3; 1d12 force damage, and reduce maximum hit points by 1d6).
  - An abandoned settlement. At night, a yeth hound howls. The yeth hound was the loyal follower of a renowned local hunter, and refuses to abandon his grave. The rest of his family was driven away by the nightly howls.
- name: Ghoul
  type: Creature
  description: Humanoid; dead eyes; pale, rotting skin; mouth and fingers encrusted with filth. Rotting stench.
  habitat: [Farmland, Roads, Settlements, Ruins, Dungeons]
  habitat_notes: Congregates near cemeteries, necropolises, slums, and places where humanoid flesh can be obtained.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 30%, early night: 35%, late night: 30%}
  season: All 100%
  sparks:
  - A pack of ghouls haunts a cemetery, stealing and eating the flesh of the recent dead. The adventuring company discovers freshly disturbed graves, with evidence that corpses were recently devoured. The ghouls would normally rebury the graves, but they were interrupted in their meal.
  - A pack of ghouls lives in town sewers, from which they issue to kill and eat slum dwellers.
  - A ghoul is chained to a dungeon wall, driven mad by hunger, but unable to die.
  - The adventuring company is trapped in a cabin, assaulted by waves of maddened ghouls who lust to eat them.
  - In the forest wilds, the adventuring company stumbles across a solitary ghoul eating another traveler. Its foul stench means the adventuring company cannot be surprised.
  - Along the roads, the adventuring company encounters Brom, a traveling mercenary who asks to join the party. In the middle of the night, his craving overcomes him and he will attempt to kill and devour the weakest member of the adventuring company, running off afterwards. A DC 20 Intelligence check will reveal something is off about the mercenary; perhaps a whiff of foulness or a craving for raw meat.
  - In the wilds, the adventuring company observes a large group of ghouls migrating, seeking fresh killing grounds. The ghouls recently killed and devoured the people of an entire manor, but there is nothing left to eat.
  - A roadside inn is run by an innkeeper (Afred) whose wife (Maydrid) is a proto-ghoul, chained in the basement. If it looks promising, the innkeeper will kill a lone traveler and feed it to his wife. The adventuring company is unlikely to be targeted directly, but they may be asked by an acquaintance to discover what happened to a missing relative.
  - A ragged child (Ewan) asks for help with his sick father (Grinwit). The child will lead the adventuring company to a remote farm, where his father, a superior ghoul, has killed the entire family, and now waits in the darkness.
  - A village priest (Hymrick) is secretly a proto-ghoul. He will eat the corpse of those he buries, and if there are insufficient burials, he will arrange for an accidental death. He does a good job hiding his craving, but the villagers are increasingly worried about the large number of deaths.
- name: Giant
  type: Creature
  description: 13-foot tall humanoid; crude features; muscled; primitive weapons and hide clothing. Deep, booming voice.
  habitat: [Rolling Hills, Craggy Hills, Mountains]
  habitat_notes: Hills and badlands.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Sleepy Tom the giant is snoring up a storm taking a nap while leaning against a cliff.
  - A pair of giants, Jack and Mack, are in a field, practicing throwing boulders.
  - Tall Ned is cutting trees with a crude iron axe, accompanied by his pet blue aurochs.
  - Some giants (Cam, Tob and Grim) are herding (normal sized) sheep. They are moving them to the entrance of a cave where they will make sheep cheeses for the coming year.
  - Ollie the giant is grumbling and itching. It has an enormous rash from falling in poison ivy. Its two companions, Kit and Bess, are laughing at him.
  - Rough Bran is fishing for a giant pike, using a line of rope and a grappling hook. If the adventuring company waits, the pike strips the bait (a red deer), and the giant asks the adventuring company to procure another.
  - One-Eyed Kit, a cyclops, is smoking a huge pipe of pipeleaf and invites the adventuring company to join him.
  - Ugly, Corman, a cyclops, is sorting through his giant bag of stuff. Arranging, and re-arranging, the stuff.
  - Hal the smith, a cyclops, is hammering iron weapons on its enormous, stone, anvil.
  - Dour Mick, a giant, is poking its head in a cavern entrance.
  - Some giant children (Rob, Tim and Hans) are tossing boulders at ibex goats on a hillside.
  - The adventuring company encounters a fleeing merchant on the road. He explains he was attacked by a giant. A mile further, the Giant Jolly Tom is sifting through the wreckage of an overturned wagon, complaining loudly about the lack anything edible. The giant will attempt to shoo away the adventuring company, throwing pieces of the wagon if necessary.
  - Crooked Abe, a giant, has stolen an entire herd of sheep, and is vainly trying to herd them back to its remote lair. However, the sheep, uncertain and fearful, are scattering.
  - Chief Dunderdale, a giant, and 6 clan members (male and female) are feasting on a brace of freshly killed aurochs. They are in a jovial mood and will invite the adventuring company to join them. After eating, the giants will challenge the strongest member of the company to feats of strength. If the member does well, the giants will deem him "giant-friend" and gift him with a ludicrously oversized spear.
  - The adventuring company hears a low, booming horn. If they follow the sound, they find Wat o' Spikes, a giant on a hill, blowing a horn so large it is mounted in a tree.
  - Hob the giant blundered into a giant wasp nest, and was repeatedly stung. His painful bellowing is audible for a mile. If the adventuring company investigates, he will initially be angry and dangerous. But if the company can soothe his pain, he will be grateful; doubly so if the company agrees to help him take revenge on the wasps.
  - By a muddy lake, Nick Longfinger and his two companions are "noodling", i.e. trying to attract giant mudfish by wiggling his fingers in the water. They are up to their shoulders in water. They have attracted several giant mudfish. See the bonus encounter to Chained Coffin adventure.
  - Lug the whistler, a giant, sits at a river bend whittling an entire fallen tree into a crude lute.
  - Oswald Longlegs is trading with Ernie the merchant. Lug offers giant-forged iron kettles for barrels of witch-liquor.
  - A Drune cottager (Aestgrym) has charmed a giant that was trying to uproot a dolmenstone. The Drune asks the adventuring company to lead the giant far away and commands the giant, Corky, to follow. Once Corky is released from the spell, he will be bemused or angry, based on a reaction roll to the adventuring company.
- name: Giant, Ettin
  type: Creature
  description: 13-foot tall humanoid with two heads; crude features; muscled; primitive weapons and hide clothing. Both heads speak, often arguing with each other.
  habitat: [Rolling Hills, Craggy Hills, Mountains]
  habitat_notes: Hills and badlands.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Lloyd and Floyd, an ettin, is lost in the woods and is arguing with itself about the right way back.
  - An ettin, Crach and Erach, is singing, a melody and counterpoint together.
  - Iolo and Polo, an ettin is resting beside an ancient oak tree, one head asleep. The ettin has a treasure chest full of silver it is carrying back to its lair. The adventuring company may leave it alone. The ettin is easily tricked, but is tougher than normal, with a pair of crude iron swords that deal 1d20 damage.
  - Dagr and Yagr, an ettin, are sitting on boulders, playing Nine Men's Morris with ivory chunks as large as a fist. They are in a good mood, and will invite the adventuring company to sit and play with them. They will be especially pleased if offered alcohol of any type.
  - Yowdah and Fowdah, an ettin, are bathing in a deep pond, washing the irritating oil from an oil beetle (or perhaps a skunk). Their woolens, including a cloak sewed of many human cloaks, lie on the banks. Yowdah will ask the adventuring company if they have soap; if so, he will be grateful and friendly. He has extensive knowledge of the surrounding lands. Fowdah will be resentful and sullen.
- name: Giant, Fomorian
  type: Creature
  description: 12-foot tall humanoid; crude features; pale, translucent skin; lumpy flesh; ungainly limbs; lank hair. Deep, booming voice.
  habitat: [Caverns]
  habitat_notes: null
  watch: {dawn: 0%, morning: 0%, afternoon: 0%, dusk: 10%, early night: 45%, late night: 45%}
  season: All 100%
  sparks:
  - The fomorians are bathing in an underground lake. Their leader, Draiglon, has a deep voice and speaks in cryptic utterances.
  - Morcmala the fomorian is smashing a cave newt with a two-handed club.
  - Gwencadi the fomorian is harvesting giant mushrooms for a hallucinogenic stew. She may invite the adventuring company for a meal if they are friendly.
  - The fomorians are meditating in a circle. In the center is a glowing crystal. In the air, are fungal spores. Caradoghon is their spokesman.
  - The fomorians are chanting in deep tones. Emrysha, Geraint and Hywellough are willing to speak to the adventuring company.
  - Meurbolge, a fomorian, is chiseling flowing, intricate lines in the living stone.
  - Clymwimorg the fomorian is resting amid a profusion of mutant cave plants.
  - Uisdaith the fomorian is standing hip-deep in a natural pool of cavern water. It stares intently at its own reflection, which is distorted and warped. It is unresponsive until actively interfered with.
  - A deep rhythmic drumming echoes through the cave. A group of far-away fomorians are using bones and crude drums to beat out a complex rhythm.
  - Imaghlor a fomorian is carving a crude likeness out of the solid rock. Although crude, the bas relief is strangely evocative. The fomorian will grunt in acknowledgement of the adventuring company but will not speak more than a few words.
  - The adventuring company hears a deep, booming voice speaking in an unknown language. It has a strange echo. If the company investigates, they discover Faelgwyr the fomorian who is talking to a very deep hole in the floor. The hole has no apparent bottom. A pair of other fomorians (Lomdyr and Pellfryth) sit by mutely. The hole does not respond in any audible way, but the fomorian reacts as if it does respond.
  - A group of fomorians (led by Rhaggwyn) are leading cave newts to fodder. Rhaggwyn speaks in soft, dreamy tones.
  - Gorgyren, a fomorian guard, silently guards the passage to the chamber of secrets. It will not allow anyone to pass, but nor will it talk with anyone. The fomorian is especially tough with 85 hit points and +7 attack.
  - Draigalon, a lone fomorian is enacting a funeral ritual for his dead brother. The ritual involves smashing luminous fungi over its body, while moaning a bass tune.
  - At night, Yrgolge, is fishing for giant pike to make a fish stew for his clan.
- name: Giant, True
  type: Creature
  description: 25-foot tall humanoid; fine features; fantastic beard; flowing toga. Deep, resonant voice.
  habitat: [Mountains]
  habitat_notes: Cloud castles, mountaintops and the fabulous city of Byzanz.
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: All 100%
  sparks:
  - A true giant reclines on a marble throne atop a mountain peak, watching storm clouds gather at his gesture.
  - From the mists above emerges a magnificent cloud castle. A true giant leans over the battlements, observing the lands below with disdain.
  - A true giant practices combat with a massive quarterstaff, each swing creating thunderous booms that echo across the valleys.
  - The adventuring company finds enormous footprints, each 8 feet long, pressed deep into the mountainside.
  - A true giant and a storm elemental converse in booming voices about matters of wind and weather, gesturing at the sky.
  - A solitary true giant sits on a cliff edge, plucking a harp the size of a small house, the music carrying for miles.
  - Two true giants play a game using boulders as pieces on a carved stone board the size of a village square.
- name: Gingerbread Golem
  type: Creature
  description: Tan gingerbread; candy facial features; candied arcane symbols on forehead. Warm, spicy scent.
  habitat: [Light Forest, Dense Forest, Settlements, Ruins]
  habitat_notes: Anywhere placed or assisting a wizard or witch.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: All 100%
  sparks:
  - The golems are assisting a witch tend to her oven.
  - The golems are holding children prisoner in an iron cage.
  - A group of gingerbread golems march in single file through the forest, carrying bundles of sweet herbs.
  - The adventuring company smells warm spices. A gingerbread golem stands guard at a cottage door.
  - A broken gingerbread golem lies on the ground, half-eaten by forest animals, its candy features scattered.
  - A gingerbread golem, an emissary of Mother (hex 1206), is sent to spy on Captain Simwise Hogwash of Prigwort. Simwise is growing suspicious of the number of travelers that have disappeared near Mother's cottage.
- name: Glass Golem
  type: Creature
  description: Clear high-sheen glass; fine features and spindly limbs; arcane symbols carved onto forehead. Smooth, fluid motion.
  habitat: [Settlements, Ruins, Dungeons]
  habitat_notes: Anywhere placed or assisting a wizard.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: All 100%
  sparks:
  - The glass golem is maintaining the wizard's telescope and orrery.
  - In an alchemist's laboratory, the glass golem is tending a fiery crucible.
  - The glass golem is made from amber, and has a warm orange glow.
  - A glass golem stands in front of a specially-constructed round window transmitting focused sunlight; its transparent body creates rainbow patterns on the walls. There is no practical purpose here, except the wizard enjoys the impressive aesthetic effect.
  - A glass golem carefully arranges delicate glassware and alchemical vials in perfect order. If the golem's careful ordering is disturbed, it will go berserk.
- name: Gloam
  type: Creature
  description: "Flock form: Swarm of ragged, skeletal crows wreathed in shadows. Man form: Gaunt man hung with bones, feathers and beaks of crows. Cawing and rustling in flock form."
  habitat: [Roads, Settlements, Ruins]
  habitat_notes: Often on the outskirts of civilization.
  watch: {dawn: 10%, morning: 10%, afternoon: 20%, dusk: 20%, early night: 30%, late night: 10%}
  season: All 100%
  sparks:
  - A gloam in man form is offering sugared plums and marzipans to children gathering wood in the forest.
  - A group of children are releasing a man from a gibbet. A gloam in swarm form oversees the proceedings.
  - A gloam roosts at the top of a ruined belltower. It is visible to the adventuring company as they approach.
  - A gloam in rich clothing pays a hunter to bring the corpses of forest animals.
  - A gloam in flock form descends on a merchant, intent on stealing silver trinkets.
  - Under an oak tree, a gloam in man form searches for albino acorns.
  - A gloam approaches the adventuring company, asking for letters signed by nobles. If refused, the gloam insists that the company bring such letters to the same spot in one month, or suffer a horrible fate.
  - A gloam lairs in the attic of a roadside inn. The gloam collects travelers' skulls. The gloam offers protection, and in exchange the lady innkeeper kills a traveler every month. The skull of the innkeeper's former husband is part of the collection.
  - All day, the adventuring company is shadowed by a swarm of ravens. At night, a gloam approaches the campsite, asking for help to collect.
  - A cairn in the woods. Arranged in a deliberate pattern around it are the gloam's collection, interspersed with silver coins. If the adventuring company disturbs the collection or coins, the gloam will track them and attack later that day.
  - A shepherd has gone missing. If the adventuring company investigates, they find his crook and the sheep's bells in a ruined cottage. The shepherd's body is discarded out back. While investigating, the gloam returns.
  - A friendly gloam walks in the woods. It offers to show the adventuring company its collection- a bunch of smooth river stones, silver holy symbols and a handful of tiny rubies. It flies into a rage and attacks if anyone dares to take anything.
  - In the form of a swarm of ravens, the gloam attempts to snatch cloaks or other clothing from party members. As usual, creatures it interacts with are exposed to life rot disease. Back at its lair, a shallow cave in the hills, the gloam cuts the cloaks into pieces and weaves the pieces into a patchwork quilt.
  - At night, the gloam quietly infiltrates the adventuring company's camp. It steals all the shoes and boots of the adventuring company (other than those being worn by lookouts). The gloam lairs at the top of a very tall tree, and it hangs the shoes and boots from the uppermost branches of the tree.
  - At night, a murderous gloam attacks the adventuring company. If it is killed, as it dies it lets out a long caww. Disturbingly, several other cawws echo from the dark woods.
- name: Goat, Ibex
  type: Creature
  description: Tan or white hide; large, ribbed horns. Huffing, snorting and whistling echoing among cliffsides.
  habitat: [Craggy Hills, Mountains]
  habitat_notes: Prefers very steep cliffs.
  watch: {dawn: 25%, morning: 30%, afternoon: 25%, dusk: 20%, early night: 0%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A small group of ibex goats are sheltering under an overhang against high, cold winds.
  - Ibex goats are scrambling up a gravelly cliffside.
  - Two Ibex rams are fighting for dominance.
  - A herd of ibex goats has descended into a small alpine valley cut by a stream. The goats browse on the lush grass, while the alpha ram keeps watch atop a boulder.
  - A lone ibex ram stands atop a nearby crag, silhouetted against the sky. It has a magnificent set of horns. 24 hit points and attacks at +5.
  - The goats take turns licking at an exposed salt vein in the hills.
  - A herd of ibex goats rushes towards the adventuring company. They are panicked from a sabre-tooth lion which prowls slowly behind them.
  - An echoing whistle breaks out, warning of the approach of the adventuring company. The company does not initially see the ibex goats, but may track them if desired.
  - A herd of ibex flees the approach of the adventuring company. A young goat has misjudged a jump, and its foot is now wedged in a crack in the stone. Its mother watches anxiously. The adventuring company may assist the young goat or pass it by.
- name: Goblin, Lurker
  type: Creature
  description: Short humanoid; olive green or slate-blue skin; sneaky demeanor; dark clothing. Quick, chattering speech.
  habitat: [Farmland, Light Forest, Dense Forest, Thorny Forest, Roads, Settlements, Ruins]
  habitat_notes: null
  watch: {dawn: 10%, morning: 15%, afternoon: 15%, dusk: 20%, early night: 25%, late night: 15%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - In deep forest, goblin moonshiners are distilling oddberry wine into extra-strength oddberry port. Their leader, Gribhook, will try to sell wine to the adventuring company.
  - Pubbler, a fearless goblin pickpocket, attempts to pick the pocket of a member of the adventuring company. If caught, he will run away through narrow, low passages (either undergrowth or alleyways, depending on where he is encountered).
  - Szerry, a goblin bandit, dressed all in black, and his dozen minions waylay the adventuring company and demand a toll- half the silver carried by the adventuring company. If fought, the entire group will flee at first blood.
  - Fizzlewick, a diminutive goblin bird-hunter, sits in the bushes, whistling for bluejays. Fizzlewick is cheerful and plays dumb.
  - Niblet, A goblin minstrel strolls nearby, singing fairy lullabies.
  - Knub, a snarky goblin, rides Bartleby, a dumb ogre. The goblin advises that the adventuring company is a "few straws short of a broom" but offers advice in exchange for a favor to be named later. The advice is actually surprisingly good. The future favor will arise later.
  - An abandoned and collapsed cottage is the home to a gaggle of goblin bandits led by Murple the Black. They've taken a woodcutter (Peeze) hostage, hoping to ransom him to his family.
  - Goblin sneaks (Glim, Plonkle, Wigger and Sprock) are following the adventuring company. At night, they will quietly infiltrate the company's campsite and make off with whatever portable loot they can find. The goblins leave lots of footprints.
  - Goblins (Blotch, Klink, Zobble, Stink and Zark) are searching for bones, especially human bones. They will sell them to a local necromancer.
  - Squinck the Sharp, a goblin, is running a dice game, attended mostly by mercenaries, hunters and trappers. The game is fair, although the goblin is taking an enormous rake. If the adventuring company stays and watches, a buff mercenary, angry at losing, claims the game is fixed and tries to throttle the goblin.
  - Fleem the goblin is crying out for help. If the adventuring company investigates, the voice comes from a hollow under a moss-covered boulder. It is a DC 17 Strength check to move the boulder. Fleem, a goblin apprentice wizard, is hidden in the hollow underneath. The goblin has saggy, wrinkly skin. The goblin is not particularly grateful and will not explain his predicament, but will offer the adventuring company a single boon, so long as they swear to never thank the goblin.
- name: Goblin, Merchant
  type: Creature
  description: Short humanoid; olive green or slate-blue skin; fine clothing, mercantile wares and pouches. Fast-talking, wheedling speech.
  habitat: [Farmland, Light Forest, Dense Forest, Thorny Forest, Roads, Settlements, Ruins]
  habitat_notes: Near human settlements, markets, and trade routes.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The goblins crowd around a golden haired maiden (Gwenellyn) in a glade, proffering syrupy Fairy Fruits (DCB) on silver platters and oddberry wine. Her sister (Hurrillyn) peeks out from behind a nearby boulder, fearful of the goblins.
  - The goblins, led by Sark the Golden, are arguing with satyrs, led by Ophyridon, over the value of a sack of satyr wine (10 sacks to be precise). The goblins wish to trade it for a promissory note.
  - The goblins are running away from an old woman whom they have duped with faerie-stuff trinkets. The leaders are Nod and Weezint.
  - Tickety, a goblin peddler, offers to sell "happiness, guaranteed" for a mere 10 gp per bottle. If a bottle is opened, the opener is infected by faerie laughter for 1 minute (the opener may choose to resist by succeeding on a DC 15 Luck saving check). The laughter is genuine, but doesn't grant true happiness.
  - Scamber the goblin is taking bets for a fight between an asp and a large rooster.
  - Sibbler, a goblin puppeteer, is putting on a show. Anyone who watches the whole show must make a DC 10 Heart saving check. Failure means that the watcher is charmed by the goblin for 1 hour. The goblin will attempt to gather useful information from charmed watchers, then sell it to whoever might pay for it- bandits, witches, rival adventurers, the local constabulary, ...
  - Quarl the goblin claims he knows the way to the goblin market, and will guide the adventuring company in exchange for magic item. 50% chance the goblin is lying.
  - Winken the goblin has a wagon and is transporting burdock beer for another goblin merchant (Bink).
  - Grindlegrim the goblin invites the adventuring company to take a shortcut through his bramble labyrinth. If his offer is accepted, the company cannot exit until they pay his ransom.
  - An unnaturally tall and thin goblin dressed in purple velvet and silks. He is the master-monger, a mysterious goblin merchant with no other name. The master-monger will buy all kinds of things, paying in gold and silver. The only things he sells are tickets to the goblin market. He calls everyone "my dear friend."
  - Pingle the goblin merchant offers to sell wyrm scales for 50 sp apiece. The scales are actually painted fish scales (from a giant carp).
- name: Goblin, Scrub
  type: Creature
  description: Short humanoid; olive green or slate-blue skin; ragged clothing. Chattering, excitable speech.
  habitat: [Farmland, Light Forest, Dense Forest, Thorny Forest, Roads, Settlements, Ruins]
  habitat_notes: null
  watch: {dawn: 10%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 15%, late night: 15%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Drul the goblin is busily sweeping the forest floor. If questioned, he will explain that he's been cursed by a terrible witch.
  - A half-dozen goblins (led by Hogseal) are dragging a huge, iron cage. They chirpingly suggest that a member of the adventuring company should step inside and test it out; "be a good sport."
  - The goblins (Bummy, Gummy and Tog) are prancing around to jaunty pipe music, playfully tossing a human baby into the air. They intend to trade the baby to elves.
  - A trio of goblins (Cherry, Perry and Oona) have firebombed a merchant's wagon. Now, they dance around in glee as the wagon goes up in smoke.
  - Merriwether the goblin is sitting on a toadstool, sobbing. It has lost its favorite shiny rock and is inconsolable.
  - Goblins drunk on mushroom whiskey are screeching in laughter, while dancing a jig. They drunkenly yell for the adventuring company to join them.
  - Gibbly, the goblin fisher is luring fish in a stream by wiggling his fingers.
  - Hilda, an elderly goblin crone, hobbles through the woods. She is heading towards the narrow way fairy road (hex 0309) or the king of woodgrues (hex 1704).
  - Erl, a goblin dandy, is searching for the most beautiful wedding dress in the world. The young Lady Priscella Anbury at Castle Everdusk said she would marry the goblin only if he brought such a dress to her.
  - Agri the goblin has fungus and mushrooms growing on his body. He is a rebel, rebelling against the goblin shroom-king and wants to recruit the company to his cause. (See separate adventure Infinite Caves of the Shroom Goblins).
  - A goblin falls out of the sky and lands, with a final crunch, near the adventuring company. Amongst the remains is a pouch of gold dust and a simple map showing the way to the Grotto of the Golden Gargoyle (see separate adventure Grotto of the Golden Gargoyle).
- name: Green Slime
  type: Creature
  description: Dark green, slimy curtains or patches. Dank, sour or decay smells.
  habitat: [Swamps, Ruins, Caverns, Dungeons]
  habitat_notes: Dark, damp locations, away from sunlight.
  watch: {dawn: 20%, morning: 10%, afternoon: 10%, dusk: 20%, early night: 20%, late night: 20%}
  season: {Spring: 90%, Summer: 100%, Autumn: 90%, Winter: 60%}
  sparks:
  - The green slime is on the ceiling or walls. It will drop onto unsuspecting creatures that walk below it.
  - The adventuring company finds pool covered with thick algae. If the algae is disturbed, it turns out to be green slime.
  - A dead human (vintner checking his barrels or lost child) lies on the ground, its body being slowly devoured by green slime.
  - A magic fountain spurts green slime in the air, in a continuous cycle. If a person approaches within 10 feet, they get spattered, taking 1 point of acid damage.
  - A glass bottle is filled with a viscous, green liquid. It is actually green slime. It was intended to be used as a grenade, but drinking it will likely be fatal.
- name: Grell
  type: Creature
  description: 9-foot tall floating brain with trailing tentacles and beak; no eyes. Silent floating movement.
  habitat: [Craggy Hills, Ruins, Caverns, Dungeons]
  habitat_notes: Prefers high verticality.
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: All 100%
  sparks:
  - In a tall cavern room, a grell waits silently in the dark to ambush.
  - A nest of three grells writhes together, their tentacles intertwined. What is the reason? Who knows.
  - A grell is dragging a giant crayfish out of an underground river.
  - A pair of grells lie on the floor, helpless and paralyzed after eating the wrong fungus.
  - An adventurer's corpse lies on the floor, gold coins strewn about it. Above, hiding in the shadows is the grell that set this trap.
  - A grell floats by, a paralyzed cave orc grasped in its tentacles.
  - A grell is stuck phased half-in/half-out to a dolmenstone. If the adventuring company waits an hour, a Drune cottager (Wargfole) will come by. He will initially accuse the company of tampering with the dolmenstone.
- name: Griffon
  type: Creature
  description: 8-foot long creature with foreparts of an eagle and rearparts of a lion. Screams like an eagle.
  habitat: [Rolling Hills, Craggy Hills, Mountains]
  habitat_notes: Eyries built in high cliffs and peaks.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 25%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A flight of griffons passes overhead. If they see horseflesh, they will dive and attack.
  - A griffon wearing a saddle is rubbing against a tree, trying to remove the saddle. What happened to the rider? Maybe it was killed, maybe the griffon pushed it off.
  - A griffon perches alone on a cliff. It will not immediately attack. But if it sees horses, it will scream to attract other griffons.
  - A griffon is carrying a pony back to its nest to feed its young.
  - A flight of griffons is playfully diving against ibex goats, chasing them around cliffs.
  - A single griffon with a wounded wing must walk back to its nest.
  - Griffons screech, trying to panic horses to flee and separate from the adventuring company. If they fail (i.e. The company manages to control the horses), they will not attack.
  - A griffon carries off a sheep from a flock. A shepherd is in effectually shooting a sling at it.
  - A pair of griffons fly overhead, in an intricate courtship dance.
  - An unusual golden-colored griffon is perched atop a peak, surveying the adventuring company.
  - A griffon mother is leading her four small young; the young griffons fly clumsily.
  - Griselda the witch rides a griffon through the dusk sky.
  - A master hunter (Wilsey) approaches the adventuring company. There is a griffon nest atop a sheer cliff. If the adventuring company can keep the griffons away from him, he will split all griffon eggs he finds with the company.
  - A griffon is sharpening its claws on a birch tree, while another griffon watches.
  - A surprised griffon bursts from the undergrowth ahead, taking flight. Once it is flying, the griffon watches the company warily, but will not attack and will flee if attacked.
- name: Halfling, Artisan
  type: Creature
  description: Small humanoid with cheerful demeanor; practical clothing; tools. Friendly, conversational speech.
  habitat: [Meadows, Farmland, Rolling Hills, Roads, Settlements]
  habitat_notes: Primarily rural areas near settlements.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Bean the halfling cook is searching the woods for a perfect hogscap truffle. His sense of smell is excellent, so he doesn't need to rely on a dog or a pig.
  - Tobias, a halfling cook, is traveling to Castle Brackenwold, hoping to find employment in the castle's kitchens.
  - Emmet, a halfling cook, is preparing a feast from a massive razorback boar, flavored with wild garlic and fingermint.
  - Fenwick, a halfling minstrel, is singing bawdy songs to squirrels or other woodland creatures, oblivious to any danger.
  - Gareth, a halfling peddler, is offering a selection of "the finest pipeleaf in the duchy" from his mule-drawn wagon. The peddler loves to haggle and will sell at a lower price to anyone who haggles rather than demanding a final price ("thats quite rude").
  - Evard, a halfling, approaches the adventuring company and inquires whether they "might be in need of a professional burglar." He offers to work for "a reasonable share of the treasure" and dismissively warns against "amateur, gentlemen burglars." He actually is quite skilled, but he does have a chip on his shoulder.
  - Among a party of merchants, one is a halfling pickpocket (Sheldon). He will attempt to pick the pocket of a member of the adventuring company. If found out, he will cheekily explain that he was just curious about what the person was carrying.
- name: Halfling, Scout
  type: Creature
  description: Small humanoid with cheerful demeanor; practical, outdoorsy clothing; tools. Conversational speech.
  habitat: [Meadows, Farmland, Rolling Hills, Craggy Hills, Light Forest, Dense Forest, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 25%, morning: 25%, afternoon: 20%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Benwick, a halfling scout, is spying on crookhorns on behalf of Lady Harrowmoor.
  - Ashford, a halfling trapper, is setting a snare trap, hoping to catch a nice, fat deer.
  - Vernon, a halfling, is scouring the woods, looking for witches to undo a fey curse that makes food tasteless.
  - Darby, a halfling treasure hunter, has located a nearby barrow mound, and offers to split the treasure with the adventuring company (50-50, but may be negotiated down to 33-66) if they will accompany him. The treasure hunter is jovial and skilled, but worthless in combat.
  - In the morning, the adventuring company finds a note left by a halfling bandit, Blackburn the Sly. It warns them that "Blackburn, the famous bandit" could kill them in their sleep, and tells them to leave behind at least 20 gp. If they refuse, Blackburn won't actually follow through on the threat but will trail them for several days.
  - Irvin, a halfling, rides dropped on the back of a boar. Now the angry boar tears through the woods, hoping to shake the halfling off. The boar and halfling run the adventuring company, giving them only seconds to react. The halfling yells "Heeelp" and will be grateful if the company can stop the boar.
  - Yorn the halfling cartographer is attempting to discover (and map) all the faerie roads in the Dolmenwood. So far, he knows Buttercup Lane, Skipping-a-Derry and the White Way (DCB p 26). He is willing to trade information about the fairy roads he knows, for those he doesn't. He could be convinced to join the adventuring company.
  - Holly, a halfling falconer is hunting with her peregrine falcon. She already has a brace of rabbits. She is very talkative and gossipy, and would prefer to travel with the company for a day. She is an excellent cook.
- name: Halfling, Wanderer
  type: Creature
  description: Small humanoid with curious expression; well-worn traveling clothes and pack. Friendly, talkative speech.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Dense Forest, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - Broadfoot, a halfling wanderer, driven by intense curiosity, is searching for an entrance to a fairy road. The halfling is skilled in hiding, but steps out (from underbrush or a hollow tree) to introduce himself to the adventuring company if they look friendly.
  - Milton, a halfling collector, is searching for a pink wildflower called a "ladyfinger." He intends to give it to his niece on her birthday.
  - In a sunny glade, a halfling (Hollis) lies among the wildflowers, enjoying a moment's respite. He has no particular reason to be where he is.
  - Draper, a halfling beekeeper, is searching for exotic queen bees. He will ask the company if they've seen any bee colonies.
  - Caldwell, a halfling pastry chef, is seeking only the finest rhubarb for a special pie. Next time the company is in town, he invites them to sample his wares. (Alternately, a halfling brewer is seeking wild hops.).
  - Phineas, a halfling wanderer, approaches the adventuring company's campsite. He offers to swap stories of what he's found in nearby locations. He says he has giant heron eggs to share for breakfast.
  - Clover, a halfling collector, is looking for barrowbogeys, hoping to exchange some shiny new pots for their ancient pots.
- name: Harpy
  type: Creature
  description: Short, scrawny woman with vulture legs, tail and wings; saggy skin; human arms. Cackling, screeching, or haunting song.
  habitat: [Craggy Hills, Light Forest, Ruins, Caverns]
  habitat_notes: null
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The harpies are talking with a witch, bargaining over arcane secrets.
  - The harpies are taunting and screeching at a band of frustrated crookhorns.
  - The harpies are devouring an unfortunate friar. Blood and gobbets of flesh drip on the ground.
  - The harpies are shrieking at a giant adder that is in their favorite tree.
  - The adventuring company hears a beautiful, haunting melody drifting through the woods. If they move closer, they will need to make saving checks or be charmed. The harpies are in a ruined barrow (exposed to the sky) and will be visible only long after their song is heard.
  - The adventuring company meets a skilled hunter (Hastings) who invites them to return to his camp. Unfortunately, the hunter is charmed by harpies and he will lead them into an ambush.
  - A pair of harpies are servants of Atanuwë, and will spy on the adventuring company. If discovered, they will flee, leaving the adventuring company only 1 round to react. They will later guide a group of crookhorns to attack the company.
  - A single powerful barrow harpy (26 hit points, +6 on attacks) lairs inside a long, hollow tunnel, filled with the bones of her victims. The tunnel echoes her shrieks causing disadvantage on the saving check.
  - A blind harpy rests in a tree. She will not attack, but will babble about the truth about Big Chook, the dragon Gheillough and the chaos demon Atanuwë (see hex 606).
  - A witch (Tabitha) and her two apprentices (Cornelia and Henaine) confront a flock of a dozen harpies. The witches insist on the harpies leaving the area which is important to the wood-gods, but the harpies refuse, leering and screeching. The witches know the harpies are too powerful to fight. If the adventuring company does nothing, the witches will eventually withdraw, humiliated.
  - The harpies are perched on a petrified troll, laughing and screeching. Even though their charm doesn't work on fey, they tricked the troll to stay until sunrise. "Look what we did" they warn the party "and we'll do the same to you if you don't leave immediately."
- name: Harridan
  type: Creature
  description: 10-foot tall woman with crude features; disproportionately large head; light green or lavender skin; tusks. Foul stench.
  habitat: [Dense Forest, Thorny Forest, Bogs, Swamps, Ruins, Caverns]
  habitat_notes: Typically lives in isolated cottage or cave.
  watch: {dawn: 10%, morning: 15%, afternoon: 15%, dusk: 30%, early night: 15%, late night: 15%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Sketha the harridan is trying to summon a spirit into a treowere. She is capering around an old elm, flicking it with goo whilst reciting words of magical power. The tree already has a face carved in the trunk.
  - The harridans, Dorcas and Florian, are dragging a succulent, unconscious young beauty away to her cottage. The harridans plan to cage, fatten, and roast the unfortunate.
  - Esme, a harridan, is drawing the stinking entrails from a freshly slain elk. She suspends them above a green, sparking fire. The harridan wails as she receives divinatory visions.
