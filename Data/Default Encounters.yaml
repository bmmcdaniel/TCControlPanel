  habitat: [Bogs, Swamps, Rivers, Caverns, Dungeons]
  habitat_notes: Prefers water or damp areas. It avoids sunlight.
  watch: {dawn: 15%, morning: 10%, afternoon: 5%, dusk: 20%, early night: 30%, late night: 20%}
