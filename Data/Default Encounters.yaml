version: 1
encounters:
- name: Air Elemental
  type: Creature
  description: Mass of churning air; barely visible except as distortion and movement; howling winds. Rushing wind sounds.
  habitat: [Mountains]
  habitat_notes: Anywhere there are masses of pure air, especially high altitudes.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 80%, Autumn: 100%, Winter: 80%}
  sparks:
  - A wizard has summoned an air elemental to guard his lofty tower.
  - A gate in the upper atmosphere allows air elementals to pass.
  - A powerful storm generates an air elemental.
  - The adventuring company feels sudden, powerful gusts of wind swirling around them - an air elemental investigates intruders on behalf of its wizard master.
  - An air elemental whirls through mountain peaks, scattering clouds and snow.
  - In autumn, a playful air elemental creates a vortex of fallen leaves.
  - In mid-spring, an air elemental rides the warm foehn winds down a mountainside. Snowdrifts melt rapidly in its wake, swelling a stream into a flash torrent that may threaten the adventuring company or a bridge below.
- name: Ankheg
  type: Creature
  description: 12-foot tall mantis-like insect; serrated arms; mandibles; multifaceted eyes; brown chitinous carapace. Clicking mandibles.
  habitat: [Meadows, Rolling Hills]
  habitat_notes: Prefers dry and sandy plains with dirt suitable for burrowing.
  watch: {dawn: 15%, morning: 30%, afternoon: 30%, dusk: 15%, early night: 5%, late night: 5%}
  season: {Spring: 80%, Summer: 100%, Autumn: 60%, Winter: 0%}
  sparks:
  - The adventuring company comes across the crumbling lip of a hole. At the bottom is an ankheg, waiting to pounce.
  - An ankheg is digging a new pit-burrow.
  - A terrified horse is trapped in an ankheg pit. The ankheg waits below until the horse is exhausted.
  - The ankheg is fleeing from a land shark.
  - In late summer, a female ankheg has deposited a dozen eggs in a frothy, foamy case in a shallow burrow. The ankheg is covering the burrow with sand when the adventuring company discovers her.
  - In spring, a small, young nymph is shedding its exoskeleton. It is helpless until it is complete.
  - In late autumn near a trail, an ankheg is sluggish and slow, digging deep to escape the coming frost. Its burrow has the skeletal remains of several humans; they may have small amount of treasure.
- name: Atacorn
  type: Creature
  description: Ash grey, dark red or slate black horse; single blackened horn; black or dark red mane and tail; often has a goat beard.
  habitat: [Dense Forest, Thorny Forest]
  habitat_notes: null
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: All 100%
  sparks:
  - An atacorn is leading a band of breggle crookhorns to a dolmen for a wicked rite.
  - A unicorn and an atacorn are locked in a brutal duel beneath dripping boughs.
  - An atacorn is befouling a saint's hidden shrine.
  - A two-headed atacorn—one head constantly spewing curses—prowls the fog.
  - Mists rise in dense trees; an atacorn springs from the underbrush to charge.
  - During winter, the adventuring company finds a trail of nasty, black frost. If they follow, it is the trail of a corrupt atacorn, which radiates unnatural cold.
- name: Atanuwë
  type: Creature
  description: Mutable, shifting through an unsettling variety of structure, composition, and color.
  habitat: [Thorny Forest]
  habitat_notes: Nagwood (hex 0904).
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: {Spring: 80%, Summer: 90%, Autumn: 100%, Winter: 100%}
  sparks:
  - Atanuwë (see DCB pg 45) is travelling with a horde of breggle crookhorns, harridan soothsayers and fomorian giants, as well as a pair of atacorns.
  - Atanuwë (see DCB pg 45), accompanied only by a crookhorn sorcerer is consulting a harridan soothsayer about an upcoming blood moon.
- name: Aurochs
  type: Creature
  description: Heavy-set bovine with 3-foot wide horns and black hide. Low mooing, warning bellows.
  habitat: [Meadows, Rolling Hills, Light Forest]
  habitat_notes: null
  watch: {dawn: 25%, morning: 15%, afternoon: 25%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A herd of aurochs browsing in tall grasses.
  - In early spring, an aurochs cow is calving.
  - A lone, wounded aurochs bull is being hounded by a wolf.
  - An aurochs is rushing crazily; the aurochs has eaten crazy weed. After 10 minutes, the effects wear off.
  - A massive, but ancient aurochs bull is infected with spores. He has laid down in a meadow and will die unless treated.
  - An aurochs calf is separated from its herd. It will follow the adventuring company at a distance, mewing plaintively. Its mewing will attract predators unless reunited with its herd or otherwise comforted.
  - An aurochs bull has been corrupted by a spot of chaos. Its eyes glow red and polyps coat its face and body. Its gore attack does an additional 1d6 acid damage.
  - In late summer, a pair of massive bulls fight for dominance of the herd (prepatory to their mating season).
  - In autumn, an aurochs bull in full rut bellows from atop a low hill, his voice carrying for miles. He will charge anything that approaches — the adventuring company, their mounts, or even a passing cart.
  - In midwinter, a small herd of aurochs has taken shelter in a ruined longhouse, their body heat keeping the ruin surprisingly warm. A lost herder has been sleeping among them for days, but fears the herd will soon move on.
- name: Badger, Argentvorax
  type: Creature
  description: 6-foot badger with silver fur; black iron claws and teeth. Chittering or growling; barking when surprised.
  habitat: [Rolling Hills, Craggy Hills]
  habitat_notes: null
  watch: {dawn: 15%, morning: 10%, afternoon: 10%, dusk: 20%, early night: 25%, late night: 20%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 25%}
  sparks:
  - A pair of argentvoraxi raids the adventuring company's camp at night, seeking silver to devour.
  - An argentvorax is scratching at a silver vein in exposed rock, prying the soft silver ore with its iron claws.
  - An argentvorax emerges from a stream, noisily shaking water from its fur.
  - An old, scarred argentvorax stands athwart the adventuring company's path, snarling viciously. He is protecting his family, and will not back down.
  - Deke the tinker stands atop a boulder. At the bottom of the boulder is an argentvorax, which hungers for his silver.
  - A docile argentvorax eats silver coins from a child's hand. The argentvorax will snarl in warning if the adventuring company approaches, but will flee if attacked. The child (Ray Earl) collects the silver from a hidden cache of ancient Nord coins; he will refuse to share the location with the adventuring company.
  - At an abandoned silver mine camp, an argentvorax chews the tailings. Pickaxes, lumber and other supplies are scattered nearby.
  - In early spring, a gaunt argentvorax has just emerged from its winter den, ravenous for silver. It has chewed through the iron hinges of a shepherd's gate to reach a silver bell hanging inside.
- name: Badger, Aurumvorax
  type: Creature
  description: 6-foot badger with golden fur; black iron claws and teeth. Chittering or growling; barking when surprised.
  habitat: [Rolling Hills, Craggy Hills]
  habitat_notes: null
  watch: {dawn: 15%, morning: 10%, afternoon: 10%, dusk: 20%, early night: 25%, late night: 20%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 25%}
  sparks:
  - A pair of aurumvoraxi raids the adventuring company's camp at night, seeking gold to devour.
  - An aurumvorax is scratching at a silver vein in exposed rock, prying the soft silver ore with its iron claws.
  - An aurumvorax emerges from a stream, noisily shaking water from its fur.
  - An old, scarred aurumvorax stands athwart the adventuring company's path, snarling viciously. He is protecting his family, and will not back down.
  - Poggle the goblin merchant stands atop a boulder. At the bottom of the boulder is an aurumvorax, which hungers for the goblin's gold.
  - A docile aurumvorax eats tiny gold coins from a child's hand (. The aurumvorax will snarl in warning if the adventuring company approaches, but will flee if attacked. The child (Rivo) collects the gold from a hidden cache of ancient Geatish coins; he will refuse to share the location with the adventuring company.
  - In late autumn, an aurumvorax has dug up a buried Geatish torc of solid gold. It gnaws the torc contentedly, slowly consuming it. The torc is still mostly intact and very valuable — if the adventuring company can take it.
  - In midwinter, a rare sight: an aurumvorax abroad in the snow, driven from its den by a tunnel collapse. It is sluggish with cold and will not fight unless cornered, but it clutches a half-eaten gold coin in its jaws.
- name: Badger, Giant
  type: Creature
  description: 6-foot badger with coarse grey and black striped fur; powerful digging claws. Hissing, snarling, and chattering sounds.
  habitat: [Rolling Hills, Craggy Hills, Light Forest, Dense Forest]
  habitat_notes: null
  watch: {dawn: 15%, morning: 10%, afternoon: 10%, dusk: 20%, early night: 25%, late night: 20%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 25%}
  sparks:
  - A giant badger has slain a hunting dog that accidentally tracked it.
  - An elk's antler broke off in a fight with the giant badger. The antler is impaled in the badger's cheek, preventing it from eating and blinding one eye. The badger is both scared and angry. If not helped, the badger will starve.
  - The giant badger ate a tree full of fermented fruit. Now it is drunk.
  - The giant badger has turned over a rock, and is crunching on the crabs it found underneath.
  - A giant badger is digging out a cache of Geatish treasure. As the adventuring company watches, it digs out rusted swords, chainmail, a gold cup, a copper pot and a ceramic jar. The badger will smash the jar, and greedily eat the (ancient) pickled apples inside.
  - A fiddler playing a soothing tune to an entranced badger.
  - A giant badger is in process of breaking down a wooden smoke shack. Inside is a smoked hog which it will greedily devour.
  - In spring, a giant badger sow leads three cubs from their sett for the first time. The cubs tumble and wrestle in the grass while the sow watches. At the first sign of the adventuring company, she jumps to her feet and growls a warning. She is fiercely protective and will attack if the adventuring company approaches.
  - In late autumn, a giant badger is gorging on fallen apples in an abandoned orchard, eating with frantic urgency before winter. Its belly is so distended it can barely waddle.
  - In winter, the adventuring company shelters in what appears to be an empty cave. In the back, buried under leaves and moss, a giant badger sleeps deeply. It will not wake unless directly disturbed.
- name: Bandersnatch
  type: Creature
  description: 5-foot long, barrel-chested badger-like creature; immense, oversized jaw filled with sharp teeth; shaggy grey fur. Deep growls.
  habitat: [Craggy Hills, Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: null
  watch: {dawn: 15%, morning: 15%, afternoon: 20%, dusk: 25%, early night: 15%, late night: 10%}
  season: All 100%
  sparks:
  - A bandersnatch trots by, carrying a spike-tooth salmon in its jaws.
  - A bandersnatch has been stung by giant wasps and it is frumious. The bandersnatch repeatedly charges and bites a tree. If it sees the company, it will heedlessly charge.
  - A rare sight- a male and female bandersnatch are engaging in their mating dance
  - A bandersnatch is rolling a lush field of wild pipeleaf. It considers the herbs its own property, and will snarl a warning if the company approaches.
  - A goblin merchant leads a placid bandersnatch on a leash. The goblin will attempt to sell the bandersnatch to the company. If successful, the bandersnatch will escape at the first opportunity (biting through its leash), and return to the goblin.
  - In midwinter, a bandersnatch has dragged a frozen deer carcass into a snow hollow and guards it jealously. It is half-starved and will fight to the death over the meat.
  - In early spring, a bandersnatch sow has dug a den under a fallen oak and will not let anything pass within fifty yards. Inside the den, three blind, mewling pups can be heard.
- name: Barrow-Wight
  type: Creature
  description: Corpse-like humanoid with pale, waxy skin and glowing eyes; dressed in ancient burial garments and rusted armor. Musty smell of graves and decay. Moaning and whispering in dead languages.
  habitat: [Ruins, Caverns, Dungeons]
  habitat_notes: Ancient burial mounds and tombs, particularly Nord and Geatish barrows.
  watch: {dawn: 10%, morning: 0%, afternoon: 0%, dusk: 20%, early night: 35%, late night: 35%}
  season: {Spring: 70%, Summer: 70%, Autumn: 100%, Winter: 100%}
  sparks:
  - The adventuring company discovers a Geatish hill barrow. Inside are barrow-wights.
  - A barrow-wight with an antler crown, with antler-wraith servitors, guards a ring of dolmen-stones. It is cursed to sacrifice victims to dark demons. A ring of stag skeletons line the dolmens.
  - Barrow-wights haunt the woods at night. If they catch humanoids, they drag them to a hellish pit.
  - An ancient Geatish king sits on his throne in catacombs under ruins. Guarding the entrance to his tomb are four barrow-wights. Swords line the passage to the throne.
  - Some ancient Geat killed his enemy, and then raised him as a barrow-wight. Now the barrow-wight is trapped under a silvered cage which painfully presses on it.
  - An exhumed barrow-mound. Clerics have dug it out, exposing the barrow-wights inside to the cleansing power of the sun.
  - A miserly barrow wight counts coins in his coffers, moving them from one coffer to another for eternity.
  - Unbeknownst to the adventuring company, a barrow-wight is buried in an unmarked grave underneath the campsite. In the middle of the night, the barrow-wight bursts forth, scattering flames everywhere.
  - The adventuring company slightly hears a haunting melody; it is a harp from a crack in the ground. By tracing the sound, they can discover the entrance to a cave. Inside is a barrow-wight playing a gorgeous silver harp set with moonstones.
  - In his burial cairn, a barrow-wight sits surrounded by undead ravens. The barrow-wight will challenge those that enter his cairn to a riddle contest, but he is not violent. The stakes of the contest are treasure; the barrow-wight offers a gold cup.
  - Despite mild weather elsewhere, for a mile around a rough hill, the ground is frozen iron-hard. If investigated, the adventuring company finds a barrow-wight atop its mound ensconced in dolmenstones. The wight's arms are raised; it is whispering in a dead language.
- name: Barrowbogey
  type: Creature
  description: Small humanoid with a pot, jar, log or similar vessel for a head; stocky body with stubby limbs; wrinkly, brown skin; tattered clothing. Speaks in muffled, tinny voice.
  habitat: [Dense Forest, Ruins, Dungeons]
  habitat_notes: In or near ancient barrows, burial mounds and fairy mounds.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 20%, early night: 40%, late night: 35%}
  season: All 100%
  sparks:
  - Merry Jake the barrowbogey is carrying multiple pots back to its lair, balancing them precariously on its head.
  - Tattercoat the barrowbogey is instructing a group of foxes nearby. It is not clear whether the foxes understand.
  - A group of barrowbogeys are attacking a washerwoman beside a small stream, attempting to steal her pots. The barrowbogyes are led by Copperpot Pete, an especially greedy and aggressive barrowbogey.
  - A headless barrowbogey, Treacle, gropes around, unable to see.
  - Fiddleknees the barrowbogey is bartering with a merchant for fresh pastries.
  - Moggle the barrowbogey; his head is a church bell stolen from a shrine to St. Quister. Even though the holy bell makes the fey uncomfortable, the barrowbogey is fiercely protective. He asks the adventuring company for stories of St. Quister and cheese.
  - Crumpet Ned, a groggy barrowbogey, has only a chipped glass jar for its head. It approaches the adventuring company, seeking a better head. It offers directions (and will draw a map in the dirt) to a hidden Geatish barrow.
  - Three barrowbogeys singe a slow, mournful dirge. They demand the adventuring company give a song in return. If the adventuring company wants, the barrowbogeys will teach them the song; but it turns out that the song angers any Drune that hear it. The names of the barrowbogeys are Bun-Bun, Picklejar Pete and Toasted Cakes.
  - Five barrowbogeys. One's head is a very valuable gold crowned helmet studded with emeralds. He insists that he is the king of barrowbogeys. He calls himself the King of Pies.
  - Rorge the barrowbogey has only a rusted iron pot for a head. He desperately asks the adventuring company for a replacement. He knows the way to a Geatish barrow and is willing to show the company, in exchange for a really good pot.
  - Near a village, Placidia the potter has gone missing as she was collecting clay. Her husband is worried. If she can be tracked, she leads to the local landmark the Mottle Mound, inhabited by Barrowbogeys. See Strange Smoke from Mattle Mound in separate adventure Dolmenwood Dozen.
  - On midwinter night, the watchman discovers a barrowbogey called Parsnip Kate huddling beside the fire, uninvited. Its head is a bronze cooking pot. It offers to tell the company a secret in exchange for hot soup poured into its head.
- name: Basic Ooze
  type: Creature
  description: Protoplasm the color of wet, gray stone.
  habitat: [Caverns, Dungeons]
  habitat_notes: Avoids sunlight.
  watch: {dawn: 25%, morning: 5%, afternoon: 5%, dusk: 25%, early night: 20%, late night: 20%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 40%}
  sparks:
  - The basic ooze lays on the dungeon floor, its color blending into the stone.
  - The ooze is digesting a pile of organic debris.
  - The ooze is sitting at the bottom of a stone font. If a creature drinks from the font, it will strike.
- name: Basilisk
  type: Creature
  description: Eight-legged reptilian creature with dull grey-green scales and a serpentine body; yellow eyes with slit pupils that glow with deadly power. Hissing and dry rustling of scales; faint acrid smell.
  habitat: [Light Forest, Dense Forest, Thorny Forest, Ruins, Caverns]
  habitat_notes: Prefers shadowy, secluded areas.
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 80%, Summer: 100%, Autumn: 60%, Winter: 0%}
  sparks:
  - A basilisk is coiled in shadowy branches overhead, ready to drop down on creatures walking underneath.
  - A basilisk is chasing a pair of mosslings.
  - A basilisk is intertwined around the petrified body of its mate. A broken mirror is nearby.
  - A basilisk is coiled around a clutch of freshly laid eggs in its nest. The basilisk will not abandon the nest.
  - Several red deer are petrified nearby. A basilisk is noisily crunching one.
  - This basilisk is scarred. Many of its legs are missing. It moves at half speed.
  - A basilisk is caught in a net trap. The unfortunate trapper is petrified nearby. But the basilisk cannot escape the trap.
  - A basilisk mistakenly swallowed a large stone (it did not turn to flesh!). The basilisk's belly is distended and dragging.
  - This basilisk has unusual, emerald-green scales that sparkle. Its gaze is especially dangerous (DC 18), and its hide is especially valuable (250 gp).
  - A pair of male basilisks are petrified. They were fighting over territory. Lurking in the underbrush is a female basilisk that will attack without warning if the adventuring company lingers.
  - A basilisk has made a vine-covered cliffside its lair. At the foot of the cliff are several paralyzed mosslings.
  - A pair of basilisks are mating. If interrupted, the female, will slink away, while the male will viciously attack.
  - A petrified statue of a halfling carrying a mirror in front of a grotto. The grotto is the den of a greater basilisk. See the Gloamful Grotto in the separate adventure Dolmenwood Dozen.
  - In early spring, a basilisk lies on a sun-warmed rock ledge, sluggish from its winter brumation. Its petrifying gaze is still deadly, but it is too torpid to pursue prey. Several petrified mice and voles surround the ledge — easy meals taken while warming up.
- name: Bat Swarm
  type: Creature
  description: Mass of small bats with dark fur and leathery wings. High-pitched chittering and squeaking. Whooshing of many wings.
  habitat: [Dense Forest, Fungal Forest, Ruins, Caverns, Dungeons]
  habitat_notes: Also found roosting under bridges and in hollow trees.
  watch: {dawn: 25%, morning: 10%, afternoon: 10%, dusk: 25%, early night: 15%, late night: 15%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 5%}
  sparks:
  - The adventuring company enters a natural cavern. Roosting bats swarm the creatures, seeking to exterminate light sources.
  - In a deserted church, bats cover the ceiling. If the adventuring company attempts to loot the church's relic, the bats, driven by some holy feeling, swarm the adventurers.
  - A swarm of rabid bats travels the countryside at dusk, looking to infect mammals.
  - As the adventuring company passes a hollow tree, a swarm of bats bursts out.
  - The adventuring company finds a shallow cavern that makes good shelter, except there is a slightly sharp and musty odor. At night, from cracks in the cavern, bats swarm out.
  - An old stone bridge runs over a creek. At one end, a pair of children (Darryl and Ella-Mae) are daring each other to run under the bridge. A swarm of bats roosts under the bridge, and if the kids run under the bridge, the swarm will chase them.
  - A huge number of bats are dancing a weird, mystical circle, with strange runes and lines intersecting. If the dance is interrupted, the bats will turn into a shrieking swarm that attacks.
  - Hundreds of bats swarm at the mouth of a cave, wheeling and chittering. The noise is deafening. Nearby, a drune meditates; when he notices the adventuring company he warns them not to disturb the bats. The bats guard a shrine to a forgotten gwyrigon.
- name: Bat, Giant
  type: Creature
  description: Bat with 15-foot wingspan; dark brown or black fur; large pointed ears and sharp teeth. Ultrasonic squeaks and clicks; leathery wing flapping. Musky animal scent.
  habitat: [Dense Forest, Ruins, Caverns, Dungeons]
  habitat_notes: Roosts in high places like ruined towers and cave ceilings.
  watch: {dawn: 10%, morning: 5%, afternoon: 0%, dusk: 25%, early night: 35%, late night: 25%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 10%}
  sparks:
  - At night, a giant bat chases a giant dragonfly through the camp, crashing disoriented into the fire.
  - Giant bat was formerly trained by woodcutter. Now it hops into camp, hoping for a handout.
  - A giant bat dive-bombs the adventuring company's camp, attempting to snag and carry away any Small or smaller character or creature.
  - A trio of giant bats hand from the branches of a yggnut tree, warily eying the adventure company.
  - The adventuring company discovers an abandoned 3-story Geatish guard tower (the interior wooden floors have long since collapsed). Five giant bats roost at the top. The floor is covered in guano, nearly 3 feet deep. However, underneath the guano is a bag of silver coins and a magic bronze shield.
  - In late autumn, the adventuring company spots a giant bat deep inside a large crack in a cliff face, its wings wrapped tight around its body. It is entering torpor for winter. Its fur is thick and glossy from months of feeding.
- name: Bat, Hunter
  type: Creature
  description: Small bat with grey-brown fur; agile and quick in flight. High-pitched echolocation calls; soft wing beats.
  habitat: [Light Forest, Dense Forest, Ruins, Caverns, Dungeons]
  habitat_notes: null
  watch: {dawn: 10%, morning: 5%, afternoon: 0%, dusk: 25%, early night: 35%, late night: 25%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 10%}
  sparks:
  - A hunter bat mistakenly snatches a player character's fancy hat.
  - The adventuring company breaks through a thin crust of rock, falling into a cavern with hundreds of hunter bats.
  - A rabid bat attempts to bite a member of the adventuring company.
  - The hunter bat is carrying a giant locust.
  - Despite being mid-day, an especially large hunter bat is lazily hanging from a tree branch.
  - A hunter bat is lying on the earth with a broken wing. The bat is likely to die.
  - In early spring after an unusually hard winter, the adventuring company discovers a hunter bat exiting a mossy, hollow tree, emaciated and too starved to fly. Nearby, its roost-mates were not so lucky — two desiccated bat corpses litter the bottom of the tree. The hunter bat will attach to anyone who feeds it, becoming a mascot/companion.
- name: Bat, Needle-Nosed
  type: Creature
  description: Tiny bat with elongated needle-like snout for blood-feeding; grey fur and translucent wing membranes. Nearly silent flight; faint squeaking.
  habitat: [Light Forest, Dense Forest, Bogs, Swamps, Ruins, Caverns]
  habitat_notes: null
  watch: {dawn: 10%, morning: 5%, afternoon: 0%, dusk: 25%, early night: 35%, late night: 25%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 10%}
  sparks:
  - A player character disturbs a hollow log. Dozens of needle-nosed bats fly out.
  - The adventuring company comes upon a flock of needle-nosed bats feasting on a dying newt. The bats are full and won't attack.
  - Bats are stuck in a giant spider web.
  - Bats waiting for a giant weasel to emerge from its den.
  - A needle-nosed bat is tied with strong twine to a witch's charm hanging from a tree.
  - At night, needle-nosed bats locate the adventuring company's campfire. They will try to drain blood from mounts first, but failing that, will go for the guards.
  - In late autumn, the adventuring company finds a dead oak whose trunk is packed with needle-nosed bats huddled together for warmth. If disturbed, the sluggish bats rouse slowly.
  - A shepherd (Killeen) begs for help from the adventuring company. His sheep are being preyed upon, and become weaker each night. If the adventuring company tracks the bats (no easy task), they find the bats roost in a well-hidden Nord barrow.
- name: Bear, Brown
  type: Creature
  description: 7-foot tall bear with shaggy brown fur; powerful build; long curved claws. Deep grunting and huffing; loud roars when aggressive. Strong musky odor.
  habitat: [Rolling Hills, Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: null
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 5%}
  sparks:
  - Mother bear and cubs are foraging berries off a bush.
  - A bear is running through woods, carrying a beehive in mouth, chased by an angry swam.
  - A bear is eating a dead deer, while wolves circle.
  - After eating all rations, the bear is sleeping in middle of destroyed campsite.
  - The bear is cautiously sniffing a deadfall trap.
  - The bear is dragging a dead ibex goat back to its den.
  - The bear is fishing for salmon in a creek.
  - The bear needs a winter den. It is sniffing a giant badger's den, considering whether to drive it out.
  - The bear escaped from performer; bear is still wearing a jester's cap and bell collar.
  - A bear pokes its head above a field of wildflowers.
  - A bear rummages through the camp of fishers, attracted by the scent of fresh fish. The fishermen climbed up a nearby tree.
  - A bear has found a copper witch-liquor still and has acquired a taste for it. The adventuring company finds it lifting jugs and dancing in a clearing.
  - A bear leads a procession of woodland creatures through the forest. Badgers, a boar, deer, rabbits and weasels. They ignore the adventuring company unless attacked. The bear wears a crown of flowers. This is all some sort of weird fey magic gone awry.
  - In early spring, a gaunt brown bear recently emerged from its winter den, irritable and ravenous. It is aggressively tearing apart rotting logs for grubs, and will snarl viciously, but is too cautious to attack the company and too weak to run fast.
  - In late autumn, the adventuring company finds a brown bear gorging on windfall cramp-apples beneath a gnarled tree.
- name: Bear, Cave
  type: Creature
  description: Massive 10-foot tall bear with thick golden-brown fur; huge paws with 6-inch claws. Thunderous roars and deep growls; heavy breathing. Strong musky odor.
  habitat: [Craggy Hills, Dense Forest, Thorny Forest, Caverns]
  habitat_notes: null
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 5%}
  sparks:
  - This cave bear has a taste for human flesh and will immediately attack.
  - Sprayed by an oil beetle, the bear wanders the woods moaning.
  - A cave bear is bending down a wild cherry tree, eating the ripe fruit.
  - The cave bear is locked in combat with a sabre-tooth lion.
  - A massive cave bear sleeps under the shade of an ancient oak, its breath slow and rumbling. Rabbits and squirrels jump around its body.
  - An albino cave bear is resting in a pool, his pink eyes just above the surface.
  - A cave bear is dragging a 5-foot long spike-tooth salmon out of a river.
  - The adventuring company discovers a cave entrance. As the examine it, a cave bear emerges and roars a warning. The cave bear will attack unless the company departs soon. In the cave, are three bear cubs and an enormous bee hive dragged from nearby (no bees, but lots of honey).
  - A cave bear was recently part of a Drune ritual. Its body is covered in painted red runes that make it immune to magic. The bear is quite angry; it will roar and attack the adventuring company, and will not need to check morale.
  - In early spring, a scrawny cave bear (with patchy fur) monomaniacally digs giant dragonfly grubs. The bear just emerged from hibernation.
  - In late autumn, the adventuring company stumbles upon a cave bear methodically padding its den with bracken and moss, preparing for hibernation. The cave mouth is littered with cracked bones and antlers from weeks of heavy feeding. The bear is aggressive and territorial — it will not tolerate anyone near its den.
- name: Bee Swarm
  type: Creature
  description: Dense cloud of honeybees. Loud, droning buzz that rises when threatened.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest]
  habitat_notes: Nests in hollow trees, cliff faces, and abandoned structures.
  watch: {dawn: 15%, morning: 35%, afternoon: 35%, dusk: 15%, early night: 0%, late night: 0%}
  season: {Spring: 90%, Summer: 100%, Autumn: 60%, Winter: 0%}
  sparks:
  - Bees emerge from a crack on a cliff face. Inside, the adventuring company can see a hive protected by bee swarms. If creatures approach or try to harvest the honey, the bees will swarm.
  - A brown bear is ripping open a tree stump to get to honey inside, ignoring the bee swarm.
  - A bee hive sits in a sunny glade; the bees are sleepy.
  - A meadow of wildflowers, where the bees are especially busy. If the adventuring company is not lucky, the bees swarm to attack.
  - The adventuring discovers an ancient, massive hollow tree, its trunk riddled with holes and covered in a constant, thick cloud of buzzing bees. The tree is home to an enormous wild colony of bees, representing no less than 6 swarms. The tree has 30 slots of honey and 3 slots of royal jelly.
  - Sitting on a stone seat is a meditating Drune cottager. Bees crawl over his body, comprising two bee swarms. The swarms will fight to protect him.
  - An artificial beehive, made of mud, is deep in the forest. The hive is protected with witch glyphs, causing pain damage to any who disturb the hive. The bees will also swarm to defend.
  - The adventuring company finds a long-abandoned well. Near the bottom is a beehive; if disturbed, the bees will swarm and attack. A DC 15 Int check gives a clue that there are a large number of bees nearby.
  - A bee hive in a hollow tree has been decorated with bright ribbons and paints. They believe it appeases the bees, allowing them to gather more honey.
  - In mid-spring, a bee swarm pours from a hollow oak, following a new queen on her maiden flight. The cloud drifts lazily across the path ahead. They are not aggressive unless provoked, but the sheer number is alarming.
  - In early autumn, a beekeeper (Aldith) stands beside an overturned skep hive, weeping. Her bees have absconded — the swarm hangs in a dark, buzzing mass from a nearby branch. She offers a jar of honey and a silver penny to anyone who can help her recapture them.
- name: Beetle, Giant Fire
  type: Creature
  description: 3-foot long beetle with dark brown carapace; glowing red-orange light gland at rear. Clicking mandibles.
  habitat: [Fungal Forest, Caverns, Dungeons]
  habitat_notes: null
  watch: {dawn: 10%, morning: 0%, afternoon: 0%, dusk: 20%, early night: 40%, late night: 30%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 0%}
  sparks:
  - Fire beetles are browsing on fungi and mosses.
  - A lone fire beetle is eating cave locust larva.
  - Freshly killed fire beetle; its glands are still glowing.
  - A group of fire beetles is sifting through rock debris; they can smell the carcass of a cave newt killed in a rock collapse.
  - In a large cavern, a fire beetle is fluctuating its light gland to signal another beetle.
  - An oddly aggressive fire beetle rushes forth from a burrow and bites. Its bite attack is +2. After the creature is slain, it can be seen that it has a fungal infection. Anyone bitten by the beetle is exposed to the ravening hunger disease.
  - 8 fire beetles are crawling over an abandoned shrine to Saint Guthac. They are peaceful. Attacking the fire beetles incurs Divine Displeasure.
  - At night, a fire beetle confuses the adventuring company's fire for another beetle, and approaches the fire.
  - A pod of a dozen 8-inch long fire beetle eggs are exposed to the air. They glow softly, like a light gland.
  - At night, the adventuring company sees floating red lights in the distance. If investigated, they will find giant fire beetles.
- name: Beetle, Giant Horned
  type: Creature
  description: 4-foot long beetle with thick brown-black shell; pronounced curved horn; wicked mandibles. Loud clicking.
  habitat: [Dense Forest, Thorny Forest, Fungal Forest]
  habitat_notes: Prefers dense undergrowth as a defense.
  watch: {dawn: 15%, morning: 15%, afternoon: 15%, dusk: 20%, early night: 20%, late night: 15%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 0%}
  sparks:
  - The horned beetle is eating a giant rat.
  - A horned beetle is wandering the forest floor, looking for prey.
  - Two male horned beetles are locked in combat.
  - The horned beetle is gouging out a temporary shelter from a rotten tree trunk.
  - A horned beetle has been mutated by chaos. It is red and raw. A successful attack by the beetle inflicts an additional 1d8 necrosis damage.
  - In early autumn, a horned beetle is sluggish and dying. Parasitic grubs have bored through its carapace — dozens of pale larvae wriggle inside the cracks. The beetle's mandibles still snap feebly at anything that comes close.
- name: Beetle, Giant Lightning
  type: Creature
  description: 5-foot long beetle with shiny copper-gold carapace; prominent antennae; small mandibles. Sharp crackling sounds. Odor of ozone.
  habitat: [Dense Forest, Thorny Forest, Fungal Forest, Caverns]
  habitat_notes: null
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 15%, early night: 10%, late night: 5%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 0%}
  sparks:
  - The lightning beetle is nibbling on a leafy bush.
  - The lightning beetle is laying eggs in a trench.
  - The lightning beetle, is hunkering down, trying to avoid a lynx.
  - A lightning beetle is punctured by several arrows.
  - A lightning beetle is attacking a violet fungus.
- name: Beetle, Giant Oil
  type: Creature
  description: 3-foot long beetle with shiny brown carapace; raised rear. Slow shuffling movement; hissing when threatened. Acrid, chemical smell.
  habitat: [Dense Forest, Thorny Forest, Fungal Forest]
  habitat_notes: Prefers dirt to stony areas.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 15%, early night: 10%, late night: 5%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 0%}
  sparks:
  - A trio of oil beetles are burrowing at surface of deep forest mulch.
  - The oil beetle is slowly eating fungi and roots.
  - The oil beetle is digging a new tunnel.
  - Two oil beetles are engaged in a complex, pheromone-based courtship ritual.
  - The adventuring company encounters an eye-watering, sinus-draining ambient vapor. They discover a wolf mewling and scratching its face in the dirt. It was sprayed by an oil beetle, which is hiding in the underbrush nearby.
  - Wiglac the hunter kneels over a dead oil beetle peppered with arrows. He is extracting its oil glands.
  - A pair of oil beetles are devouring jars of molasses stolen off a porch.
- name: Big Chook
  type: Creature
  description: "30-foot long, with the body of a pike and three cockerel's heads on the end of scaly, sinuous necks; whole body is covered in pink, orange, and rust scales, dotted with horrid barbs and blind, weeping eyes. Demented, unnerving, cockerel-like wailing echoing across the lake."
  habitat: [Lakes]
  habitat_notes: See DCB hex 0606.
  watch: {dawn: 30%, morning: 15%, afternoon: 15%, dusk: 30%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A faint pulse on the surface of the lake. Below the surface, a huge long fish flashes by. It breaks the surface and attacks.
  - For no apparent reason, the lake mists over suddenly. In the mists, a dark figure looms. It cries out a terrible and fearful wail.
  - The Big Chook cavorts in the shallows with a giant pike, one of his mates.
  - The Big Chook does not appear, but its unnerving cry echoes across the lake.
  - Far away, a giant rooster head breaks the lake's surface. Then another; then another. The Big Chook stares at the adventuring company for a minute, but then disappears underwater.
- name: Black Ooze
  type: Creature
  description: Thick, black, oily protoplasm; waving pseudopods. Acrid, pungent acid odor.
  habitat: [Ruins, Caverns, Dungeons]
  habitat_notes: It avoids sunlight.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 10%, early night: 40%, late night: 45%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 40%}
  sparks:
  - The black ooze is feeding on a dead giant horned beetle.
  - The black ooze is lying at the bottom of a pool, nearly invisible.
  - The ooze is inside a suit of plate armor, eating its former owner.
  - The ooze is lying at the bottom of a pit.
  - The ooze is bubbling out of a crevice in stone.
  - The black ooze is lying at the bottom of a pool, nearly invisible.
  - An inky black pool spoil radiates chaos and magic. Black oozes emerge from the spoil.
- name: Black Tentacles
  type: Creature
  description: Masses of writhing, suckered, black tentacles; inky and serpentine; 10 feet long. Stinks of corruption.
  habitat: [Bogs, Swamps, Rivers, Ruins, Caverns]
  habitat_notes: Always in wet, muddy environments.
  watch: {dawn: 10%, morning: 35%, afternoon: 35%, dusk: 10%, early night: 5%, late night: 5%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 50%}
  sparks:
  - Out of knee-deep mud, a mass of black tentacles emerges from algae. This unusual specimen has a paralytic touch (DC 12 Strength saving check or be paralyzed, with new saving check at the end of each round).
  - The black tentacles have ensnared an elk, and are dragging it into the bog.
  - The black tentacles are singing a weird, whistling song.
  - A foul monolith rises from the swamp. A black tentacle mass is slowly pulling itself up the monolith.
  - In a cavern, a mass of black tentacles blocks the passage ahead. The cavern is a site of corrupted fey magic.
  - In a blackwater lake, a mass of black tentacles surfaces to grab the adventuring company's boat.
  - An aurochs is bleating with pain. As the adventuring company approaches, the aurochs bursts, and a mass of black tentacles emerges from its corpse.
  - At an abandoned farmstead, there is a well. When the adventuring company is near, a mass of black tentacles emerges.
  - The adventuring company is first alerted by a foul, rotting stench. If they follow the smell, they discover a mass of black tentacles feeding on a group of decayed human travelers. If the adventuring company gets near, members must succeed on a DC 10 Str saving check or be stunned by the foul smell until they succeed on the saving check.
  - A mass of black tentacles has trapped and killed a Drune cottager, but the body has been transformed into a bog corpse, suspended at the end of the tentacles. If both can be eliminated, the adventuring company can discover the Drune's staff and ritual dagger, which other Drune will pay to recover.
  - In an abandoned shack, a sickly sweet smell from the cellar. If the adventuring company investigates, a mass of black tentacles has taken over the cellar where it is drunk on witch-liquor or oddberry wine stored there in barrels.
  - In a forgotten cellar in a town or village, a mass of black tentacles has grown. Local chaos cultists are aware of the black tentacles and are feeding it victims.
- name: Blood Ooze
  type: Creature
  description: Pale, red ooze, deepening to blood-red when draining blood; waving pseudopods. Metallic, coppery odor.
  habitat: [Ruins, Caverns, Dungeons]
  habitat_notes: It avoids sunlight.
  watch: {dawn: 15%, morning: 5%, afternoon: 5%, dusk: 15%, early night: 30%, late night: 30%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 40%}
  sparks:
  - The blood ooze is feeding on the blood of a dead cave newt.
  - The blood ooze extrudes itself from a hole in the ceiling.
  - Three blood oozes are crowded around a lightly pulsating crimson crystal.
  - A tall, glass column, with its cover sealed in wax. Inside is a trapped blood ooze.
  - As the adventuring company traverses a narrow tunnel, one member (determined randomly) brushes up against the wall. Lurking in cracks in the wall is a blood ooze, which stings the member.
- name: Boar
  type: Creature
  description: Rusty to dark brown wiry hair; large, upturned tusks. Grunts and squeals.
  habitat: [Meadows, Rolling Hills, Craggy Hills, Light Forest]
  habitat_notes: Prefers areas nearby underbrush.
  watch: {dawn: 30%, morning: 15%, afternoon: 10%, dusk: 30%, early night: 10%, late night: 5%}
  season: All 100%
  sparks:
  - Agitated for some reason, the boar will chase and attack those that disturb it.
  - A herd of boars have chased a lynx up a tree. Now they wait for it to descend.
  - Boars are digging in the dirt for roots and grubs.
  - A boar is crazed from eating hallucinogenic mushrooms. It wanders in circles while shaking head, and growling and snapping at invisible spirits.
  - A trio of boars are lounging in the shade of a shade.
  - A boar is bathing in a creek.
  - A pack of boars has discovered a wonderful truffle patch, and will guard the territory fiercely (giving advantage on morale checks). If the boars can be killed or driven off, the adventuring company can notice some half-dug truffles, and many more are recoverable.
  - The adventuring company encounters a small herd of boars that are fat and juicy. The boars bolt; one especially fat one is slow and slips. It would make good eating.
  - At night, a huge herd of boars rushes the adventuring company's website. Although they will not fight, the boars will destroy equipment and baggage, seeking food. The adventuring company should make Luck checks to see how bad it is.
  - The adventuring company is faced with a herd of stampeding boars. Following the boars are a group of nutcaps mounted on hawks, whistling and cheering the boars.
  - In late autumn, a sounder of boars roots through fallen leaves for acorns beneath an ancient oak, fattening before winter. They are so focused on feeding they will not notice the adventuring company until quite close. The fat, acorn-fed boars would make excellent feasting.
  - In late winter, a lone boar, gaunt and mud-caked, digs through frozen ground near a stream bank. It has scraped away snow to get at roots. It is desperate enough to be aggressive toward anyone carrying food, but is easily distracted if any food is offered.
- name: Boar, Razorback
  type: Creature
  description: 5 to 6-foot long; greyish brown to dark grey wiry hair, darker and more pronounced along spine; large, upturned tusks; beady eyes. Grunts and squeals.
  habitat: [Rolling Hills, Craggy Hills, Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: null
  watch: {dawn: 25%, morning: 20%, afternoon: 15%, dusk: 25%, early night: 10%, late night: 5%}
  season: All 100%
  sparks:
  - The boar is eating acorns.
  - The boar is digging up a cairn where some poor traveler was recently interred.
  - A sow boar leads a dozen cute piglets in a game of walking in circles.
  - The boar is sitting in the middle of a field of rooted-up wild carrots.
  - While the adventuring company is crossing a creek, a razorback boar emerges from the undergrowth and charges the company.
  - Near a village, a small herd of razorback boars has learned to devour the village's crops at night. The adventuring company comes across the trampled trail of the boars. If the trail is followed and the boars slain, the villagers will heap praise and goodwill upon the company (although they are too poor to pay). The village leader is Osmund.
  - A razorback boar is nesting in the entrance to a Nord barrow. It will not go deeper in the barrow, but nor will it abandon its den.
  - A large pack of razorback boars has chased a desperate hunter (Rowan) up a tree. The hunter is out of arrows, and has no way to escape. Many of the boars have an arrow or two sticking from their hide.
  - In the mists, the adventuring company can hear the growls and squeaks of a herd of razorbacks. If the adventuring company is unlucky, they will get too close to the boars' den which has newborn piglets – and the boars will attack. If the adventuring company retraces their steps backwards, the boars will follow for a distance but will not attack.
  - A pair of mated razorback boars are eating an unlucky deorling hunter. They are wounded, but reluctant to abandon their meal.
  - A razorback boar is battling a giant viper. The viper is losing, but the battle is not without doubt.
  - A whole field with roots and grubs has been uprooted by a herd of boars. If the adventuring company lingers or investigates, they will notice that a buried chest has been partially uprooted. The boars are easily driven off (disadvantage on morale checks). The chest contains a great deal of Nord silver and a superior quality, albeit rusted, spear-head.
  - A massive razorback boar, its body pierced by a spear and infected with crazed fungal growths. It is devouring the remains of the three dead hunters.
  - A razorback boar is rooting out Maegthe herbs.
  - In the distance, the adventuring company can hear the baying of hounds and blowing of hunting horns. They are confronted by a wounded razorback boar being chased by noble hunting party. The adventuring company can easily allow it to escape, or take it down. Either way, they are likely to encounter the hunting party soon after.
  - Silhouetted on a hill, is the black pig, a fey creature that serves the Wood Gods. It is a hairless, pitch black pig with red eyes and ludicrously oversized tusks. After staring at the adventuring company for 30 seconds, it pronounces in a booming sepulchral voice, "Your activities displease the Gwyrigons. Discontinue doing so" or something equally cryptic. This has the same effect as a Yeth hound's howl. The black pig also has the elf wanderer's slip away ability, and double the normal hit points.
  - In early spring, the adventuring company hears high-pitched squealing. A razorback sow has farrowed a litter of piglets in a dense thicket of thorns. If the adventuring company investigates, she will charge to protect her piglets, and will not need to check morale.
  - In mid-winter, a razorback boar has taken shelter in an abandoned charcoal burner's hut. It has torn apart the interior and made a nest of straw and debris. It will defend the hut savagely against anyone who tries to use it for shelter.
- name: Boggin
  type: Creature
  description: 10-foot tall anthropoid frogs; chaos tumors on face and body; sheets of mossy hair.
  habitat: [Bogs, Swamps, Rivers, Lakes]
  habitat_notes: Boggins live in underwater grottos and log-shelters.
  watch: {dawn: 25%, morning: 20%, afternoon: 15%, dusk: 25%, early night: 10%, late night: 5%}
  season: {Spring: 90%, Summer: 100%, Autumn: 90%, Winter: 50%}
  sparks:
  - The boggins are emerging from a pool to chase breggle slaves who escaped from captivity.
  - A boggin is lurking in a muddy pool, with only its head visible. It is bargaining with a Drune cottager over the cost of a barrel of husk sludge.
  - Boggin archers are sneaking through a bed of reeds, hunting giant cranes.
  - A boggin bonecarver wants to trade carved netsuke for iron tools, especially rakes and shovels.
  - A boggin fish hunter is making javelins from birch branches.
  - At dusk, a group of boggins gather to fill the air with their chaos croaks.
  - An inviting rowboat sits among the reeds. However, it is a boggin trap. The boat has a handle underneath, making it easy for swimming boggins to overturn. If the adventuring company uses the boat, nearby boggins will overturn it, dumping the company into water. The boggins hope to take slaves.
  - Hidden among the reeds along the shore is a water-filled, covered pit filled with giant leeches. If the lead adventurer does not pass a DC 12 Intelligence check, it falls into the pit. Nearby are boggin slavers, who will rush out. If the adventuring company appears powerful, they will try to convince the other members that the trapped adventurer is as good as dead, and they should abandon him.
  - A group of boggins are assiduously raking the bottom of a bog. They have already pulled out a fair amount of bog iron, and are willing to trade it to the adventuring company for gold or silver (at a good price since trade relations are difficult).
  - A trio of boggins are lurking in a muddy pool, only the tops of their heads protruding. A Drune Cottager perches in a willow tree and promises payment (in the form of charmed local slaves) in return for six barrels of "husk sludge."
  - A single boggin shaman stands on a rock in the shallows. He hums, communing with water spirits. If left alone, he will not interact with the adventuring company. Disturbing the shaman interrupts his ritual; he will be unhappy but is too cautious to be aggressive.
  - In early spring, the swamps echo with a deafening chorus of boggin mating calls — deep, resonant croaks laced with chaos magic. If the adventuring company continues, they encounter a lone boggin on a half-submerged log, inflating its throat sac to enormous size - too distracted to notice the adventuring company.
  - In late autumn, a boggin foraging party hauls baskets of freshwater mussels and cattail roots from the shallows, stockpiling food before the waters freeze. They are wary but willing to trade if approached peacefully.
- name: Bramble Golem
  type: Creature
  description: 5-foot tall twisted mass of brambles and thorns in humanoid shape; green flame visible through gaps. Crackling and rustling sounds.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: Created and commanded by Drune to guard sites and perform tasks.
  watch: {dawn: 10%, morning: 35%, afternoon: 35%, dusk: 10%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - Lurking in the branches of a tree, the bramble golems are tasked with spying on elves.
  - The bramble golems are guarding a glade where a wicker golem is under construction. The bramble golems are disguising themselves in the underbrush.
  - Bramble golems are carrying an unconscious, wounded knight to the closest nodal stone, under the command of its Drune master.
  - A bramble golem is clumsily carrying stone and earth to cover a shallow pit in the woods. Inside the hole is the corpse of an emaciated unicorn, ritualistically bound in silver-threaded rope and strewn with sprigs of thyme.
  - Bramble golems are standing guard over a dolmen that a Drune that does not want to be interfered with. The bramble golems will posture, attempting to warn off the interlopers (the golems cannot speak). If the bramble golems are slain, the adventuring company can mess with the dolmen. Alas the dolmen will crumble, sending out a pulse of necromantic energy; 3d6 necrosis damage, DC 14 Luck check to halve.
  - At night, whoever is keeping watch needs to succeed on a DC 5 Intelligence check to spot a bramble golem that is spying on the company. The golem is not hostile, but is gathering information for his Drune master.
  - A pair of bramble golems stand guard on a ley line. They were specially created as guards. Each has large pieces of wood incorporated into its body, and a thorny pole arm. Each has double hit point, 16 AC and its slam attack has reach and does 1d8 damage. Each is level 3.
- name: Breggle, Crookhorn
  type: Creature
  description: Anthropoid goats standing 5-6 feet tall; shaggy dark brown fur; foot-long horns; diseased open sores on face and body. Grunting and bleating sounds. Foul smell of disease and rot.
  habitat: [Craggy Hills, Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: Northwest of Dolmenwood. Live in crude camps.
  watch: {dawn: 15%, morning: 25%, afternoon: 25%, dusk: 15%, early night: 15%, late night: 5%}
  season: All 100%
  sparks:
  - The crookhorns are dancing wildly around a campfire. They are preparing to roast a group of mosslings (Bembri, Morro, Smodron, Marib, Gombly and Domumolo), who are already stripped and smeared with hog fat.
  - The crookhorns are arguing with a group of harpies sitting in a tree. The crookhorn leader is coal-black and has a nasty barbed spear.
  - The crookhorns are tracking a unicorn.
  - The crookhorns are pissing in a well, hoping to infect the local population with their disease.
  - The crookhorns are digging a root-thing out of the dirt.
  - The distant sound of pipes. A crookhorn piper is playing a merry melody, hoping to lure some nearby children into the forest.
  - The crookhorns are leaping wildly in front of an idol of Atanuwë set up a dolmenstone. The idol glows with an eerie blue-green light. Because the idol has been activated, it has the same effect as a devil-goats gaze on non-crookhorns within 60 feet.
  - A group of crookhorns have found a nest of vipers. They are using sticks to poke the snakes, and push them together, trying to make them fight.
  - A group of crookhorns are bullying another group of enslaved cobbins. The largest, meanest crookhorn is wearing a crude crown made of bones. Because they are concentrating on the cobbins, the crookhorns will not notice the adventuring company.
  - A crookhorn has been staked to the ground by a vengeful Drune who knows a carcass crawler lives nearby.
  - A trio of crookhorns lie in a shallow cave, zonked out of their mind from eating hallucinogenic tom-a-merry and wormwood, mixed together in a potent combination.
  - A hidden crookhorn shouts insults at the adventuring company. On the path between, the crookhorn has dug a pit, covered with leaves and with wood spikes at the bottom.
  - A pair of crookhorns laugh as they chop at an ancient oak, decorated with strings of glass beads. The oak is a shrine to the wood god Cwrnus, and is a favorite of a local witch. If stopped immediately, the oak is not too far gone to save.
  - In mid-winter, a band of crookhorns huddles around a sputtering fire in a snow-covered clearing, roasting stolen chickens. They have raided a nearby farm and are quarrelling over the spoils. Tracks in the snow make them easy to follow.
- name: Breggle, Longhorn
  type: Creature
  description: Anthropoid goats standing 5-6 feet tall; shaggy tan fur; foot-long horns. Bleating and grunting sounds. Goat-like smell.
  habitat: [Farmland, Rolling Hills, Light Forest, Roads, Settlements]
  habitat_notes: Southwest of Dolmenwood. Live in farms, villages, towns and castles serving breggle lords.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Longhorn breggles (Sir Gripe, Sir Solomon, Lady Gracelle, Lady Lindore) are mounted on riding horses and dressed in finery. They are travelling to a ball at a manor house.
  - Redwick, longhorn breggle, is charging through undergrowth on horseback, chasing peasant breggles accused of petty theft.
  - Two longhorn knights, Sir Eduard and Sir Mustel, are preparing to duel over a question of precedence.
  - Elix, the breggle longhorn is overseeing a work-group of breggle shorthorns building a defensive wall.
  - Lindor the breggle is looking for a dwarven goldsmith named Smities. The breggle is short of money and needs a loan.
  - Wendlow the breggle and his shorthorn entourage are leading a captured devil-goat back to the longhorn's manor.
  - A competent-looking breggle knight, Sir Gnaeus, accompanied by a squire, challenges the adventuring company. If the company answers adequately, they may be invited back to the knight's lookout tower. If not, the knight may challenge them to battle.
  - Sir Titus, a breggle knight, and his noble lady Maybell are alone in the woods, away from prying eyes, where he woos her. The knight will demand that the adventuring company swear to silence. If they refuse, he will not attack, but will swear the undying enmity of his house.
  - Canida, a breggle sorcerer, with an emaciated appearance and horns and nails comprised of black metal (the result of arcane corruption). The sorcerer, accompanied by a group of shorthorns, is searching for maegthe flowers. The sorcerer treats the shorthorns with contempt, but is reasonable to the party. If the party can assist, the sorcerer will be grateful, and be willing to provide magic support or even trade spells (but they must accompany him back to his tower).
  - A pair of breggle knights, Sir Abronius and Volcus, feast on melons plundered from the farm where they sit. The shorthorn farmer, as well as the knights' shorthorn entourage, look on helplessly.
  - An ancient hermit longhorn knight, Sir Cornius, stands guard over a path. He requires those that pass to give him a single coin of any variety, plus several days food. He is an excellent warrior and if befriended will recite his history, finally resulting in his self-exile over a point of honor.
  - Sir Erasmas, a breggle knight in the service of Lady Brryld Ramius (see hexes 0410, 0607 and page 14 DCB) is questing for a shard of the Horned Crown of the Hydrogyle. Erasmus will question the company about any knowledge they have, but his quest is fruitless. Erasmus will disclose location of the statue of Hraigli (hex 0607) behind the Wight Falls.
  - Sir Itrach, a breggle knight, sits forlorn on a stump, weeping over a miniature portrait of true love, a lady captured and slain by servants of Atanuwë. He seeks vengeance and asks to join the adventuring company. If he does, he fights recklessly, seemingly seeking solace in death.
- name: Breggle, Shorthorn
  type: Creature
  description: Anthropoid goats standing 4-5 feet tall; shaggy tan fur; nub horns. Bleating and grunting sounds. Goat-like smell.
  habitat: [Farmland, Rolling Hills, Light Forest, Roads, Settlements]
  habitat_notes: Southwest of Dolmenwood. Live in farms, villages, towns and castles as servants and laborers.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The breggles are sitting wounded and forlorn by the wayside, crouched atop a stump. These Breggle soldiers are survivors of a larger band in a skirmish with a rival house. Their leader is Flerget.
  - Breggle hunters are ringed around an enraged boar. The lead hunter, Broob, carries a longbow and wears a jaunty hat.
  - Breggle scouts (led by Shank and Curlip) are hiding in underbrush, spying on a longhorn knight (Sir Anser).
  - The breggle are rustling a herd of sheep from a rival house. The leader is a fat joker named Lope.
  - Confuzlow, a lone breggle, offers a treasure map in exchange for cash. The treasure is buried beneath the walls of a keep of another breggle house.
  - A gaggle of breggles are tormenting a bull. At home, they are bullied by a longhorn overseer and are taking out their frustrations on the bull. They will scatter if confronted.
  - A miserable trio of breggle (Bredhr, Wheld and Shadgore) have stolen a cask of wine and invite the adventuring company to get drunk in the forest with them.
  - A lone breggle, Dwennog, horribly disfigured by fire. He was injured and pushed out of his farm by a cruel overseer.
  - A pair of mangy breggles that stand off some distance from the adventuring company. They bleat an offer to serve as guides in exchange for payment. The breggles are nearly wild and have been exiled from polite society, but they know the wilderness well. They are also fearful of becoming crookhorns. The breggles distrust the adventuring company unless trust is earned. Their leader is Meldrug.
  - A group of bandits, half humans and half shorthorns. They challenge the adventuring company to surrender valuables or be slain. The bandits are armed with shortbows and have light armor only. The chief bandit is Crewdle, who wears a black velvet cape. Crewdle spends money with no thought for later.
  - A trio of shorthorn breggles (Olledge, Bredigrew, Flern) were dragging a cart through the woods, carrying wild gourds. Now, the cart is broken, and the shorthorns are vainly trying to repair it.
- name: Bronze Golem
  type: Creature
  description: Warm golden bronze with greenish undertones; thick features and limbs; arcane symbols cast into forehead. Ponderous movement.
  habitat: [Settlements, Ruins, Dungeons]
  habitat_notes: Anywhere placed or assisting a wizard.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: All 100%
  sparks:
  - The golem methodically maintains an elemental salamander's forge.
  - A pair of golems guards the entrance to an ancient Ur-Geatish complex.
  - The golem is serving as a bodyguard for a wizard.
  - The golem, unable to fulfill its last instructions, stands inert.
  - The regular sound of metal on stone. A bronze golem patrols a crumbling tower, visible through holes.
  - The adventuring company finds a bronze golem standing motionless in a doorway, blocking passage. Beyond the doorway is a visible library. The golem will stand aside only if the password is spoken.
  - A bronze golem carries heavy stone blocks, slowly constructing a wall as part of its duties.
- name: Brown Mold
  type: Creature
  description: Furry, light-brown carpet. Cold nearby.
  habitat: [Fungal Forest, Caverns, Dungeons]
  habitat_notes: null
  watch: {dawn: 10%, morning: 40%, afternoon: 40%, dusk: 10%, early night: 0%, late night: 0%}
  season: {Spring: 80%, Summer: 80%, Autumn: 100%, Winter: 100%}
  sparks:
  - A patch of brown mold grows on a damp wall, radiating cold.
  - The adventuring company feels a sudden chill. Brown mold covers the ceiling above them.
- name: Carcass Crawler
  type: Creature
  description: 12-foot long centipede with pale beige segmented body; maw of writhing tentacles; many legs. Foul, bitter smell.
  habitat: [Dense Forest, Swamps, Caverns, Dungeons]
  habitat_notes: Damp underground burrows and damp forests.
  watch: {dawn: 15%, morning: 25%, afternoon: 25%, dusk: 15%, early night: 10%, late night: 10%}
  season: {Spring: 90%, Summer: 100%, Autumn: 90%, Winter: 30%}
  sparks:
  - The carcass crawler emerges from its burrow dug in the ground.
  - The carcass crawler is laying eggs in its latest victim, a red doe.
  - The carcass crawler is molting its skin. It is helpless for the next minute until it completes the process.
  - A carcass crawler hangs overhead in dense tree branches, with its tentacles dangling down.
  - A carcass crawler is dragging a paralyzed cave orc back to its lair.
  - This carcass crawler's tentacles are greenish-black and have a sickening, foul smell. While paralyzed by the carcass crawler's mucus, a target takes 1d3 necrosis damage per round (up to a maximum of 6 times in any 24-hour period).
  - The carcass crawler is digging out a nest of giant horned beetle eggs. The giant beetle lies nearby, paralyzed for an hour.
  - The carcass crawler is infected with a rare fungus (harmless to humanoids); toadstools sprout from its back. The fungus drives the carcass crawler to attack the adventuring company unrelentingly.
  - A freshly-dug burrow in the dirt. Deep inside is a carcass crawler.
  - Underneath a very large, overturned pirogue, a carcass crawler awaits. If disturbed, it will attack.
- name: Carp, King
  type: Creature
  description: 14-foot long fish with dark or light green scales; pale pinkish-white belly and fins; multiple long active whiskers. Splashing sounds.
  habitat: [Bogs, Swamps, Rivers, Lakes]
  habitat_notes: Nest in protected spots like hollow logs, undercuts, deep holes or woody debris.
  watch: {dawn: 20%, morning: 30%, afternoon: 30%, dusk: 15%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 80%, Winter: 40%}
  sparks:
  - The carp is searching the bottom of the lake for tasty morsels.
  - The carp has a javelin through its body.
  - The carp is capsizing a pirogue poled by a trio of boggins or mosslings.
  - The carp is digging a new lair in muddy waters.
  - The carp is in a tug-of-war with a catamount or sabre-tooth lion over a deer's carcass.
  - A king carp named "Old Maw" emerges from the water, its eyes are oddly compelling. Its gaze has a similar effect as a hypnoviper.
  - With no warning, a giant carp leaps from nearby water, catching a giant dragonfly in its maw before disappearing again in the murk.
  - The adventuring company finds a smashed rowboat in the shallow water; all that remains of a giant carp's attack. If they investigate, there is a small strongbox of treasure, but they will attract the attention of the carp.
  - A giant carp gasps and struggles on the riverbank, unable to get back into the water. If the adventuring company pushes it back in, they will be blessed by the Wood Gods (take advantage on one check within the season while in the Dolmenwood). If the adventuring company eats the carp, they find its flesh is tainted by its struggles; all who consume it have disadvantage on rest checks until they succeed on a Strength saving check made once per morning.
- name: Catamount
  type: Creature
  description: 6-foot long great cat with sleek, muscular body; tawny fur. Typically quiet, but snarling and rumbling as warning.
  habitat: [Rolling Hills, Craggy Hills, Mountains]
  habitat_notes: Den in caves or thickets.
  watch: {dawn: 25%, morning: 15%, afternoon: 10%, dusk: 25%, early night: 15%, late night: 10%}
  season: All 100%
  sparks:
  - The catamount is lying in wait in a thicket, perfectly hidden.
  - The catamount is sunning itself on a boulder, in plain sight of the adventuring company.
  - A catamount is stalking the adventuring company. Unless they take extraordinary precautions, the catamount will attack them when they are vulnerable.
  - A catamount is gouging the bark of a tree with its claws.
  - A catamount is face-to-face with a brown bear, snarling viciously.
  - The adventuring company hears a rustle. A boar rushes through the company, followed one round later by a catamount in hot pursuit.
  - The adventuring company finds a shallow cave. Inside, are four helpless, newborn catamount cubs. Their father was killed and mother is out hunting. However, if the mother later catches the company with the cubs, she will attack without hesitation.
  - The adventuring company stumbles upon an adult catamount teaching two cubs to hunt. The catamount is holding down a young elk which is trying to scramble away. The cubs take turns rushing and scratching the elk.
  - A spoil-tainted catamount has the ability to breathe fire as an action (Firey Breath (Recharge 20%)- All creatures within a 15 feet cone must make a DC 14 Dexterity saving check. If the saving check fails, the creature takes 1d16 fire damage. If the saving check succeeds, the creature takes half damage.).
  - The adventuring company sees a single fresh bloody paw print from a catamount. The catamount is nearby but will not attack.
  - A catamount's leg is injured, and unable to hunt. This makes the catamount far more aggressive than usual, but she has lost 10 hit points and can make only a single claw attack.
  - On the trail, a catamount feeds on a slain donkey. Its owner is nowhere to be found. The catamount will not abandon its meal easily.
  - A catamount is dragging a bleating sheep into the bushes.
- name: Catoblepas
  type: Creature
  description: Horrid long-necked boar with multiple tusks; patchy brown fur on leathery hide; stumpy legs; 12 feet long. Snuffles, grunts, and heavy breathing. Very foul smell.
  habitat: [Bogs, Swamps]
  habitat_notes: Dens sheltered by woody overgrowth.
  watch: {dawn: 25%, morning: 20%, afternoon: 25%, dusk: 25%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 60%}
  sparks:
  - The adventuring company spots bones from a rotten carcass. A nearby catoblepas is browsing on peat moss.
  - A rotten smell is the first warning. The catoblepas is basking in the warm sun on the banks of a bog.
  - From a distance, bellowing and crashing is heard. Two catoblepas' are slamming into each other, fighting for a mate.
  - The catoblepas is hiding from needle-nosed bats. It is underwater except for its eyes and nostrils. If anyone approaches too closely, it will erupt and attack. Luckly, it has lost a quarter of its hit points to the bats.
  - A catoblepas is browsing in a particularly putrid of muddy, murky water. Anyone fighting the catoblepas is exposed to sewer filth disease.
  - At dusk, the frogs fall silent. Soon, a catoblepas emerges from the mist.
  - Torrential rain occludes vision and washes out smells. The adventuring company stumbles upon a catoblepas emerging from the muck.
  - A bargeman begs the adventuring company to clear the "Mud Devil" (a catoblepas) that is blocking the entrance to his home.
  - Instead of a rotting gaze, the catoblepas has a "woodifying" breath, similar to a basilisk's gaze, except that it turns victims into woody, bushy trees with medlar fruit (a fruit which is rotten before it is ripe).
- name: Cave Fisher
  type: Creature
  description: 9-foot long bug with segmented body; large pincers; 8 legs; sticky strand from mouth. Wet, sucking sounds.
  habitat: [Caverns, Dungeons]
  habitat_notes: Dark cliffsides. Hides in in high, hidden crevices overlooking cavern trails.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 25%, early night: 35%, late night: 35%}
  season: {Spring: 90%, Summer: 100%, Autumn: 90%, Winter: 50%}
  sparks:
  - The adventuring company finds a broken piece of filament. Not far away, a cave fisher lurks above, with its filament dangling below to catch a victim.
  - The cave fisher is scuttling to find a hiding place.
  - In a canyon, there is a narrow ridge. Lurking above is a cave fisher using it as a funnel.
  - The cave fisher lives in a shallow barrow. It has learned that an open treasure chest with silver attracts a fair number of human snacks.
  - A struggling cave orc (Peteki) is suspended in the air. It is actually pulling against a cave fisher that caught it.
- name: Centaur
  type: Creature
  description: Human torso atop horse body; wild hair flying free; heavy decorative jewelry and tattoos; 8 feet long. Galloping hoofbeats; human speech.
  habitat: [Meadows, Rolling Hills, Light Forest]
  habitat_notes: null
  watch: {dawn: 10%, morning: 35%, afternoon: 35%, dusk: 10%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - The centaurs are roasting a wild boar on a spit with figs. They are led by Uligus, a boastful loudmouth, but an honorable and fine warrior.
  - Centaurs (Marcellon and Ixion) are practicing jousting with blunt spears. They invite any mounted members of the adventuring company to join.
  - Yon, a lone centaur, is blowing an immense horn. He is signaling a gathering of centaurs to occur in three days. Yon is quiet and contemplative, but is over-muscled. He will befriend musicians.
  - Centaurs Obridon and Callion are drinking wine and smoking pipeleaf, discussing fate and free will. They will be stand-offish at first, but may invite the adventuring company to join with some convincing.
  - Centaurs are beating a pack of wolves with clubs. The centaurs are led by Lysandros; he won't accept interference from the adventuring company, but would prefer that the wolves are only punished, not killed.
  - The mares Agra, Helena and Livinnia are braiding each other's hair and tails with flowers, preparing for Helena's wedding.
  - Centaurs are gathering alfalfa for a later meal. Gregari is their spokesman; he is calm and measured.
  - Centaurs are smashing wild grapes to ferment wine. Their leaders are Callion and Atticus.
  - Acrion, a centaur sage, is reading the stars, looking for the tribe's fate. He will be responsive only if the adventuring company evinces an interest in the stars or divination; he affirmatively distrusts the Church and churchmen.
  - Cleanthes, a centaur guard, warns the adventuring company that the path is closed to all who are not members of the tribe. If the adventuring company has business with the tribe, they can meet in a week at a different landmark. The guard refuses to answer what the tribe is doing. If the adventuring company does not proceed, they lose 1d4 travel points.
  - The adventuring company stumbles upon a rare feast between centaurs and satyrs. The feast features roasted venison, wild garlic and berry wine. A wise old centaur (Hippasus) warns the adventuring company that things may get out of hand, gently suggests that more fragile persons should not attend (see notes about centaur feasts).
  - The adventuring company stumbles into a centaur ambush. While this is initially scary, the centaurs quickly back down and their captain, Polus, explains that the adventuring company is travelling on a path known to be used by crookhorn breggles.
  - Stilpo, a centaur minstrel, sings and plays a lyre harp in front of a stately elm tree. If questioned, he will explain that the tree is inhabited by a huldra who he loves. The minstrel specifically asks for news of the wider world beyond Dolmenwood.
  - The centaurs invite the adventuring company to join a night's revel of drinking and dancing, led by the master of revels, Atticus. Things quickly get out of hand.
  - Hesperon, a solo centaur, lost in reverie, is playing a haunting tune on his pan flute.
  - A pair of drunken centaurs (Falcaris and Quorentis) are dueling with quarterstaffs, shouting insults at each other. Another pair of centaurs egg them on, shouting encouragement and insults.
- name: Centipede, Golden
  type: Creature
  description: 18-inch long centipede with golden yellow carapace; dozens of legs; prominent mandibles. Quick scuttling movement.
  habitat: [Rolling Hills, Light Forest, Dense Forest, Thorny Forest, Fungal Forest, Ruins, Caverns, Dungeons]
  habitat_notes: Congregate in debris and rotting vegetation.
  watch: {dawn: 15%, morning: 25%, afternoon: 25%, dusk: 15%, early night: 10%, late night: 10%}
  season: {Spring: 90%, Summer: 100%, Autumn: 80%, Winter: 0%}
  sparks:
  - The adventuring company camps nearby the centipede. At night, the centipede enters a player character's tent and bites.
  - The centipede emerges from an abandoned rabbit burrow.
  - The centipede is feeding on a paralyzed bird.
  - Centipedes emerge from a pile of leaves trod upon by a player character.
  - Centipedes are nesting inside the desiccated corpse of a traveler. If the corpse is disturbed, the centipedes emerge.
  - A weird, rainbow-hued mushroom, with a strong herbal/citrus smell. If the mushroom is disturbed, golden centipedes boil out.
  - While peeing, one person is attacked by a pair of hidden centipedes, who attack with advantage.
  - A dead washerwoman at a clear creek. If investigated, golden centipedes emerge from under her body.
- name: Centipede, Night-Runner
  type: Creature
  description: 5-foot long centipede with dull blue-black carapace; dozens of legs. Quick, scuttling movement.
  habitat: [Light Forest, Dense Forest, Thorny Forest, Fungal Forest, Caverns]
  habitat_notes: Prefers damp conditions.
  watch: {dawn: 10%, morning: 5%, afternoon: 0%, dusk: 25%, early night: 35%, late night: 25%}
  season: {Spring: 90%, Summer: 100%, Autumn: 80%, Winter: 0%}
  sparks:
  - The adventuring company camps nearby the centipede. At night, the centipede enters a player character's tent and bites.
  - The centipede emerges from an abandoned rabbit burrow.
  - A pair of centipedes are on the dungeon wall, chewing on lichen.
  - The centipede drops from dense tree branches, and attempt a quick bite to incapacitate its victim.
- name: Centipede, Red-Leg
  type: Creature
  description: 18-inch long centipede with reddish brown carapace; dozens of red legs. Scuttling movement.
  habitat: [Meadows, Rolling Hills, Light Forest, Dense Forest, Thorny Forest, Fungal Forest, Ruins, Caverns, Dungeons]
  habitat_notes: Avoids cold climates.
  watch: {dawn: 15%, morning: 25%, afternoon: 25%, dusk: 15%, early night: 10%, late night: 10%}
  season: {Spring: 90%, Summer: 100%, Autumn: 70%, Winter: 0%}
  sparks:
  - A pod of centipedes is underneath a log. When disturbed, the centipedes swarm out.
  - Overnight, a red-legged centipede has rested in a player character's boot. When the player character puts on its boots, make an Intelligence check to notice the centipede.
  - A trail of centipedes crosses the forest floor.
  - An unconscious giant frog; a centipede is crawling out of its mouth.
  - A fellow traveler is carrying a sack of apples. When he places the sack down, centipedes boil out.
  - The centipede is very large (3 ft long), very aggressive, and very bright red. It has double normal hit points, and its venom does 1d6 damage.
  - A centipede has worked itself into a person's backpack. Next time the person reaches in, the centipede bites (attacking with advantage).
  - An apothecary or mossling fungalist has captured several centipedes in a gallon-sized glass bottle. He offers to sell the centipedes to the adventuring company.
  - While foraging, the forager disturbs a centipede which surprises and bites the forager (attacking with advantage). After biting once, the centipede scurries away.
- name: Chimera
  type: Creature
  description: Three-headed beast with lion, goat, and serpent heads; lion forequarters and goat hindquarters; 8 feet long. Snarling, bleating, and hissing sounds.
  habitat: [Rolling Hills, Craggy Hills, Mountains, Light Forest]
  habitat_notes: null
  watch: {dawn: 25%, morning: 15%, afternoon: 10%, dusk: 25%, early night: 15%, late night: 10%}
  season: All 100%
  sparks:
  - The chimera is perched on a craggy bluff, surveying game trails below.
  - The chimera is feeding on several red deer.
  - Within 100 feet of the chimera's cave lair, the ground is poisoned and vile. If the adventuring company approaches, the chimera rushes out of the cave, roaring and hissing.
  - A pair of mated chimeras are chasing ibex goats up a craggy hillside. They are cruelly playing with their prey.
  - A chimera and an owlbear circle each other, preparing to battle over territory.
  - This hostile chimera has a bear head instead of a goat head, replacing its Goat Head-butt Attack with a Bear Bite Attack that deals 1d12 piercing damage.
- name: Clay Golem
  type: Creature
  description: Fine gray-white clay; thick features and limbs; arcane symbols carved onto forehead. Ponderous movement.
  habitat: [Settlements, Ruins, Dungeons]
  habitat_notes: Anywhere placed or assisting a wizard.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: All 100%
  sparks:
  - The golem is patiently guarding the innermost sanctum of a wizard's tower, even though the wizard has been dead for centuries.
  - The golem is serving as a bodyguard for a wizard.
  - The golem, unable to fulfill its last instructions, stands patiently until encountered by the adventuring company, when it will go berserk.
  - By erasing the arcane runes, the golem has been deactivated.
  - A clay golem stands motionless in a dusty hall, covered in centuries of cobwebs.
  - The adventuring company hears heavy footsteps. A clay golem emerges from a side passage, investigating the disturbance.
  - A clay golem methodically patrols a vault, its clay body showing cracks from age but still functional.
- name: Cobbin
  type: Creature
  description: Grey-furred, stout anthropomorphic badger standing 5 feet tall. Deep, grunting speech.
  habitat: [Meadows, Rolling Hills, Light Forest]
  habitat_notes: Live in comfortable burrows set into hillsides with round doors and wooden floors.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Cobbin guards (Borran, Gusti and Wibba) armed with spears gruffly warn the adventuring company that they are trespassing. They want the company to go back the way they came.
  - Mooffa and Yappo, a pair of cobbins, are digging mandrake roots.
  - Gustbran, a cobbin warrior, is cleaning his wound beside a stream. He and his companions recently fought a pack of wolves. The warrior is the sole survivor.
  - The cobbins are preparing a meal of berries and honey, setting out a table in the woods. They invite the company to join. Their leader, Woffri, will open the feast with a blessing of harmony for all creatures in the forest.
  - Timble, a cobbin farmer, is hauling a cart of gourds and squashes.
  - Tiggla, a cobbin female, is frantically searching for her lost kit, Dobbi. If the adventuring company helps, they find it has been abducted by crookhorns.
  - Zuppo, a cobbin farmer, is bruised and beaten. After abuse by crookhorns, he rose up and fought it. Now he runs in fear of the Naglord's minions.
  - The adventuring company stumbles across a hidden cell of cobbins plotting resistance against the Naglord (especially cobbin collaborators). The cobbins will be glad of weapons. They are led by an elder captain Elmar and his canny lieutenant Skibbo.
  - Cooshla, a cobbin refugee, seeks heroes to help free the cobbins from the Naglord. She will plead with the adventuring company to free her people.
  - Cobbin workers, overseen by cruel crookhorns armed with whips, are clearing trees in preparation for establishing a new, communal farm.
  - A trio of cobbin women (Grigga, Cooshia, and Timbalina) are weaving baskets from willow branches. They will offer to trade baskets to the adventuring company for food or weapons.
  - Doobie, a cobbin archer, is hiding a longbow and arrows in a nook in a tree.
- name: Cockatrice
  type: Creature
  description: Large rooster with brightly colored red and blue feathers; scaled underside; body ends in snake tail; 3 feet tall. Squawks, clucks, and crows.
  habitat: [Meadows, Rolling Hills, Light Forest, Bogs, Swamps]
  habitat_notes: Prefers to hunt in tall grass. Builds ground nests from branches and mud.
  watch: {dawn: 25%, morning: 30%, afternoon: 30%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 90%, Summer: 100%, Autumn: 80%, Winter: 30%}
  sparks:
  - The cockatrice is dragging a petrified lamb back to its nest.
  - Two cockatrices are engaged in a loud, squawking courtship dance.
  - The cockatrice is pecking at snake, dead but not petrified.
  - A cockatrice is caught in the noose of a hunter's snare trap. The cockatrice cannot move more than 2 feet in any direction, but is still dangerous.
  - An alpha cockatrice is preening and crowing, to intimidate a rival cockatrice which stands mute.
  - The cockatrice has roosted on the antlers of a petrified red deer.
  - The cockatrice is guiding a line of tiny chicks to a stream for a meal of frogs. The cockatrice is distracted by the misbehaving chicks.
  - The cockatrice is sleeping, with its head tucked under a wing.
  - The cockatrice is devouring a giant centipede. The DC of its petrifying touch is 12.
  - The cockatrice has recently lost its head; a petrified wolf nearby shows the reason why. But the cockatrice's body still struts around, its neck spurting blood occasionally. The headless body will die in one hour if nothing is done.
  - A petrified witch stands mute warning to a nearby cockatrice hiding in the underbrush.
  - Four cockatrices are enclosed in a fenced-off area. These are the pets of a nearby Harridan, who uses them for arcane reagents.
  - A petrified wolf holds a cockatrice trapped in its jaws. The cockatrice squawks furiously, but cannot escape.
  - The adventuring company discovers a cockatrice nest with three eggs. The mother is nowhere near.
- name: Crab, Bone
  type: Creature
  description: 2-foot wide crab with dull white carapace resembling bleached bones. Scuttling and clacking.
  habitat: [Meadows, Seas]
  habitat_notes: Sandy saltwater beaches.
