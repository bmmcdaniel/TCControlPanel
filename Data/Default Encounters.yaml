  - An oil whale is trying to escape the grasp of a giant squid.
  - An oil whale unexpectedly breaches nearby; its spout sprays warm, wet mist over the adventuring company.
  - An oil whale is singing its child to sleep.
  - The oil whale has an old harpoon stuck in its back. It distrusts and hates humanoids.
  - A dead oil whale is washed up on the shore. Oil and ambergris can be scavenged from its corpse.
- name: Whale, Tusked
  type: Creature
  description: 20-foot long whale; dark gray skin; gaping mouth with prominent teeth and tusks; vicious red eyes.
  habitat: [Seas]
  habitat_notes: null
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 100%}
  sparks:
  - A pair of enraged tusked whales attempt to smash the adventuring company's boat to pieces.
  - A tusked whale hunts for prey just below the sea's surface.
  - For no apparent reason, a tusked whale jumps 20 feet in the air.
  - A tusked whale is carrying a seal back to its pod.
- name: Whitecap Mushroom
  type: Creature
  description: 5-foot tall, off-white mushroom.
  habitat: [Fungal Forest, Caverns]
  habitat_notes: null
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 60%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - In a cavern, the adventuring company jumps from one level to a lower level. Unfortunately, hidden in the rocks are several whitecap mushrooms, and the drop triggers their blindness spores.
  - The adventuring company encounters a hapless blind bear, whose eyes are replaced by tiny whitecap mushrooms.
  - The adventuring company is standing on a trail cut by 30 foot deep ravine. At the bottom of the ravine are clearly visible whitecap mushroom. Any fall will trigger their blindness spores.
  - A Geatish stone burial slab covers a small cavity. If the slab is removed, whitecap mushrooms living in the cavity release their spores. In the cavity is an ancient Geatish barrow (33% chance of a barrow wight).
  - A pair of whitecap mushrooms stand amidst other mushrooms. Any character with herbalism or fungalism skill can easily warn and avoid them. Otherwise, make a DC 10 luck check to see if the adventuring company avoids.
  - Yallow, a mossling mold oracle, is cultivating tiny whitecaps all over its body, including its eyes. He can control the release of the spores, and will not involuntarily affect the adventuring company. However, he does rattle on how he can "see much deeper" without eyes, and encourages the company members to accept the spores.
  - Whitecap mushrooms grow thickly here. If the adventuring company moves forward, they will discover an enormous, 15 foot tall whitecap. Its blindness spored occur in a 30 foot cloud and require a DC 12 Luck check to resist.
- name: Wicker Golem
  type: Creature
  description: Human-shaped, woven from wicker; deep inside burns a bright green flame. Creaking and cracking sounds.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: Near Drune.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {All: 100%}
  sparks:
  - The wicker golem is defending a dolmenstone against the attack of crookhorns. It has already swallowed one.
  - The wicker golem is accompanied by a half-dozen bramblings, guarding the home of a Drune sorcerer (Curmanach).
  - The wicker golem's master died; now it wanders the forest with no instruction.
  - At the behest of its Drune master, Oebryr, the wicker golem is pushing massive stones in place to dam a stream and form a pool.
  - A solitary giant wicker golem stands still in a glade with a dolmenstone. If trespassers approach the dolmenstone, the golem animates and attacks.
  - At night, the adventuring company hears distant noise of wood smashing and green lights. A wicker golem has gone berserk. The adventuring company may venture out and be attacked. In the morning, they can find the corpses of crookhorns and a trail of destruction left by the golem.
  - Nearby a stream, a Drune cottager (Hestith) and two Drune braithmaids (Lollmar, Pollcanyr) are weaving a golem, using water from a steaming cauldron to shape the wicker. The Drune cottager has a parchment scroll to serve as the golem's activation rune.
  - A destroyed wicker golem is falling to pieces, and covered with fungal growths, including violet fungi. At the golem's heart, its activation rune is still intact.
- name: Wild Hunt
  type: Creature
  description: Raucous procession of fairies, elves, centaurs, satyrs and goblins riding fairy horses and accompanied by fairy hounds. Horns blowing, hoofbeats, baying hounds, wild laughter and shouting.
  habitat: [Dense Forest, Thorny Forest]
  habitat_notes: Near fairy realms, especially hexes 1502 and 1503.
  watch: {dawn: 10%, morning: 15%, afternoon: 15%, dusk: 30%, early night: 15%, late night: 15%}
  season: {Spring: 10%, Summer: 100%, Autumn: 100%, Winter: 50%}
  sparks:
  - The wild hunt, a raucous train of fairies, gleefully charges through the forest after prey (see DCB hex 1502). There is a 50% chance it is led by Duke Mai-Fleur; 50% chance led by an elf knight. The hunt includes elf wanderers, fairy horses, fairy hounds, centaurs, satyrs, and goblin attendants.
  - Laden with elk, boar and deer, the wild hunt is returning to Duke Mai-Fleur's hunting lodge. He has already gone ahead. If the adventuring company is quiet and careful, they can shadow the wild hunt back to his lodge.
  - A unicorn (Elaina) rushes by the adventuring company. In the distance, horns from the wild hunt blow.
- name: Wodewose
  type: Creature
  description: Naked humanoid covered in shaggy hair; wide eyes; body adorned with living ivy, lichen, moss, and ferns. Grunting and shuffling vocalizations; drumming.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: null
  watch: {dawn: 25%, morning: 15%, afternoon: 15%, dusk: 25%, early night: 10%, late night: 10%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 70%}
  sparks:
  - The wodewose ate hallucinogenic goatman's goblet fungus, and now are dancing merrily around the trunk of a fallen tree.
  - A wodewose is climbing a tree, looking for intruders.
  - Three wodewose are bathing in pool of clean water.
  - A pair of wodewose are carefully combing each other's shaggy hair.
  - A rustle in the undergrowth reveals a solitary wodewose peering wide-eyed from behind bushes. He cautiously offers some edible fungi before vanishing into the undergrowth.
  - At dawn, the adventuring company witnesses three wodewose gathering fresh ivy to adorn each other. This ivy allows them to virtually disappear into the living woodland.
  - At night, the adventuring company hears drumming. If they investigate, they discover a dozen wodewose drumming and dancing in the moonlight. If the company is discovered, the wodewose flee.
  - A particularly handsome wodewose carrying a large club is posing to allow a nearby elf courtier (Dappled-Shadows-on-Water) to paint him on a canvas and easel. If the adventuring company is seen, the wodewose will flee and Dappled will be irritable and cross with the company.
  - During a storm, the adventuring company stumbles across a band of wodewose huddled in the cave together with rabbits, hedgehog, mice and a wolperdingle. They silently motion the company to join them, where the company can wait out the storm. The wodewose grunt and shuffle but don't talk.
- name: Wolf
  type: Creature
  description: Gray fur fading to white on belly; shining yellow eyes; perky ears; sharp fangs. Yips, snarls, and howls.
  habitat: [Rolling Hills, Craggy Hills, Light Forest, Dense Forest]
  habitat_notes: null
  watch: {dawn: 20%, morning: 10%, afternoon: 10%, dusk: 35%, early night: 20%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 100%}
  sparks:
  - No wolves are seen, but at night haunting wolf howls echo through the woods. At best, the adventuring company has disadvantage on rest checks.
  - A single wolf is caught in a wolfsangel (wolf's hook). A wolfsangel is Z-shaped hook embedded by trappers in meat; when swallowed by a wolf, the wolfsangel catches and prevents the wolf from escaping.
  - A pack of wolves chases a herd of elk through an open meadow. They will attempt to cut out an older elk and bring it down.
  - It has been a lean winter and a wolf pack is starving. Over the course of an hour, the adventuring company hears wolves howling from multiple directions, as the pack coordinates on the location of the adventuring company. Once coordination is complete, the pack will attack.
  - Mother wolf is lying in a shallow den amidst playful cubs. When she sees the adventuring company her demeanor instantly changes and she will snarl menacingly. If the company does not leave, she will attack (and does not need to check morale).
  - Two small packs of wolves encounter each other. Pack leaders are uncertain whether to fight or combine.
  - Two snarling wolves are protecting a stag carcass against a brown bear.
  - A starving wolf is drawn to the adventuring company's campsite by the smell of meat cooking.
  - A rabid wolf twitches on the trail ahead. When it spots the adventuring company, it rushes.
  - If the lone wolf sees a player character displaying a holy symbol, the wolf will bow its head and crawl on its belly in submission. The wolf will follow the player character (from a distance if necessary) until the player character accepts the wolf, by word or deed. From that point, the wolf will be a loyal guardian of the player character.
  - A pack of wolves includes a feral boy who was raised with them.
  - This massive alpha wolf is blessed by the gwyrgions. Its eyes glow with a green flame, and it has double hit points. It will appear to the adventuring company atop a hill or ridge and ask the adventuring company to account for their deeds. If it approves, the adventuring company gains a blessing (1-minute advantage on a d20 checks within dolmenwood) or bane (1-minute, selected by GM, disadvantage on a d20 checks within dolmenwood).
  - The adventuring company finds a heavily wounded alpha wolf limping from its injuries. If the adventuring company follows it, the wolf leads to a magical healing spring which restores all injuries (usable once per season per creature).
  - A lone wolf watches from atop a low ridge, ears flicking.
  - Four wolves harass a giant porcupine, keeping their distance but clearly looking for a meal.
  - Wolves howl at midday—an ill omen. A hidden witch listens along with them.
- name: Wolf, Corrupted
  type: Creature
  description: Wolf with chaos mutations; red eyes; shaggy fur; fleshy tendrils. Howling, growling, snarling.
  habitat: [Craggy Hills, Light Forest, Dense Forest, Thorny Forest, Ruins]
  habitat_notes: null
  watch: {dawn: 20%, morning: 5%, afternoon: 5%, dusk: 30%, early night: 25%, late night: 15%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 100%}
  sparks:
  - No wolves are seen, but at night haunting wolf howls echo through the woods. At best, the adventuring company has disadvantage on rest checks.
  - A pack of wolves, led by an enormous black alpha wolf, ambushes the adventuring company. The wolves all have strange, red eyes and shaggy fur.
  - A single alpha wolf, with strange tentacles growing from its neck attacks the adventuring company (add two Tentacle Attack- +6 1d8 piercing damage). Anyone that is hit with a tentacle attack is exposed to chaos disease.
  - Four wolves, with horns, bones jutting from their flesh and bloody patches trail the adventuring company, and will attack at night. Anyone that is bit by a wolf is exposed to frothing rabes.
  - The adventuring company finds a wolf whose body has been fused with a tree; its head and upper body have motion, but its hind portions are irretrievably stuck. The wolf howls in agony. It is helpless, and can be easily killed, but will not die naturally.
  - An alpha wolf, with many eyes covering its body. On its turn, without using its action, the wolf can gaze on a target, with the same effect as a Devil-Goat Gaze.
  - A trio of spider wolves. These wolves' legs are replaced with 8 spider legs and their bite delivers venom with the same effect as Dark Widow venom. They are aggressive and will attack the adventuring company.
  - An alpha wolf, with two heads, giving it an extra bite attack. He announces his presence with a two-throated growl. Next round, he will attack, favoring clerics and other holy persons.
- name: Wolf, Winter
  type: Creature
  description: Pure white fur; black eyes; misty breath; sharp teeth. Yips, snarls and howls.
  habitat: [Rolling Hills, Craggy Hills, Mountains]
  habitat_notes: Cold, snowy hills and forests, tundra.
  watch: {dawn: 20%, morning: 15%, afternoon: 15%, dusk: 30%, early night: 15%, late night: 5%}
  season: {Spring: 5%, Summer: 0%, Autumn: 10%, Winter: 100%}
  sparks:
  - A lone wolf is scarred from a previous encounter with a hunter. It will attack humanoids on sight.
  - A pair of winter wolves is migrating north/south for the summer/winter. They are tired, and will try to avoid a fight but will not run.
  - A winter wolf is stalking an aurochs.
- name: Wolperdingle
  type: Creature
  description: Large rabbit with prominent antlers; soft brown fur; long ears. Quiet thumping of feet.
  habitat: [Meadows, Rolling Hills, Light Forest]
  habitat_notes: Prefers tall grass and forest edges.
  watch: {dawn: 30%, morning: 10%, afternoon: 10%, dusk: 35%, early night: 10%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 100%}
  sparks:
  - Three wolperdingles graze in tall grass, while the buck stands guard on a small hill.
  - A wolperdingle buck charges a fox that's gotten too close to its warren, antlers lowered.
  - A pair of wolperdingles box with their hind legs, antlers clashing in a territorial dispute.
  - The adventuring company spots a flash of antlers disappearing into thick underbrush.
  - A wolperdingle doe leads her young across a meadow at dusk, freezing at any sound.
  - The adventuring company finds a wolperdingle warren entrance beneath tangled roots. Fresh tracks surround it.
  - A lone wolperdingle buck sits motionless in tall grass, only its antlers visible above the stalks.
- name: Wrong'un
  type: Creature
  description: Human corpse covered in fungus and toadstools; shambling gait. Whistling, singing hometown ditties, confused speech.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Dense Forest, Roads]
  habitat_notes: Often traveling from ley lines, toward former home.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 10%, late night: 10%}
  season: {Spring: 40%, Summer: 80%, Autumn: 100%, Winter: 80%}
  sparks:
  - The wrong'un whistles merrily and sings a hometown ditty while tramping along a path.
  - The wrong'un approaches the adventuring company and asks if they know Matilda. It can't offer any other details, but he is desperately searching for her.
  - The wrong'un has arrived home and is madly chasing a young man, its former husband, while screaming "I love you with all my heart."
  - A wrong'un shambles from the undergrowth. It pleads with the adventuring company to guide it to a distant village it dimly remembers. If led there, as it gets closer, the wrong'un becomes increasingly agitated and violent.
  - The party finds a corpse in the woods sprouting strange mushrooms. At night, the corpse rises as a new wrong'un, confused and dangerous, seeking its "home."
  - The adventuring company meets a wrong'un at a crossroads. It insists on accompanying the company and offers to carry the company's gear, saying "no trouble at all, sir." It asks where the adventuring company is headed, and inevitably responds by shaking its head "No that's not right at all."
- name: Wyrm, Black Bile
  type: Creature
  description: Sinuous dragon; wings and four legs; brown-black scales; patches of fur; pale yellow eyes; prominent forked tongue. Deep rumbling, hissing.
  habitat: [Rolling Hills, Craggy Hills, Ruins, Caverns]
  habitat_notes: null
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - The wyrm (Iormengaur) is coiled around a dead horse, in battle with a knight of Brackenwold (Sir Timeon).
  - A wyrm (Rhendegund) is lying in wait beneath a mound of freshly dug earth topped with the bloody corpse of an old woman.
  - The adventuring company hears a wyrm (Jaugr) crashing through the forest in a blood rage, levelling small trees. The wyrm has ravaged a cluster of woodland huts and hungers for more flesh.
  - The wyrm (Luthera) is coiled around an 8 foot sphere of luminous energy. The sphere is protecting a witch. She is biding her time, but would be appreciative of assistance.
  - The wyrm (Cresyndox) has made its den under a huge bramble patch. It is cowardly and will not attack companies appearing well-armed.
  - The wyrm (Idrammar) has made a den from a fused cairn of bones- deer, wolves, and more than a few men. For a mile around, there is a lingering necrotic mist.
  - A trio of mendicant monks (Jessop, Bromir, Gharth) stands chants funerary rites over a blighted forest area. They are permanently beguiled by a black bile wyrm (Dhendralyx) and warn the adventuring company to retreat. They say that the wyrm is "the forest's necessary sorrow." The wyrm itself is canny and unlikely to expose itself to the adventuring company. The wyrm's lair is a saint's shrine, with many gold and silver offerings as part of its treasure, including a particularly fine chalice incorporating the saint's skeletal hand.
  - A young black bile wyrm (Vrimondehere) is crossing the land, searching for a mate. It is exposed, making it nervous.
  - The black bile wyrm (Embrune) has made a den of a Geatish king's barrow, taking considerable amounts of gold coins, armor and weapons as its treasure. For its amusement, the wyrm has wrapped the barrow-wight in chains on its throne.
  - A hungry black bile wyrm (Urgaelund) is hunting. He will overfly the adventuring company (using his presence ability), then land to snatch any animals or weak-looking adventurers, then fly off.
  - In the High Wold, the black bile wyrm Bharhgda (hex 0712) flies overhead, carrying a slain cow back to her young.
- name: Wyrm, Blood
  type: Creature
  description: Sinuous dragon; wings and four legs; deep crimson scales; tan antlers or horns; bright golden eyes; black forked tongue. Deep rumbling, eloquent speech.
  habitat: [Rolling Hills, Light Forest, Dense Forest, Thorny Forest, Caverns]
  habitat_notes: null
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - A flying blood wyrm (Felruithe) is fighting a flock of a dozen griffons. The griffons are in the service of a powerful wizard (Ghondyr), who has instructed them to kill the wyrm and retrieve its body.
  - On a road, a blood wyrm (Ondramox) has waylaid a merchant caravan. The merchants' guards and laborers are unloading gold and wine at the demand of the wyrm. The merchant's name is Borrid.
  - Wild-eyed breggles have been charmed by the blood wyrm (Chaymelunder). They attack all humans they encounter, dragging unconscious bodies back to the blood wyrm's den for it to devour.
  - The adventuring company finds large patches of clotted, poisonous blood (being fed on by giant gadflies); sure sign of a nearby blood wyrm. The blood wyrm (Caletha) recently devoured a herd of pigs, and a swineherd; it is now lazily sleeping in its nearby den.
  - A young blood wyrm (Aelgothryn) roosts in the top of an enormous oak tree. The wyrm is curious and, if given the chance, interrogates the adventuring company about nearby settlements, religion and treasure. If the wyrm suspects the adventuring company has any gold, it will demand they turn it over. The wyrm's lair is in the roots of the tree; the entire den is covered in sticky, clotted blood. In addition to the usual coins and trade bars, the wyrm's den includes a large collection of soldier puppets, armed and armored.
  - An old witch (Grimelda) and an adult blood wyrm (Mensendra) are conversing in draconic. The witch asks the wyrm drive away servants of the Naglord, but the wyrm doesn't see any personal advantage. The witch will demand that the adventuring company leave them in peace, threatening retribution.
  - A blood wyrm (Nalgrith) has recently wakened from a century's sleep. The wyrm is terrorizing a local village, returning each night to devour villagers and livestock. Savik, a peasant, encounters the adventuring company and demands that they "as true knights" track the wyrm back to its lair and slay it. See Glade of the Grume in separate adventure Dolmen Dozen.
  - A blood wyrm (Haelthra) has made its lair among sulfurous hot springs, which exude a nasty smell. As the adventuring company traverses the pools, it rises from the pools, angered that the company has trespassed.
  - In the Table Downs, the adventuring company is spotted by Queen Incantral (hex 1302). She was hunting goats, but will pause her hunt to gather additional servants. At night she, will approach the company's campsite and use her beguiling voice to convince a guard to join her. Any beguiled member may make a daily saving check to resist the wyrm's charm and flee her company. Likely the member will eventually rejoin the company.
- name: Wyrm, Maegen
  type: Creature
  description: Sinuous dragon; wings and four legs; vibrant green scales; yellow crest; bright golden eyes; red forked tongue. Deep rumbling, arrogant speech.
  habitat: [Craggy Hills, Mountains, Dense Forest, Thorny Forest, Caverns]
  habitat_notes: null
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - A maegen wyrm (Raxmure) flies into the nearest settlement, perching at its highest tower. The wyrm bellows a challenge to a knight (Sir Warren) which it accuses of dishonorably stealing the wyrm's treasure. If frustrated, the wyrm will begin setting fire to buildings.
  - The adventuring company smells a delicious meal. A maegen wyrm (Llorgrathe) has slain a boar, and is picking it apart and charring it with its breath before eating it. The wyrm is likely to attack if disturbed.
  - The adventuring company finds a hidden cave suitable to spend the night. But when the explore its far recesses, they find signs of a wyrm. If they track deeper, they find a sleeping maegen wyrm (Angraweal). The dragon's treasures include gold coins are scattered throughout the lair, a barrel of swords (including two magic swords), a crystal ball, a Geatish king's crown, and a reliquary containing the teeth of an unknown saint.
  - The adventuring company finds a 3 foot long maegen wyrm's skull, uncovered by a recent flood. The skull itself is valuable. However, if kept for a season or more, it attracts the attention of a maegen wyrm (Daeluthem), who will search for the company to recover the skull.
  - Near Dreg. A juvenile maegen wyrm (Arwond) is terrorizing the village of Dreg, finding the black bog-swine to be delicious; it raids the pigpens at night. The swineherd Joreal will approach the adventuring company, hoping for help from the heroes. Myrrsian the Mutable (hex 1110) doesn't know much dragon-lore, but is willing to make an introduction to the consulting wizard Mostlemyre Drouge in Prigwort. Myrrsian will pay handsomely for the dragon's heart.
- name: Wyrm, Phlegm
  type: Creature
  description: Sinuous dragon; wings and four legs; scintillating silver-grey scales; purple fringes and whiskers; pale yellow-green eyes; purple forked tongue. Deep rumbling, languid speech.
  habitat: [Bogs, Swamps, Rivers, Lakes, Caverns]
  habitat_notes: null
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - The adventuring company hears haunting harp music. If they follow the sounds, they find a woman (Gwendolin) dressed in white, playing a harp. She sits on a rock overlooking a river. From the river, a young phlegm wyrm (Shelm) sways gently to the music. The witch Gwendolin has bonded with this wyrm. Neither the witch nor the wyrm will take kindly to interruptions – she will give a first warning, but then likely will flee or attack. If the adventuring company waits for the performance to finish, she will be neutrally disposed. Gwendolin believes that understanding phlegm wyrms is the key to waking the Wood God Gheillough (DCB pg 37).
  - On a river, a pair of fishermen (Giles and Wyr) on a boat cry out in terror when they see the flashing silver coils of a phlegm wyrm (Hyarlecula) beneath the surface. The wyrm will not attack.
  - Darting from a murky pool beside a ruined watermill, the phlegm wyrm (Lygaxur) is dragging a merchant (Dariel) and his guards to their doom underwater.
  - A human woodsman (Dory) is tying lowing cattle next to a bog or river. The woodsman explains that the cattle are a sacrifice to a phlegm wyrm (Stimaeghyr) that lives nearby. Villagers sacrifice the cattle to appears the wyrm.
  - The adventuring company hears a bugle blow then a voice calls out a riddle challenge to "Winkimerro." If the company investigates, they find a breggle minstrel who desires to challenge a phlegm wyrm (Lemmelde) to a riddling contest; the breggle offers a large ruby, and seeks a magical, ivory shawm possessed by the wyrm. If the adventuring company will stay and bear witness (and guard the breggle), he will be grateful. The third time the challenge is issued, the wyrm emerges and agrees to the contest.
  - While traversing a slow-moving waterway, the adventuring company notices that the frogs have started croaking in unison. Soon, a phlegm wyrm (Nimunaur) emerges from the water. The phlegm wyrm deceitfully suggests that the water ahead has a whirlpool, powered by a powerful nack. The wyrm says the only way to appease the nack is to throw overboard gems and silver.
  - Without warning, a juvenile phlegm wyrm (Urmagaur) concealed in underbrush speaks to the adventuring company. The wyrm wants to enlist the company in slaying a powerful galosher that is near the wyrm's grotto lair. It offers a magical sword if the company succeeds; the sword can only be retrieved after the galosher is cleared. The wyrm is true to its word, and will allow a gracious company to camp in its grotto lair now or in the future.
  - At a river's shore, the adventuring company finds elaborate lithophones, bowl-like granite rocks that produce musical tones when struck. These are occasionally used by mosslings to entertain the phlegm wyrm (Caletha) who lairs nearby. If the lithophones are disturbed, the wyrm emerges, angered. If the lithophones are played, the wyrm emerges, pleased.
  - After an overnight storm, the adventuring company finds a 12 inch, sparkling silver egg. It is the egg of a phlegm wyrm, dislodged from its nest by floodwaters. Later, the company sees the wyrm (Brathymere) frantically searching for its missing egg. If the company reveals they have the egg, the wyrm may attack or bargain, depending on how safe the egg seems. If the company conceals the egg, they may hatch the wyrm.
  - A phlegm wyrm (Nethucul) has caught a 4-foot long spike-tooth salmon, and is eating the most succulent parts.
  - In the swamps, a phlegm wyrm (Frinwyll) coils around a huge hollow thorn tree. The wyrm cannot allow anyone to escape alive with knowledge of the location of its lair.
  - In the Nagwood, the adventuring company encounters the phlegm wyrm Sowynder (hex 0802). Sowynder seeks the flesh of a sentient for a meal. He will sweetly inquire whether the adventuring company will dive their smallest member, for which Sowynder will allow the remainder to leave peacefully.
- name: Wyrm, Tatzelwyrm
  type: Creature
  description: Snaky dragon; vestigial wings and four legs; dull green or tan scales; pale yellow eyes; red forked tongue. Hissing and snarling.
  habitat: [Rolling Hills, Craggy Hills, Light Forest, Dense Forest, Bogs, Caverns]
  habitat_notes: null
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - A tatzelwyrm is sunning itself on a stone outcropping. When it sees the adventuring company, it scrambles down into a dirt hole which serving as its den. Inside its den is a treasure composed of smooth river stones.
  - The adventuring company comes across an abandoned well. At the bottom of the well, the adventuring company can hear a tatzelwyrm shifting around.
  - The tatzelwyrm has made a lair in a small limestone cave. It is decorated with sheep's skulls and the skull of a shepherd.
  - At night, the adventuring company stumbles upon a tatzelwyrm chasing its own tail in the moonlight; it is frothing at the mouth.
  - At night in a rainstorm, a shivering young tatzelwyrm tentatively enters the adventuring company's campsite, attempting to curl up beside the fire. If the company does not react with hostility, a Luck check may make him a pet of the company. (The tatzelwyrm is 5 ft long, 20 hit points; +3 attacks).
  - A tatzelwyrm has slain a boar and is dragging it back to its den for a meal. It will fight to defend its meal.
  - A tatzelwyrm with bright red mushrooms growing from its back. The tatzelwyrm is wandering in a hallucinogenic daze from the mushrooms.
  - A tatzelwyrm with a heavy iron collar and chain. The tatzelwyrm was the pet of a giant, but broke free. The tatzelwyrm is very aggressive, but if the adventuring company can calm it down and remove the collar, it will be grateful.
  - A tatzelwyrm coils around a stone cairn.
- name: Wyrm, Yellow Bile
  type: Creature
  description: Sinuous dragon; wings and four legs; tarnished yellow-gold scales; tufts of white hair; pale red-orange eyes; red forked tongue. Deep rumbling, erudite speech.
  habitat: [Craggy Hills, Mountains, Light Forest, Dense Forest, Ruins, Caverns]
  habitat_notes: null
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - A yellow bile wyrm (Lindharn) has made its lair in an unfortunate wizard's tower, taking all its books and arcane implements as the base of its hoard. If the adventuring company approaches, the wyrm sticks its head from the tower. The wyrm demands that the company deliver all books and writings in their possession. If they do so, the wyrm will allow them to pass in peace.
  - A yellow bile wyrm (Chorwyraux) soars above the forest canopy, dripping yellow bile. It does not disturb the adventuring company, but they are affected by its presence ability.
  - The adventuring company finds a trail of sticky, yellowish bile, mixed with blood. If they follow the trail, they encounter the yellow bile wyrm's lair, a cavern with a narrow entrance. The wyrm (Nalgrith) is sluggish having greedily devoured an entire aurochs. The wyrm will immediately attack the intrusion on its lair. The wyrm's lair contains several chests of gold, heavy armor made of ivory mammoth tusks carved with magic runes, and a witch's magic staff. In addition, the wyrm has dragged into its lair an entire dolmenstone, carved with ancient elven runes.
  - Overhead, an adult yellow bile wyrm (Taelmaur) and a juvenile blood wyrm (Waldhryr) are locked in combat, breathing and clawing the other. The blood wyrm accidentally intruded on the yellow bile wyrm's territory and is likely to die.
  - The adventuring company discovers Sharlin, a wounded bile wyrm. It is carrying a leather hide covered with runes, copied from a faraway dolmen. The wyrm will hiss at the adventuring company and arrogantly tell them to back off; the wyrm is concerned with its treasure, but will attack if not obeyed.
  - At night, a yellow bile wyrm (Dendramaur) sees the adventuring company's fire. It will perch on a nearby tree, inhale and maliciously extinguish the company's fire, and damage any stray company members. However, the wyrm prefers not to fight, and afterwards will fly away.
  - A yellow bile wyrm (Udraleeth) lurks near a crossroads. It will challenge travelers, demanding tribute.
  - In the Aldweald, the adventuring company meets the goblin Weezint who recently discovered the sleeping chamber of the dual-headed yellow bile wyrm Chasobrithe (hex 1107). Weezint offers to sell the location of the wyrm's cave to the adventuring company for an equal share of any loot recovered. Weezint will guide the company to the wyrm's cave, but will not accompany them inside; instead, he will lurk outside for up to two days.
- name: Wyvern
  type: Creature
  description: 20-foot long, thick-bodied lizard; greenish scales; wings; two legs. Flapping wings, screeching.
  habitat: [Rolling Hills, Craggy Hills, Light Forest, Ruins]
  habitat_notes: null
  watch: {dawn: 30%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 3%, late night: 2%}
  season: {Spring: 90%, Summer: 100%, Autumn: 90%, Winter: 0%}
  sparks:
  - A flight of wyverns is feasting on the remains of a herd of boars.
  - A single wyvern is carrying a sheep back to its lair.
  - A flight of wyvern is attacking a flight of griffons that have wandered into their hunting territory.
  - A single wyvern is building a nest in the top of a ruined tower.
  - In the Nagwood, a mutant two-headed wyvern (it has multi-attack allowing two bite attacks). One head is gulping down a false unicorn, while the other watches. The wyvern will instantly attack the adventuring company.
  - In a forest glade, a wyvern sits atop a dolmenstone. The wyvern is drawing power from the dolmenstone, and will not react to the adventuring company unless attacked.
  - The adventuring company finds a wyvern nest. Inside is a solid gold egg. The egg weighs 10 slots (50 pounds!). The egg is the result of a fairy curse. There is a 50% chance the egg is fairy-stuff.
  - In a field with a half-dozen dead sheep and a dead shepherd, a wyvern calmly munches on a dead sheep.
  - The adventuring company finds a wounded wyvern screeching at a cave entrance it is too small to fit into. Fwyron, a Drune cottager, is trapped inside the cave; unfortunately, he has already used all his spells.
  - The adventuring company finds a dead elk, with only a small bite on its back. If examined, it is evident that the elk died of venom. If the adventuring company lingers, they may be attacked by the responsible wyvern.
  - A wyvern lazily flaps overhead, carrying a squealing pig in its claws.
- name: Yellow Mold
  type: Creature
  description: Furry, dark golden carpet.
  habitat: [Fungal Forest, Caverns, Dungeons]
  habitat_notes: null
  watch: {dawn: 15%, morning: 30%, afternoon: 30%, dusk: 15%, early night: 5%, late night: 5%}
  season: {Spring: 60%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - Yellow mold clings to rotting timber, releasing visible spores when disturbed.
  - A thick coating of yellow mold covers an abandoned chest in the corner.
- name: Yickerwill
  type: Creature
  description: Mothlike goblinoid with moth eyes, wings, and antennae; fuzzy hair covering body. Chittering whispers.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: Forest lands encroaching on faerie.
  watch: {dawn: 10%, morning: 8%, afternoon: 7%, dusk: 20%, early night: 30%, late night: 25%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - The yickerwills (Kinklenose, Blottle, Dreep, Gosselbud) approach the adventuring company proposing to trade fine silken clothes for the company's grubby, used clothing. The yickerwill's clothing is made of faerie-stuff and will soon melt away.
  - A yickerwill (Gobbler) proposes to trade a treasure's location for all of the adventuring company's clothing. The yickerwill describes the treasure as a chest of gold, buried in the forest. There is a 33% chance the yickerwill is lying; 33% chance the treasure is there but guarded by (unmentioned) barrow wights; and 33% chance the treasure is unguarded.
  - At night, a group of yickerwills (led by Jumblepot) attempt to subdue any lookouts and steal any clothing unguarded. The yickerwills are armed with a wand of sleep.
  - A group of yickerwills (led by Threadkin) are feasting on garments from a washerwoman. The washerwoman and her sons lie frozen to death nearby.
  - At an inn near the wood's edge, clothing keeps going missing. The innkeep (Auburn) asks the adventuring company to investigate. Yickerwills (Mottlenose, Quabble, Drimsy, etc.) living in the attic of the inn are responsible.
  - The adventuring company stumbles upon a pair of yickerwills (Pindle and Spaddlecap) stuffing clothing into a hollow tree; this is storage for the winter. The yickerwills will be furious and demand that the adventuring company "forget what you saw."
  - A solitary yickerwill (Gummerly) flies into the adventuring company's camp at night. He chirpingly demands clothing. If refused he insists that his (nonexistent) allies will "flood the camp with ice and cold."
  - On a trail in the woods, a group of four yickerwills (Dabbledew, Bumblegut, Wibbler, Needlefoot) demand the adventuring company surrender their cloaks to pass. If the adventuring company refuses, the yickerwills will make a single attack, then fly off. But the yickerwills will harass the company for at least a day.
