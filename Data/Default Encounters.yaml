  - The ooze is lurking in the deepest part of a slow river. While fishing, a player character pulls it up.
  - The ooze is resting in a natural bowl in a cavern.
  - In a bog, the crystal ooze lies motionless, waiting for the adventuring company to cross.
  - In the dense forest, one area of moss is oddly wet. As the adventuring company approaches, the wet spot lashes out as a crystal ooze.
  - A wading deer screams in terror. It is trapped in a crystal ooze.
  - Near a river ford, there are several dead fishes, partially dissolved. If the adventuring company crosses the river, they will be attacked by several crystal oozes.
- name: Deer, False Unicorn
  type: Creature
  description: Small, white-furred deer with dappled flanks; single straight antler (female) or single branched antler (male). Smells of flatulence.
  habitat: [Light Forest, Dense Forest]
  habitat_notes: null
  watch: {dawn: 35%, morning: 15%, afternoon: 10%, dusk: 30%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - A lone female false unicorn is seen ahead in the mists. Alas, not a real unicorn.
  - The herd of false unicorns is drinking from a stream, with alternate males keeping watch.
  - The adventuring company startles a herd of false unicorns. Most flee quickly, but one lags behind. Its leg is wounded from a hunter's arrow.
  - A single false unicorn is being chased by a wolf.
  - The adventuring company startles a herd of false unicorns. Most flee, but one confused (male) deer runs directly into the leading member of the company.
- name: Deer, Red
  type: Creature
  description: Elegant, red-furred deer with dappled flanks. Snorts when alarmed.
  habitat: [Light Forest, Dense Forest]
  habitat_notes: null
  watch: {dawn: 35%, morning: 15%, afternoon: 10%, dusk: 30%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - A herd of deer grazes in a meadow. If startled, they flee.
  - A magnificent 18-point stag stands watch while his mate and fawns graze. If chased, the stag leads the adventuring company on a long, far chase, but is careful to not get too far ahead (allowing his mate and fawns to escape).
  - A single albino stag appears ahead of the adventuring company. If the company follows, it leads them to a forgotten shrine to Saint Waldo and charges the company with restoring it to worship.
  - A dead deer, gutted, lies beside the trail. Its flesh not eaten by what killed it. An ominous sign of something unnatural.
  - The adventuring company stumbles upon a young fawn, curled in a depression in the woods. The fawn is helpless and fearful.
  - A herd of red deer cautiously pick their way through a field of bright violet mushrooms. Do the deer know something?
  - Surrounding an ancient oak tree are a jumble of discarded antlers. Some are ancient, others are recent.
  - A stag has been touched by chaos, madness and aggression. It has black, mangy coat, 10 hit points, gore attack +3 dealing 1d8 piercing damage. Any creature struck by the stag is exposed to mange.
  - A wounded doe lies on the floor of the forest, too weak to move. She was the victim of needle-nosed bats who drained most of her blood.
  - Red deer graze in the overgrown cemetery of a mountain church, bells tied to their antlers by children.
  - An elderly woman claims the albino stag ahead is a "spirit guide" and implores the adventuring company not to harm it.
  - A doe is a transformed woman, who was cursed by a fairy for comparing the woman's beauty to an elf's.
  - At night, a herd of red deer are engaged in a strange ritual around a dolmenstone. One by one, the deer bow to the stone and touch it with its antlers. Afterwards, the deer wander off.
- name: Deorling
  type: Creature
  description: Body of a red deer with dappled flanks; humanoid torso; small antlers (males only).
  habitat: [Light Forest, Dense Forest]
  habitat_notes: null
  watch: {dawn: 25%, morning: 25%, afternoon: 20%, dusk: 20%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - The deorlings are engaged in a spiritual ceremony, communing with the Wood Gods. They are led by Brethalia, a deorling dressed in sheer linen. She is ethereal and otherworldly.
  - The deorlings, Ghandre, Hourd and Lawilaa, are cooking a soup of mushrooms and fruits.
  - The deorling children are playing tag, dashing through streams. They are watched over by Lounella, a deorling matron. She is pragmatic and cautious, but friendly.
  - A group of deorlings is alarmed; they've formed a protective circle around their children, but are ready to dash away. If questioned, Clowehele will ask the company to depart in peace.
  - Two deorling stags, Boghan and Whaleg, are circling each other in an open glade, battling for dominance of the herd.
  - One deorling stag (Hundra) is showing a magic bronze longspear to the other (Howlire). They know the surrounding hexes well, and can warn of dangers if persuaded to be friendly.
  - Deorlings does are laughing by a stream, enjoying a moment of carefree fun while weaving chains of wildflowers. A single young stag, Mendre, is splashing in the water. Mendre will want to join the company, but must accompany the young deorlings back to the herd first.
  - Faenol, an elderly deorling doe, is gathering moss to weave into a cloak. She offers to make one for the adventuring company for a suitable payment. The cloak functions as a ghillie cloak and takes a week to manufacture. She can also teach herbalism to anyone who spends a season with her. She is a friend to witches.
- name: Devil-Goat
  type: Creature
  description: 7-foot long goat with black fur; three red glowing eyes; spiral horns. Harsh bleating.
  habitat: [Craggy Hills, Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: null
  watch: {dawn: 10%, morning: 20%, afternoon: 15%, dusk: 20%, early night: 20%, late night: 15%}
  season: All 100%
  sparks:
  - A devil-goat is ripping great chunks of flesh from the bloody corpse of an elk.
  - Devil-goats are chasing mosslings through the forest. The mosslings will flee from the adventuring company).
  - A devil-goat is staring down an iron bull.
  - This devil-goat can take the appearance of a normal goat. It is mixed in with a goatherd's flock of 20 goats. It will command the goats to attack the adventuring company.
  - A flayed man is strung up between trees. A devil-goat watches from the shadows. If challenged, it speaks in riddles.
  - The adventuring company comes across a devil-goat smashing drunic runes on a dolmenstone. A Drune (a protector of the stone), together with two dead devil-goats lie dead nearby.
  - A devil-goat is pulling down strings of garlic handing from an old oak tree. It chews them thoughtfully.
  - A devil-goat is chained and being led by a party of breggles (one longhorn, Sir Gusclan, and a group of shorthorns). The breggles are hunting notorious bandits.
- name: Displacer Cat
  type: Creature
