  habitat: [Rolling Hills, Craggy Hills, Mountains, Caverns]
  habitat_notes: Prefers shallow caves, ravines, or areas with thick vegetation.
  watch: {dawn: 20%, morning: 15%, afternoon: 15%, dusk: 20%, early night: 15%, late night: 15%}
