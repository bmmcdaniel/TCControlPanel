  - The hulking crayfish is molting an enormous shell.
  - The crayfish is eating a giant toadstool.
  - The crayfish has a bitemark gouged out of its carapace.
  - The crayfish is caught in a hill giant's trap.
  - A black, bubbling spoil in the middle of swampy water. As the adventuring company watches, a mutated hulking crawfish with red eyes and quills emerges.
- name: Crocodile
  type: Creature
  description: 12-foot long reptile with a long grinning mount full of teeth, thick green pebbly skin, short legs, and a powerful, laterally flattened tail.
  habitat: [Bogs, Swamps, Rivers]
  habitat_notes: Prefers slow-moving waters and riverbanks where it can bask.
  watch: {dawn: 20%, morning: 20%, afternoon: 15%, dusk: 20%, early night: 15%, late night: 10%}
  season: {Spring: 80%, Summer: 100%, Autumn: 60%, Winter: 0%}
  sparks:
  - Multiple crocodiles lie motionless on a riverbank, mouth open; they eye the adventuring company warily.
  - Two bull crocodiles compete over a sunning rock, bellowing and slapping their tails.
  - An enormous crocodile drags a deer carcass down a muddy slope into the water.
  - A crocodile nest contains a dozen leathery eggs; the mother floats nearby watching.
  - A black crocodile lurks beneath duckweed; only its nostrils break the surface.
  - A crocodile rushes from hiding in reeds, attempting to grab any mounts or dogs.
  - A massive, scarred crocodile visibly floats downriver, river birds perched on its back.
  - A crocodile corpse lies half‑eaten on the bank. Nearby are huge tracks of a wyvern.
  - A crocodile leaps suddenly from the water to snatch a giant heron from the shore.
- name: Crystal Ooze
  type: Creature
