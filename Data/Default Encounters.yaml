- name: Crayfish, Giant Golden
  type: Creature
  description: 4-foot long crayfish with golden glistening carapace; wicked pincers. Scuttling and clacking.
  habitat: [Rivers, Lakes]
  habitat_notes: Live in extended underwater burrows dug in the mud.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 20%, late night: 10%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 30%}
  sparks:
  - A foot-long hole in the wet mud, far from any water. A crayfish emerges.
  - A crayfish lies at the bottom of a pond, waiting for prey.
  - A crayfish holds its claws aloft in a threatening manner.
  - While the adventuring party is crossing a deep creek, an underwater crayfish grabs a player character by the leg, attempting to pull a character into deeper water.
  - Crayfish lurk in the reeds. They will ambush characters passing through.
  - In the middle of a clear pond is a visible stone or mithril figure (1 foot high). The pond is filled with giant crayfish.
  - A stream has a fishing weir made of wooden stakes and wattle fences. At one edge, a giant crayfish calmly picks out fish and eats them.
  - Three marsh-dwelling spear-fishers have stuck a giant crayfish.
  - During the night it rains and the adventuring company's campsite floods; as the adventuring company deals with it, two crayfish approach.
  - At a marsh-dweller's dance, crayfish emerge from a nearby bayou, swaying to the rhythm of the music.
- name: Crayfish, Hulking
  type: Creature
  description: 12-foot long crayfish with muddy brown carapace; huge threatening pincers. Scuttling and loud clacking.
  habitat: [Rivers, Lakes, Caverns]
  habitat_notes: null
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 20%, late night: 10%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 30%}
