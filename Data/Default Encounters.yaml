  - During the night, a lynx raids the campsite.
  - The lynx is scraping its claws on the bark of a tree.
  - A group of lynxes are relaxing in geothermal hot springs. If anyone approaches, they will growl in warning and bare their teeth, but will not fight to retain possession of the springs.
  - The adventuring company notices a lynx is following their trail. However, it will not approach closer than 100 feet.
  - A desperate and scrawny lynx leaps from the underbrush and makes a single attack at a member of the adventuring company, then will run off. The attacked person is exposed to mange.
  - The adventuring company encounters a trapper (Jesspo) with a pair of fine lynx skins. The trapper offers to sell them to the company for a good price.
  - At night, a person standing watch sees yellow, glowing eyes behind the tree line. A lynx observes, but will not interfere.
- name: Mammoth
  type: Creature
  description: 15-foot tall, 20-foot long mammoth; shaggy brown hair; sweeping tusks 10 feet long; prehensile trunk. Loud trumpeting.
  habitat: [Meadows, Bogs]
  habitat_notes: Icy tundra plains.
  watch: {dawn: 20%, morning: 30%, afternoon: 30%, dusk: 20%, early night: 0%, late night: 0%}
  season: {Spring: 50%, Summer: 10%, Autumn: 50%, Winter: 100%}
  sparks:
  - A herd of mammoths are migrating (north or south).
  - A lone mammoth is driven berserk by a parasite. It is trumpeting and going berserk.
  - A mammoth has fallen into a crevice and cannot get out. It is already weak and easy to kill.
  - A mammoth gestures to the adventuring company as if to follow him. The mammoth leads the company to a wounded human hunter.
- name: Mammoth, Miniature
  type: Creature
  description: 9-foot tall, 12-foot long elephant covered in loose green-brown hair; spiraling tusks 5 feet long; prehensile trunk. Loud trumpeting.
  habitat: [Meadows, Light Forest, Dense Forest]
  habitat_notes: Cooler climates.
  watch: {dawn: 20%, morning: 25%, afternoon: 20%, dusk: 25%, early night: 10%, late night: 0%}
  season: {Spring: 100%, Summer: 80%, Autumn: 100%, Winter: 100%}
  sparks:
  - A group of miniature mammoths are browsing fruit and leaves from a tree.
  - A miniature mammoth is stomping an already-deceased crocodile (or possibly a news).
  - The mammoth is idly smashing a tree to pieces.
  - The mammoth is eating gourds from some poor cottager's field.
  - At dusk, the miniature mammoth walks through the adventuring company's campsite, without acknowledging them at all.
  - A miniature mammoth has fallen into a crevice and cannot escape.
  - A herd of miniature mammoth is wading in a pond, browsing on duckweed.
  - The adventuring company spots a miniature mammoth with Drune runes carved into its living tusks.
  - A breggle hunter is skinning the hide of a miniature mammoth. He intends to present shaggy winter coats to his lord.
  - In a small herd, a rare albino mammoth browses in the underbrush.
  - A mammoth calf has been separated from hits herd. It lows mournfully.
  - At night, a terrible lightning storm. A mated pair of miniature mammoths, and their two calves enters the adventuring company's shelter, seeking protection from the rain.
  - The adventuring company comes across a small ravine, In the ravine, covered by vines are skeletons and tusks of dead miniature mammoths. 7 tusks can be recovered.
- name: Manticore
  type: Creature
  description: "8-foot long composite; man's head with triple row of sharp teeth and mane; red or tawny lion body; black bat wings; black scorpion tail. Deep, raspy voice."
  habitat: [Rolling Hills, Craggy Hills, Mountains, Ruins, Caverns]
  habitat_notes: Isolated badlands.
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The manticore lounges lazily at a pool of crystal clear water, gazing in admiration at itself.
  - The manticore is stalking a knight who is tracking the manticore.
  - The manticore has read a book of philosophy from its latest victim, and is eager to discuss it with the adventuring company.
  - The manticore challenges the adventuring company to a riddle contest; winner gets to eat the other. Of course, the manticore will fight the adventuring company even if it loses.
  - The manticore wishes to discuss the taste of non-human humanoids.
  - The manticore was cursed by a witch. Its mouth is sealed shut, and it can neither talk, bite nor eat. By expressions, it begs for help. If help is refused, the manticore will pounce in anger.
  - A manticore leaps from ambush. As it attacks, it tells the adventuring company how much it will enjoy eating them.
  - A manticore is eating a Drune cottager, when the adventuring company stumbles upon it. The manticore snarls and tells the company to back away. It will not abandon its meal.
  - A shallow cave serves as the manticore's lair. Decorating the path are human bones that serve as a warning.
  - A manticore is circling a herd of ibex goats, selecting its prey. If the company does nothing, it will dive and snatch a prime buck.
  - The manticore has recently eaten, so it is not hungry. However, it insists that the adventuring company talk with it. Its favorite topics are theology of the Holiest One (it doesn't understand how to reconcile an all-powerful god with opponents) and gossip from the Court of Brackenwold (he is particularly keen on hearing developments regarding the Duke's daughter, Persimone).
  - The adventuring company finds a curious, ruined wizard's tower made of white stone. It is the lair of Vardova the manticore (see standalone adventure Whitestone Tower).
- name: Medusa
  type: Creature
  description: Beautiful woman with serpents for hair; pale skin; hypnotic gaze; often wears dark hood or cloak. Soft hissing from writhing snakes.
  habitat: [Ruins, Caverns, Dungeons]
  habitat_notes: Primarily, uninhabited ruins and isolated places far from society. Occasionally, hidden in settlements.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 70%}
  sparks:
  - In a dark cavern, a medusa lurks, savoring her resentments.
  - A hooded figure tends a garden of stone statues - victims frozen in various poses of terror.
  - The adventuring company hears soft weeping from within a ruin. A medusa mourns her cursed existence.
  - A medusa's lair is littered with polished mirrors, all turned to face the walls. The medusa is mentally unbalanced.
  - The adventuring company notices a heavily cloaked woman acting oddly. If followed, she proceeds to a hidden, underground den.
  - The adventuring company finds fresh offerings of food and money left at the entrance to a ruin - locals placating the medusa within.
- name: Men, Adventuring Party
  type: Creature
  description: Group of armed and equipped adventurers; varied clothing and armor; weapons and gear. Conversational speech, sometimes wary.
  habitat: [Meadows, Farmland, Rolling Hills, Craggy Hills, Light Forest, Dense Forest, Roads, Settlements, Ruins, Caverns, Dungeons]
  habitat_notes: Traveling or questing.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The adventurers include a powerful priest (Alfric) and a knight (Sir Boetha). They are attempting to locate a lost shrine and report to the Bishop of Brackenwold (e.g. St Sedge in 0202, St Hamfast in 0309, St Cornice in 1505).
  - A priest (Swithun) and his companions are secretly carrying a holy symbol and book to Abbot Nedwyne Hargle in Castle Branckenwold.
  - As part of his divine penance, a knight (Sir Ulbricht) and his companions have sworn to destroy the Descendant in hex 1409 (or alternatively, the spectres in 0701 or the gloam in 0906).
  - A group of mixed martial scouts and skirmishers are scouting the movements of crookhorn troops to report to the Duke (e.g. around Fort Vulgar in 0604, the ruined abbey in 0906, Prigwort in 1106). Their leader is Ruchard the Cunning.
  - The adventurers (Halford, Ingborn, Barnabas, Gildren, Werrick, Gilda, and Reymoor) are on a mission to capture a Chaotic person and bring them to Castle Brackenwold (e.g. Praephator Lenore in 0111, Captain Snarkscorn in 0803, Shub's Nanna in 0911).
  - A pair of priests (Aubrey and Waylon), and their companions, are attempting to locate the lost relics of St Jorrael, rumored to have been buried in hex 1705 in Mulchgrove. The adventurers do not have a map. The priests intend to use this for readmission to the Church.
  - The adventurers (Swithun, Aldrid, Tace, Kurpi Copper-Beard, Cymry) are searching for magical herbs/fungi (e.g. Grinning Jenny in 0908, Horridwort in 1002, Purple Nightcap in 0510).
  - The adventurers, including a changeling wizard (Quarn) and a minstrel (Flaxen), with their retainers, are trying to find a fairy door (e.g. The emerald door in 0602, the moggle door in 0711, the dungle-crack in 1402).
  - The adventurers (Noll, Gweneth, Colwick, Talbot, Thatcher) are attempting to loot a fabulous treasure hoard (e.g. The bicorne's hoard in 0510, the Big Chook's hoard in 0606, the wyrm's hoard in 1107).
  - A wizard (Ziggi) has charged the group of adventurers (the apprentice wizard Quentin, and Digory, Bramble, Wren, Lurie, Berridge), to spy on the arcane doings of another wizard (e.g. Mostlemyre Drouge in 1106, Tamrin Tweede in 1110, Ygraine in 1802).
  - One of the adventurers (Winton) has been cursed by a powerful fey. The whole party (Yarborough, Digby, Sedgwick, Codding) are looking to cure the curse (e.g. By bathing in the Lethean Well in 0209, at the hill in 0805, by visiting the Hag in 0908).
  - The adventurers (Rivers-Running the elf, Merriweather, Beecham, Blythe, Tallow) are secretly carry a magic item to the Drune (e.g. A Crystal Ball, a Mirror of Life Trapping, a Ring of Protection).
  - The adventurers (Purple Ray, Fairborn, Cwyden the breggle, Kettering) are agents of the Naglord. They intend to scout the movements of human troops and report to Atanuwë (e.g. around Fort Vulgar in 0604, Prigwort in 1106, Castle Brackenwold in 1508).
  - The adventurers (Marden, Curwen, Dayle, Maenrith) are bandits. They rob any weaker looking groups they encounter.
  - The adventurers (Balgrim, Bredhr the breggle, Ljot, Eena the goblin) are looking to assassinate or kidnap a Lawful NPC (e.g. Sir Osric Hazelmire from Fort Vulgar in 0604, Lady Harrowmoor from Harrowmoor Keep in 1105, Abbot Spatulard from the Refuge of St Keye in 1307).
  - The adventurers (Mayflower, Snorri, dwarf Telpa Toss-Axe, and the cleric Mathonwy) have stolen the remains of a saint and are secretly carrying it to Atanuwë.
  - The adventurers (Jorund, Hogseal the goblin, Alethea, Bickle, Pucy) intend to steal a precious item from an NPC (e.g. The Rod of the Wyrd from Nodding Castle in 0210, the magic mirror from Chateau Shantywood in 1110, the Mornblade from Ferneddbole House in 1209).
  - The adventurers (Willet the Judge, the elf Eagle-Cries-in-Sky, the halfling Jerry, Odragh) have gathered ingredients for poisons (e.g. Angel's Lament, Purple Nightcap) and will sell them to a paying client (e.g. Wyrmspittle the herbalist from Prigwort in 1106, Madame Shantywood from Chateau Shantywood in 1110).
  - The adventurers (Basil, Clement, mossling Lobumber, Deregba) bought a treasure map in Castle Brackenwold. They've traveled to the area on the map but landmarks don't match and they are beginning to suspect the map is a fake.
  - The adventurers (dwarf Snorza Two-Axe, Hestith, Ormsby, halfling Heatherwick, Rud the Grin) are planning to slay and feast on nearby aurochs. If the adventuring company will join, they may feast also.
  - The adventurers (dwarf Vartu Blue-Cheek, Tristan, Gidney, Lamford, Wixon) are seeking abandoned Castle Xyntillian. They have heard it has plunder. Gidney is secretly a werewolf.
  - The adventurers (elf Blush-of-the-Pale-Rose, Henley, Quorleigh, Orling, halfling Cottrell) have the same goal as the player characters! If they discover this, the adventurers will "leave early" to get the jump on the player characters.
  - Weary explorers (Coldham, Blithe, Modlof, Bertain, Faxis) are resting by a fire. They set out to loot barrows, but have lost two members and all are exhausted and tired. They are ready to give up adventuring.
  - A group of adventurers (Silarri, Hans, Dougan, breggle Berrild, breggle Droop) are trying to create a more accurate map of Dolmenwood for Baron Hogwarsh. They are willing to exchange notes with the player characters, but will never reveal more (measured in hexes) than they receive.
  - In exchange for a reward, the adventurers (Ashes, breggle Shador, Oblith, Claydon, Halcroft) are tracking a manticore which has slain several townsfolk. The adventurers will accept help, but will not share the reward.
  - Thirligrewe Hangman (hex 1309) is taking some rare time away from her orchard to travel to High Hankle in search of horticultural information without alerting the Duke.
  - A pair of adventurers. A veteran named Boran and a halfling burglar named Vespian were hired by Bagsley Corundum to search for Simeone Waylord of High-Hankle (see page 35 of DCB). The adventurers (correctly) believe he is in hex 0712 where Bharhgda, the black bile wyrm allowed him passage to the cellar. If the adventuring company joins, they will split the modest reward. If the adventuring company declines, Boran and Vespian can later be found frozen similar to Simeone himself.
  - Adventurers (Koster the Red, Daybreak Dayle, Lesos, mossling Menolo) are escorting a foolish, young noblewoman to a dolmenstone, where she plans to invoke fairies to "take her aware from all this."
  - Adventurers (goblin Tweek, Phiona, Greyburn, Haddock) are travelling to the Incandescent Grottoes (hex 1207).
  - Rival adventurers (Falstaff, Egber, Westbrook, Lang the Flash, halfling Dighton) have the same goal as the adventuring company. The company may choose to compete or cooperate.
- name: Men, Bandit
  type: Creature
  description: Rough-looking men in worn clothing; armed with spears, knives, and shortbows. Threatening or demanding speech.
  habitat: [Craggy Hills, Light Forest, Dense Forest, Roads]
  habitat_notes: null
  watch: {dawn: 15%, morning: 30%, afternoon: 30%, dusk: 20%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The path forward is blocked with bushes. From behind, bandits armed with shortbows step onto the path and demand payment. If the company resists, the bandits apologize and back down quickly. Their leader Blackbrook speaks in a low, raspy voice.
  - Bandits waylay the adventuring company. "Surrender your valuables or lose your life." The bandits are led by Young Wickett.
  - Bandits (led by Nerritt and Lumm) are shaking down a group of pilgrims. When the adventuring company arrives, the pilgrim's eyes plead for help.
  - These bandits (the Boys of Repute) only rob from the rich and give to the poor. However, the adventuring company is relatively rich….
  - Unnamed bandits are preparing an ambush by dragging a log over a road.
  - The bandits are pretending to be victims. They have hidden their weapons, spread blood around and a few lying on the ground pretending to be dead. When the adventuring company has let down their guard, the bandits will spring to action.
  - These bandits are all women archers. They have a wicked gleam in the eye, and are led by Cora the Bold.
  - The bandits are ragtag group of starving peasants. They apologetically demand all the adventuring company's food, but insist they won't take anything else. Among them are Tregg, Flint and Gorsley.
  - Bandits have taken over a ferry. When the ferry reaches mid-river, the bandits will drown travelers. Their leader is Clagburn.
  - These bandits, all armed with quarterstaffs, are disguised as ordinary travelers, and they aren't looking for trouble. They are going to town for resupply. They are led by Poaster.
  - The bandit captain Gorba attempts to sell the adventuring company a treasure map. He has a couple of lieutenants with him. His attitude is "game recognizes game."
  - Mixed group of goblins (Vick, Tweeze, Minger, Zilch, Fluck) and human (Tyson, Mulden, Charn, Coyle, Ringo) bandits. The humans hold weapons while the goblins paw through the adventuring company's goods.
  - A suspiciously well-armed and large group of woodcutters offer to sell firewood and wine to the adventuring company. In reality, they are sizing up potential victims. They are led by Wilker.
  - From a distance, smoke rises in the woods. If investigated, bandits are relaxing while deer are being roasted over spits. The bandit's leader is Gilbert, a human noble, who gave up the stress of court life for a life in the wilds.
  - Big Yon, a centaur-turned bandit who serves Red Gwen (hex 0311), together with a half-dozen level 2 archers. If the adventuring company is 1st level, they will be stripped of all valuable and escorted to the nearest town. If more powerful, the adventuring company will not be molested, but may be offered an alliance with Red Gwen.
- name: Men, Beggar
  type: Creature
  description: Ragged person in tattered clothing; often dirty or injured appearance; walking stick or staff. Pleading or humble speech.
  habitat: [Farmland, Rolling Hills, Light Forest, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - In the tithelands, a beggar (Batho) by the side of the road. He says that, for a coin, he will tell the fortune of a person. If indulged, he asks the person to spit in the dirt, in which case the beggar will spend a minute examining it before pronouncing the future. 90% chance the fortune is worthless. No more than one person per party.
  - A pitiful beggar (Frica) asks for a coin. The beggar is secretly the fey lord Lord Gladhand (see pg 34 DCB). If given silver, the beggar will drop it and exclaim in pain. If given other coins or valuables, Lord Gladhand will appear later to the party in his true form and invite them to spend the evening in Shandycoiffe Manor. A month will pass.
  - A mute leper, Gunter, scarred by the wasting disease, sits at roadside, with a clay begging bowl. Anyone who touches the beggar is exposed to wasting disease.
  - A desperate, distressed family (Ether, Griya, Flora, Josper, Mik) begs. Their crops failed, and they've turned to begging.
  - A wounded veteran (Grinter) has lost his right arm. If asked, he explains that he lost his arm fighting giants in the table downs. He knows a lot about giants, and is willing to discuss if the company will buy him beer.
  - A blind beggar (Winchell) sits by the roadside. His eyes are blank white. Perched on his shoulder is a large, protective raven. The beggar will not react to passerby's.
  - An elderly beggar (Hancor) wanders the road. He is quiet and introspective, but will thank the adventuring company for any assistance. The beggar is blessed by the wood gods, and intentionally harming him requires a DC 20 Heart check.
  - A shorthorn breggle (Scadwhist) plays a flute for alms. He fled his cruel longhorn lord.
  - A beggar (Arnol) mumbles prophecies about the Nag Lord's impending dominium. The beggar's madness is actually linked to the Nag-lord, and those listening to him may pick up a clear about the Nag Lord's present whereabouts and plans.
- name: Men, Churchman
  type: Creature
  description: Person in religious robes or simple devotional clothing; may carry holy symbols, books, or staff. Pious or solemn speech.
  habitat: [Farmland, Rolling Hills, Light Forest, Roads, Settlements, Ruins]
  habitat_notes: Traveling between settlements and holy sites.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Lost pilgrims (Arno, Ardur, Feder, Miles, Nisa) were searching for a nearby lost shrine, but cannot find it. The pilgrims are all laypersons.
  - Men (Arthwit, Ponch, Elsper, Wenlen, Darrow) from the Tithelands are traveling to the monastery, the refuge of Saint Keye. They plan to join the monastery.
  - A small group of wandering mendicants are dunk; they sing bawdy songs. Theya re led by Trogel.
  - A zealous priest (Sedge) with guards escorts a chained young woman (Babette) accused of witchcraft. She pleads for help or mercy.
  - Pilgrims (Wilkar, Edric, Kestrel, Morgan, Tamir) have a clue to the correct location of a lost shrine and are searching for it.
  - A hermit (Dewglid) has made his home here in a hollow tree, emulating Saint Xavier. The birds and beasts of the forest bring him food and news.
  - Brother Ronald, a knight champion of the Church has sworn an oath to find a unicorn.
  - Church administrators (Xanthus, Hatcher, Baldwyn) are traveling to Three Martyrs Minster in High-Hankle. News has reached Church legates that there may be heresy in the district.
  - Brother Gavin, a Church inquisitor, is searching for information about witches. He charges any true believers to honestly recount their dealings with witchcraft.
  - Brother Alfric, an exorcist, is hurrying to Fort Vulgar. Father Drabe has sent for an exorcist, since a villager has been possessed by a wendigo.
  - In the summer, a group of militant churchmen headed by Brother Alfric, an exorcist, is hurrying to Fort Vulgar. Father Drabe has sent for an exorcist, since a villager has been possessed by a wendigo.
  - A lone priest (Godwin) kneels by the road, blessing all who pass. This is his penitence for overeating.
  - A monk (Dory) is making the rounds of his beehives, gathering honey for the monastery.
  - A single cleric (Owain) is traveling in the forest, his mount covered by dozens of tiny, silver bells. He explains that the bells keep away fey and evil spirits.
  - Brother Markus of the order of Saint Signis is tracking thieves who stole a reliquary of Saint Signis from the Silent Tower (pg 153) in High-Hankle (hex 0512). If the adventuring company appears rough, he may suspect them. He will believe anyone who swears by the Church or the Saints.
  - Brother Dyed, a powerful exorcist from Castle Brackenwold, is seeking the source of shadow demons that have possessed travelers along the Horse-Eye road. He will carefully question the adventuring company.
- name: Men, Cultists
  type: Creature
  description: Ordinary-looking people; often wear chaos amulets hidden under clothing; furtive demeanor; may bear ritual scars or brands. Whispered conversations.
  habitat: [Settlements, Ruins, Caverns, Dungeons]
  habitat_notes: Hidden in society or meeting in secret places.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: All 100%
  sparks:
  - The cultists are enacting a ritual to summon an evil spirit.
  - The cultists are providing instruction in their beliefs.
  - The cultists are mortifying their bodies.
  - A cult leader is preaching that those who embrace chaos will be fortunate- the chaos lords will mercifully kill the cultists first when the end times come.
  - The cultists belong to a ghoul cult. They are meeting with cult-members who are "too far along" to appear to the public.
  - Hooded cultists gather in a circle around a dark altar, chanting in an unknown tongue.
  - The adventuring company notices villagers slipping away one by one into the woods at midnight, heading toward a hidden meeting place.
- name: Men, Drune Audrune
  type: Creature
  description: Drune man in ritual garb; carries a staff topped with pulsing amethyst crystal and an otherworldly blade. Authoritative demeanor.
  habitat: [Dense Forest, Thorny Forest]
  habitat_notes: Areas near ley lines and dolmenstones.
  watch: {dawn: 15%, morning: 15%, afternoon: 20%, dusk: 25%, early night: 15%, late night: 10%}
  season: All 100%
  sparks:
  - The audrune (see pg 53 of DCB) steps suddenly from a purple dimension door, fleeing babbling shadow demons. A few manage to make it through with him. Unless the adventuring company interferes, he will blast those few.
  - The audrune (see pg 53 of DCB) is divining the course of a lesser ley line. The audrune is using a staff topped with an amethyst that allows the audrune to detect magic at will, and aids analysis of magic auras.
  - The audrune (see pg 53 of DCB) is gazing into a pool of water in a hollow tree stump, conversing in Faerie with a shimmering nack. The audrune is negotiating for aid in locating "the dreaming wyrm" in Lake Longmere.
  - The audrune (see pg 53 of DB) is conducting solemn council with a gathering of Drune cottagers. The Drunes discuss (in Drunic) their brotherhood's imminent plans to attack the Court of the Nag-Lord (hex 0904). If the adventuring company approaches, the Drune will rebuff the company, and suggest they assault the Nag-Lord on their own.
- name: Men, Drune Braithmaid
  type: Creature
  description: Young Drune woman in long cloak; carries silver knife and wears flower necklaces. Often singing softly.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: null
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The braithmaid (Ambe) is in the company of a witch (Freyda), gazing trance-like into an inky-black mirror, being tested for initiation into the witch's coven.
  - The braithmaid (Lestwyth) digs in the earth, using a silver knife to root out mandrakes (either Groaning Mandrakes, Knobbled Mandrakes, or Prancing Mandrakes).
  - The braithmaid (Rhiannell) flees a wrathful Drune cottager with a local (non-Drune) beau.
  - The braithmaid (Mayerwill) weaves a necklace of maegthe flowers.
  - The braithmaid (Ffaelwyn) is singing to a dolmenstone, which accompanies her singing in a low, deep voice.
  - A half-dozen braithmaids (Mirren, Sian, Lagwynne, Ygritte, Athenell, Gaemythe) wearing long cloaks, are moving silently through the forest in a single-file line. Their magic makes them difficult observe (DC 15 Luck check each round past the first).
  - A lone braithmaid (Becanyr) weeps forlornly at the foot of a tree. She is mourning because of lost love with a cruel elf dandy.
  - A trio of braithmaids (Rhynamath, Cordwyn, Iedydd) are constructing leaf-boats to set out on a pond. They believe these boats carry their hopes and dreams. They invite female members of the adventuring company to do the same.
- name: Men, Drune Cottager
  type: Creature
  description: Bearded Drune man carrying a wooden staff; heavy cloak. Watchful, territorial presence.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: Near their forest cottages and sacred groves.
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The cottager (Oeddinger) commands a trio of charmed villagers (Hatherd, Lucan, Renwick) who drag a 10-foot high wicker cage on a cart.
  - The cottager (Brenagh) is instructing a pair of brambling spirits to protect a rune-etched stone in a glade. The stone bears encoded directions to an emerging ley line.
  - Morgodh the cottager sits on a boulder, deep in contemplation, surrounded by spiraling ravens. The ravens' cawing is vaguely coherent, as if the cacophony conceals words.
  - A pair of cottagers (Aledwyn, Hermanach, Forroth) and their brambling minions are battling with a knight (Sir Radley) and men-at-arms (Halwen, Lancel and Ector) in the service of the duke. The cottagers are charged with kidnapping locals for use in dark rituals and are attempting to flee.
  - A Drune (Fhaygral) is carefully planting a yggnut tree as part of an arcane ritual to preserve wards. He is not hostile but refuses to answer questions.
  - A trio of Drune cottagers (Waryll, Morffeth, Hanith) is sacrificing an elk over an ancient stone, in a grotesque ritual to power some arcane magic. If interrupted, they will be furious, give a single warning then attack.
  - A Drune (Jhyrrion) is examining a mangled bramble golem. The Drune is concerned about caused the damage.
  - The Drune cottager (Myethanoch) is pleased to see the party. He invites them into his cottage. He explains he must stay where he is to satisfy his (unnamed) responsibilities. However, he needs the adventuring company to deliver a rune-carved resinwood box to the audrune Aethogrymat at the Golokstone (0910). The box is wrapped in leather bands tied with fiendishly difficult knots, treated as a rank 4 arcane lock. The cottager warns the adventuring company that they must not, under any circumstances, open the box. Trapped within the box is a demon that will possess any character opening the box.
- name: Men, Drune Drunewife
  type: Creature
  description: Drune woman in practical garb; may carry baskets, herbs or household tools. Often humming or singing.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: Near Drune cottages and forest gardens.
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The Drunewife (Hestitha) quietly sings while molding human limbs from brightly colored clay scooped out of a small pool.
  - The Drunewife (Laengyrr) is gathering amberberries from a bush.
  - The Drunewife (Carysyn) directs a brambling to load a cart with firewood.
  - The Drunewife (Erededra) is accompanies by 3 Braithmaids (Isinrith, Nydael, Tegdith). She is presenting them to a trio of Limwdd witches (Olga, Katlyn, Orleana), discussing dates for one of the girls to be brought before "the manifestation of Limwdd."
  - The Drunewife (Bronweir) is watching over her young children (Fiorich, Rhedynne, Drysainna) playing at the feet of a 6-foot tall wicker man.
  - The Drunewife (Cuthrael) directing her kiln golems to gather smooth river stones.
  - The Drunewife (Gellith) is using magic to encourage the growth of gourds in her forest garden.
  - A Drunewife (Sigwenna) is whispering secrets to the bees of her hive.
  - A Drunewife (Leiredra) is shaping a new kiln golem out of raw clay.
- name: Men, Drune Wandering
  type: Creature
  description: Young Drune man with staff and travel gear. Intent, studious demeanor.
  habitat: [Rolling Hills, Craggy Hills, Light Forest, Dense Forest, Thorny Forest, Fungal Forest, Ruins]
  habitat_notes: Wandering throughout Dolmenwood.
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - The Drune wanderer (Hestgorr) is copying ancient sigils off of a dolmen.
  - The Drune wanderer (Oelmothha) is examining the body of a woodland creature corrupted by chaos.
  - A mute Drune wanderer (Ydrochin) meditates on a boulder. Creatures must succeed on a DC 14 Heart saving check to approach him.
  - A Drune wanderer (Murgdric) and an elf (Poetry-under-Vaulted-Roofs) eye each other with hostility from opposite sides of a glade.
  - A wanderer (Eldroch) sits outside a barrow. The Drune is seeking a specific magic artifact within, and will solicit help from the adventuring company, offering knowledge of Dolmenwood (in addition to other loot from within the barrow).
  - A Drune wanderer (Paeldrich) is practicing his magic. He whispers to an arrow, then throws it into the air, where is speeds with unnatural speed to a mark in a tree. Several rune-covered arrows are already stuck in the tree.
- name: Men, Fighter
  type: Creature
  description: Warrior in armor with arms and armor. Professional, martial bearing.
  habitat: [Meadows, Farmland, Rolling Hills, Craggy Hills, Light Forest, Dense Forest, Roads, Settlements, Ruins, Dungeons]
  habitat_notes: null
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A veteran fighter (Dagmar) is looking for recruits to start a new mercenary company.
  - A champion archer (Norric) is traveling to High Hankle to participate in an archery contest.
  - Ogier is a monster hunter. His face is heavily scarred with talon scratches. If asked, he boasts that the scars come from a dragon he slew. He is equipped with heavy armor, a greatshield, a fancy sword and a pair of swords. He is accompanied by his spear-bearer. Ogier hunts for a king basilisk.
  - A monster hunter (Thurwen) from distant lands has come to Dolmenwood to take a king basilisk as a trophy.
  - A grizzled fighter (Lethold) is heading to Redwraith Manor. He has heard that fighters can make good money there, and don't need to be of high birth. He has a low opinion of knights.
- name: Men, Fisher
  type: Creature
  description: Commoner in simple clothes with fishing gear; both man and gear are weathered from outdoor work.
  habitat: [Farmland, Bogs, Rivers, Lakes, Roads, Settlements]
  habitat_notes: Near fishing villages and waterways.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A fisherman (Huel) asks for help. His young boy (Galric) was carried off by a giant dragonfly.
  - A fisherman (Samwoll) is under a kelpie's charm and asks the adventuring company to accompany him on his boat to the middle of the stream, where the kelpie (Lucilla) will overturn the boat and attempt to drown the adventuring company.
  - A grim fisherman (Marden) with bloodshot eyes pulls an enormous trout using a wicked, barbed fishing pole. A hag has cursed the fisherman, requiring him to catch a dozen fish every day, or be turned into a fish himself. He begs for help.
  - A group of fishermen (Perrin, Emory, Joffer, Herne) are celebrating an enormous haul of purple eels; the eels are especially tasty, but a mild soporific. They invite the adventuring company to sample a cooked eel.
  - A pair of fishermen (Swithun, Hamric) are standing at the edge of a river, discussing how to catch a giant sturgeon. If the adventuring company can help, they will give half the harvest of roe.
  - A pair of fishermen (Renwik, Odell) offer to sell the adventuring company the location of a magic giant carp.
  - A trio of fishermen (Hallow, Hogrid, Beacham) are casting their nets, unaware that a boggin is sneaking up on them.
  - A fisherwoman (Fridswyn) is hauling an enormous sack of fish. She is, in fact, a witch that charms the fish to come to her.
  - At night, across the bogs, the adventuring company sees bobbing lights, like a will-o-wisp. If they investigate, it is a Herne, a fisher.
- name: Men, Herbalist
  type: Creature
  description: Person in practical clothing carrying baskets, pouches, and herbs. Knowledgeable, cautious demeanor.
  habitat: [Meadows, Farmland, Light Forest, Dense Forest, Bogs, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 15%, morning: 35%, afternoon: 35%, dusk: 15%, early night: 0%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 20%}
  sparks:
  - The adventuring company hears squeals and screams. A lone herbalist (Annora) is pulling mandrake roots from a samp spot in the woods. She is unhappy that the adventuring company has found her secret spot, but will offer a few mandrake roots if they agree to preserve her secret.
  - The adventuring company meets an eccentric, vegetarian herbalist (Everad) from a nearby town. He asks for escort to a distant location to collect herbs. The herbalist speaks only in whispers, and fears fire. However, if the company escorts her, he will agree to teach herbalism to interested characters.
  - An elderly herbalist (Brucca) explains she needs to harvest potent bark from a nearby willow tree. She asks the adventuring company to accompany her and protect her from an aggressive giant crayfish.
  - Agnes, an herbalist bedecked in Maegthe flowers invites the adventuring company to yarrow tea. She explains the Maegthe flowers protect her from spirits.
  - A mossling herbalist (Embodwil) is zonked out of his head on Hogscap. If the adventuring company approaches, he being babbling prophecies, and in particular warns a player character of approaching death.
  - A pair of herbalists (Corin, Madoc) from Prigwort are desperately searching for gillywort. A batch of ale has been poisoned, and they need the gillywort to determine if any others are also bad.
  - A goblin herbalist (Tobber) is collecting a stinky black mushroom from rotten wood. He insists that it is key ingredient in stealth potions, but anyone trained in herbalism knows this is ridiculous; it is a mild hallucinogen that induces sickness.
  - In the woods, an herbalist (Millicent) is tending to a wild rose bush.
  - In the table downs, a halfling (Rolfe) is searching for wild pipeleaf.
- name: Men, Herder
  type: Creature
  description: Commoner with staff or crook; rough clothing; accompanied by livestock and dogs.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Roads, Settlements]
  habitat_notes: Grazing lands and routes to market.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 20%}
  sparks:
  - Feder and Gillium, swineherds with 40 pigs, herd the pigs deep into a forest to eat the most robust acorns. They typically will stay out 3-4 days before returning home.
  - Bregon the Sweet, a shepherd with a flock of 30 sheep and dogs Dolph (a mastiff) and Lady Izzy (a herding dog). Bregon is a master with a sling. He prefers open land, and is not willing to incur risks. Bregon sings while his sheep graze, believing that it calms the sheep.
  - Arthur and Bregwin, shepherds with a flock of 100 sheep and a half dozen herding dogs and a pair of 3 mastiffs. Both Arthur and Brewgin are armed with shortbows. The sheep are skittish; Arthur suspects a wolf or other monster lurking nearby.
  - A swineherd (Duchanon) from the high wold (hex 0811 or other) drives his pigs to market at High Hankle.
  - The adventuring company finds a slaughtered shepherd with a dozen sheep (the rest fled). They are victims of a werewolf that lives nearby.
  - In the table downs, Llian, and his flock of 30 goats relax. Llian plays a flute and has a working dog to assist.
  - In the northern scratch, Chelly, a shepherd under leadership of Aegnyth Cormick (hex 0105). Chelly has 50 sheep and 3 working dogs. Chelly is testing different areas of the northern scratch hoping to escape the predatory griffons.
  - In the western tithelands, near the forest, Chester and Finnigan, shepherds from hex 1310 watching over 60 sheep, assisted by a pair of mastiffs and fearful of wolves (see hex 1311). They encourage the adventuring company to visit Granny Wolfsbane (hex 1310).
  - Snibbler, a goblin swineherd, keeps pigs. They feast on forest underbrush and sleep in a nearby cavern. The goblin paints them in garish runes "to protect from monsters." Snibbler will attempt to sell pigs to the adventuring company.
- name: Men, Hermit
  type: Creature
  description: Solitary figure in worn, simple robes or rough clothing; unkempt beard and hair. May be contemplative, grouchy, or mad.
  habitat: [Craggy Hills, Light Forest, Dense Forest, Caverns]
  habitat_notes: Remote locations far from settlements.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: All 100%
  sparks:
  - Malachi, a former priest has renounced the world and moved into a cave in the woods. The adventuring company finds him, toiling in the woods raising a garden.
  - Bezo, a misanthropic hermit has left civilization for the wilderness. He is grouchy and difficult, but knows the surrounding area well and can give good guidance. He will ask the adventuring company to share food, since he does miss "real" food from civilization.
  - A quiet hermit is in tune with the universe, but has forgotten his own name. He hums to himself quietly.
  - A mad hermit (Hrut) mutters wild prophecies about "chaos creatures creeping through the woods" and "hairy worms crawling forth from the ground."
  - A hermit (Verin) has achieved enlightenment and speaks only in paradoxes. It seems he is in tune with the universe, and virtually nothing actually harms him. 
- name: Men, Hunter
  type: Creature
  description: Person in practical hunting garb; hunting weapons. Alert bearing.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Dense Forest, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A hunter, Firth, accompanied by a pair of hounds (Doby and Yoby), has a slain red deer slung across his shoulders.
  - Jasper, a falconmaster, is hunting rabbits with a falcon. He offers to sell rabbitskins, rabbit meat, or even teach falconry to the adventuring company.
  - A hunter (Lakey) has been commissioned to return with a stuffed wolperdingle.
  - A half-dozen hunters (led by Firith) are carrying a huge razorback boar on their spears. They plan to offer the boar to a local lord, but hint that feasting on the boar is good for the adventuring company, and hint of payment. Feasting on the giant boar is useful (see Torchcrawl feasting rules). One of the hunters (Grigor) is also a master cook, and the boar will be served with mushrooms and delectable herbs.
  - A hunter (Emory) scours the wood for a rumored albino elk stag, and asks if the adventuring company has heard of it.
  - A hunter (Orfax) wearing a ghillie cloak emerges from the underbrush. He is a grim, silent fellow but offers to travel with the adventuring company for a day. He may challenge a member of the adventuring company to an archery competition, gifting them a quiver of fine arrows if bested, but demanding a service if he wins.
  - The adventuring company finds a young, lost hunter (Fabian) separated from his group. The hunter is shivering and hungry. He claims he fled when a wendigo demon possessed one of their members and slew the rest.
  - A solitary master hunter (Roderic) chastises the adventuring company for bumbling through the woods. He says the adventuring company will die if they lack all woodcraft. The hunter offers to hire out for an exorbitant fee of half the treasure collected. Roderic's gear is festooned with trophies of the many different animals he's hunted; he explains that each gives him a small bonus to hunt that particular species (+2 on applicable d20 checks).
  - A pair of hunters (Lambert and Joremey) asks for help. They are tracking a brown bear that has been preying on local livestock, but doubt their ability to overcome the bear.
  - A hunter (Ruchard) is wearing a cloak made of many different animal skins. He was cursed by the Hag to never feel peace until he has a cloak with the skin of every type of beast living in Dolmenwood.
  - The hunter (Salver) has a pet viper (Lior), which obeys his whistles. The hunter is presently talking to his snake, petting it with care.
- name: Men, Knight
  type: Creature
  description: Armored warrior on horseback with heraldic surcoat; carries lance, sword, and shield. Noble, martial bearing.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Roads, Settlements, Ruins]
  habitat_notes: On quests or duty.
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: All 100%
  sparks:
  - Sir Amis, accompanied by his hunting master, are pursuing a questing-beast. They have been on the quest for a decade. (See pg 58 of Vale of Flowers).
  - Sir Morris has vowed to challenge all comers to joust at a river crossing (or crossroad).
  - A column of knights in the Duke's livery and led by Sir Haewise. They are delivering a formal demand to Baron Hogwarsh to pay taxes due.
  - Sir Palomides, a longhorn knight and his retinue of shorthorns are scouring the countryside for bandits.
  - House Harrowmoor knights are practicing for war with blunt weapons.
  - Sir Wistan is giving instruction to his squire, Poog, about knightly virtues.
  - Sir Dieter, the knight with two swords, is seeking vengeance against the witches who "stole" his daughter.
  - An elderly knight (Sir Reobold) kneels at a mossy cairn. His son is buried here, where, years ago, he fell in battle with an iron bull.
  - A knight (Sir Uiwine), mounted on a pig and wielding a broomstick, challenges you to joust. His strange behavior is the result of a curse from the witch Grwith (hex 0608) for killing a king basilisk.
  - A longhorn knight (Sir Pusarch) from Lord Malbleat's retinue is searching for a shorthorn treasurer who absconded with a sizable amount of gold. The knight is arrogant and presumptuous, treating shorthorns especially poorly. "It's a matter of high justice."
  - A mounted knight (Sir Merrin) with a travois, on which is located a body. The knight is transporting a fellow-knight (Sir Bevoir) who died of old age back to his hometown of Prigwort, for an appropriate burial.
  - On a river, a funeral barge floats by. Atop a bier on the barge, is a dead knight in silvered armor, surrounded by white lilies.
  - Sir Varen is on a quest to prove his valor by single combat with followers of Atanuwë.
  - Sir Armanac is questing for the shrine of St. Gripe the forthright (hex 1805). Sir Armanac is good-natured, religious and has a strong sense of his own destiny. He is aware that it is north of King's Highway and near the eastern edge of Dolmenwood. If the adventuring company includes a cleric, he will gladly travel with the adventuring company if they agree to join his quest; he won't trust any adventuring company that doesn't include a cleric.
- name: Men, Lost Soul
  type: Creature
  description: Disheveled person with haunted, confused, or vacant expression; clothing tattered or out of place. Lost, disconnected demeanor.
  habitat: [Meadows, Rolling Hills, Craggy Hills, Light Forest, Dense Forest, Thorny Forest, Ruins]
  habitat_notes: null
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: All 100%
  sparks:
  - This merchant (Orrick) sincerely believes he escaped from the realm of the dead. Who knows whether this is true.
  - This young man (Haldeman) was swapped for a changeling when a mere baby. He was recently discharged from faerie for being "too human." Now, he is wandering Dolmenwood. If his original family can be found, he will have to deal with the changeling who assumed his identity.
  - This poor villager (Ashley) is lost in the wilds, starving and ragged.
  - A feral child (unnamed), raised by wolves. It cannot speak any human language, but has a bond with animals.
  - This hunter (Eirwen) slept undisturbed for 77 years, and only recently awoke.
  - An adventurer (Filton), has been wandering in faerie for 50-250 years.
  - This (unnamed) man's mind was wiped clean when ley lines discharged energy. Now he hums a haunting, repetitive melody.
  - This woodcutter (Cobb) stumbled across secrets of the wood gods, drove him mad. Now he wanders the woods, mumbling bizarre secrets. Perspective adventurers may overhear something valuable, such as hints to the locations of a wood god's home (e.g. Ertta hex 0505, Gheillough hex 0606, Limwdd hex 006, Ambule hex 0805, Embala hex 1204, Yorghan hex 1305, Hasturiel hex 1404).
  - Ruchard the woodcarver carves fantastic shapes in wood, both living and dead, throughout Dolmenwood. The carver has a special gift, and his carvings host treoweres, werewolves, wendigos and other spirits.
  - The adventuring company finds a crude hut in a forest glade. Derby lives in the hut. He won't travel outside the glade because he believe that the "Slidak" will kill him if he does. He survives on a few crops and small game trapped at the forest edge. He will beg the adventuring company for supplies. 
- name: Men, Mercenary
  type: Creature
  description: Armed and armored warrior. Hard, businesslike demeanor.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Dense Forest, Roads, Settlements, Ruins]
  habitat_notes: null
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A small mercenary band, heavily armed and well-disciplined, under the command of an ex-knight (Gaheris). They are traveling to see Lady Harrowmoor about employment.
  - A dozen peasants armed with sub-standard weapons and a few spears. They explain that they lost their farms in the Tithelands due to taxation. They are looking for employment. They won't admit it, but have engaged in banditry. They are led by a farmer named Dorë.
  - A small group of tight-lipped spearmen are escorting a clearly rich noblewoman in heavy robes (Fredeswythe). The woman, from far away, is seeking witches to hex a rival. She does not speak, but will nod or wave her hands to a sergeant. The sergeant (Doderic) will not explain their errand, but will pay for information about the woods, and witches.
  - Jarmund, a grim-faced bounty hunter, and Bessie, his waifish female assistant, are tracking Finn "the gold-whisperer," notorious thief across Dolmenwood. They think he is in the Northern Scratch.
  - The orange company, a mercenary band (of 30 mercenaries) from distant lands, is camped here. They wear orange tabards, and half of them are archers. They are led by Gareth the Bold. They are considering hiring themselves out to one of the lords of the High Wold, and are eager to hear any opinions from the adventuring company about which would be best.
  - A small band of highly-disciplined dwarven heavy mercenaries are travelling through Dolmenwood on their way to a distant war. They are led by Torvin grim-Jaw, a rich but dour captain. They don't like Dolmenwood and are hurrying through it.
- name: Men, Merchant
  type: Creature
  description: Well-dressed traveler with wagon or pack animals loaded with trade goods; may be accompanied by guards. Shrewd, calculating demeanor.
  habitat: [Farmland, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Breward the merchant's wagon is loaded with wines and fine liquors for transportation from Prigwort to Castle Brackenwold (or High Hankle).
  - Phoggin the goblin merchant approaches carrying rare wares purchased from the goblin market.
  - A well-guarded merchant's wagon travels to High Hankle. It is loaded with silks, jewelry and other luxury goods. The merchant's name is Maynerd. The guards are gruff and suspicious of the adventuring company. The guard's captain is named Pymier.
  - A trio of merchant wagons brings iron ore from Lankshorn to Castle Brackenwold. All the wagons are controlled by Aramond the merchant.
  - Mukz Coin-Stacks, a dwarf gem merchant, frequents spots where adventurers are likely to be found. The merchant offers to buy gems at a good price.
  - Gresham, a merchant, is carrying a wagonload of pipeleaf to High Hankle. A wagon wheel is damaged, and the merchant is worried he will miss market-day in High Hankle, and will need to stay for an extra week.
  - Pennard, a merchant from the Woodcutter's Encampment, is transporting furs to Lankshorn (for further transshipment).
  - Erngrin, a hunched crone, offers herbal charms of protection against possessing spirits (Maegthe flowers) and ghoul disease (sweet life ferns). They may or may not be effective.
  - Oren the caravan-leader. He was traveling from Prigwort, carrying liquor and fancy beers. His caravan was ambushed by crookhorns (or perhaps wolves or bandits), killing half his guards. He has a hidden cache of gold he is carrying for Lady Harrowmoor to hire stonemasons. He will pay good money for the adventuring company to escort him out of Dolmenwood.
  - Saint Quister Help Me. Britte, a merchant from Renneton (see stand-alone adventure Wheel of Evil), was carrying an 8 foot diameter wheel of cheese named "the Baron" to the Duke of Brackenwold, when his wagon wheel broke and the wagon collapsed. Renneton needs the cheese to be delivered to the Duke as soon as possible and will handsomely reward the adventuring company if they help then travel to Renneton.
- name: Men, Messenger
  type: Creature
  description: Traveler on horse or foot; wears heraldic livery or travelling clothes. Focused, urgent demeanor.
  habitat: [Farmland, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 15%, morning: 30%, afternoon: 30%, dusk: 15%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Greylock, a mounted messenger, speeds between Castle Brackenwold and High Hankle bearing sealed commands from the Duke to Baron Hogwarsh.
  - Frundge, a shorthorn breggle herald, bears messages from Lord Ramius to the Duke, complaining of the Baron Hogwarsh.
  - Father Drave (pg 147) sends a message to the adventuring company, seeking aid. Stange lights have been seen at the ruined abbey of St. Clewyd (hex 0906) and a recent expedition to the abbey did not return.
  - A servant from Agnel Chudrow (hex 0711) travels to buy fungal cheese from Mumblebole Manor (hex 1804). One of Agnel's maidservants is pregnant and craves this cheese.
- name: Men, Noble
  type: Creature
  description: Well-dressed person; attended by retinue of servants and retainers. Proud, privileged bearing.
  habitat: [Farmland, Light Forest, Roads, Settlements, Ruins]
  habitat_notes: null
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 60%}
  sparks:
  - Treeve and Jowan Mulbreck (hex 1210) are seeking an entrance to Faerie. They are convinced that only fey lords will be able to cure their family's fungal infection.
  - Gunder, a young knight-in-training and illegitimate son of Lord Nodlock (hex 0210) and his boon companion, Hedwin, a young acolyte, are adventuring in the Dolmenwood. Gunder hopes to prove himself worthy of being recognized as the heir to the Nodlock estate. Gunder is somewhat naive, but cheerful and helpful; Hedwin is dour and cynical.
  - Lord Alaric Goldhill, a minor noble from the High Wold travels to Castle Brackenwold to see the Duke. Alaric wants to protest Baron Hogwarsh's excessive taxes.
  - Duke Mai-Fleur (hex 1505) is leading a wild hunt far from his usual hunting grounds.
  - Baron Swainsee, and his large retinue of hunters and hounds is hunting for a unicorn. The Baron is an avid hunter from far outside Dolmenwood, and has travelled to Dolmenwood specifically hoping to capture a unicorn. His technique is very bad, and he is unlikely to succeed without help from the adventuring company.
  - Princess Zoemina of Castle Brackenwold, and her attendant, Diaphne, are out in the woods to meet Zoemina's elven advisor, Waters-Sparkle-Like-Diamonds. Zoemina is seeking Water's advice on a young beau. Diaphne is a capable hunter and woodsman, so they aren't really in danger.
  - Marius Rismiuth, the oldest son of a minor noble of Castle Brackenwold is actually a changeling. Now a teenager, he wanders the Dolmenwood, seeking to understand his fey feelings.
  - Elix Malbleat, half-breggle, one of a dozen sons of Lord Malbleat, is searching for arcane secrets found in the Geatish barrows of the Dolmenwood. Elix is accompanied by 8 shorthorn guards. Elix is rude and presumptuous, but will richly reward information about barrows.
- name: Men, Patrol
  type: Creature
  description: Armed soldiers in uniform or livery; led by sergeant or knight. Alert, disciplined formation.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 15%, morning: 35%, afternoon: 35%, dusk: 15%, early night: 0%, late night: 0%}
  season: All 100%
  sparks:
  - Sir Grimes leads a mounted patrol of a dozen soldiers from Castle Brackenwold along the roads of the Dolmenwood. Grimes is shrewd and perspicuous. He will mildly question the adventuring company about what they have seen, and will instinctively notice lies and omissions.
  - Sir Blackhorn leads a patrol of a dozen shorthorns from Castle Everdusk (or Redwraith Manor). They will be deferential to human knights and nobles, but haughty to all others.
  - Led by Sergeant Theobold, a band of a half dozen soldiers patrol from Harrowmoor Keep. They are on the lookout for spies and servants of Atanuwë, and will suspiciously question sorcerers and others that appear aligned to chaos.
  - A patrol from Fort Vulgar consisting of a pair of knights, Sir Ashley and Sir Pike, together with four squires. They know the woods are dangerous but are mainly interested in keeping the road safe.
  - A road patrol from Castle Brackenwold to Fort Vulgar (or High Hankle) consisting of a horse-drawn wagon, six soldiers and 12 laborers, equipped with axes and shovels. They are charged with maintaining the road. They are led by Sergeant Cogen.
- name: Men, Trapper
  type: Creature
  description: Woodsman in rough clothing with trapping gear. Rugged demeanor.
  habitat: [Rolling Hills, Craggy Hills, Light Forest, Dense Forest, Roads]
  habitat_notes: null
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Bramwell, a cheerful fur trapper, is heading back to civilization, carrying a fine harvest of weasel skins (ermines in winter).
  - Dirk the trapper has caught a (speaking) red fox in a snare. The fox and the trapper are bargaining over the price of freeing the fox.
  - Radley the trapper has caught an aurumvorax in his trap. He proposes that the adventuring company slay the trapped beast and split the proceeds from selling its fur.
  - Hanley the trapper says that his wolfsangel has caught a wolf, but the wolf does not die. The wolf is in fact a werewolf.
  - Norbert the trapper warns the adventuring company of an especially dangerous sabre-tooth lion on the path ahead. Norbert wears a brown cloak and skulls of tiny woodland creatures.
- name: Men, Truffle Hunter
  type: Creature
  description: Forager with trained pig or hound; rough clothing. Alert, cautious bearing.
  habitat: [Meadows, Rolling Hills, Light Forest, Fungal Forest, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 20%}
  sparks:
  - Wilhelm, a young truffle hunter, with his trained pig, is searching for hogscap. This is the furthest he's been from civilization and is quite nervous. He already has collected a large sack of hogscap.
  - Waylon, a grizzled truffle hunter, with his apprentice, Dag, and trained bloodhound, Egbert. Waylon is searching for hogscap, smottlebread, witch's oyster, truffles and edible fungi. He will already have a selection. Waylon will share his foraging with friendly adventuring companies. Waylon plans to be out for up to a week at a time. Waylon is canny and familiar with the woods.
  - Obolm, a mossling fungalist is primarily searching for Tom-a-Merry and other fungus of value only to mosslings. He doesn't need an animal to assist, relying on his own nose. He is stealthy and is likely to observe the adventuring company before deciding whether to reveal and introduce himself.
- name: Men, Villager
  type: Creature
  description: Commoner in simple clothing.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 15%, morning: 30%, afternoon: 30%, dusk: 15%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - A group of teenagers (Agnes, Baxter, Muriel, Sloane and Logan) are pulling oddberries from a bush, intending to brew oddberry wine, a dangerous drink.
  - A pair of women herbalists (Abatha and Oakdyl) are gathering moss from trees with a silvered sickle. They hope to be initiated as witches.
  - A young man (Pelard) intended to meet his illicit lover (Rosala) for a tryst in the near forest. But he is lost, and is getting desperate as night approaches.
  - A group of villagers (led by Willard and Finley) armed with torches and pitchforks are hunting an ogre (Crog) that has stolen a young child (Landon).
  - A village family (Darrow, Glenna, Bori, Timin and Shoufflan) is in the woods at night; they are sacrificing a black ram to Atanuwë.
  - Elwyth, a harpist with no permanent home, is travelling to Meagre's Reach (or the Hall of Sleep or Castle Everdusk). She is guarded by her quiet, brooding brother Gamlin. Elwyth knows many rumors, and is cultured and gracious.
- name: Men, Witch
  type: Creature
  description: Woman in rough, dark robes; staff, herb pouches and ritual implements. Mysterious, commanding presence.
  habitat: [Light Forest, Dense Forest, Thorny Forest, Bogs, Swamps, Roads, Ruins]
  habitat_notes: Ritual sites and gathering places.
  watch: {dawn: 10%, morning: 15%, afternoon: 15%, dusk: 25%, early night: 20%, late night: 15%}
  season: All 100%
  sparks:
  - The witch Syldrae is returning from hex 1001 where she hoped to gather ancient knowledge of the wood gods from the Bogen (marsh giants). Unfortunately, she failed to learn anything interesting.
  - At night, the adventuring company hears chanting on the wind. If they investigate, they find three witches (Dregna, Heddil, and Murien) conducting an arcane ritual to induct newcomers to witchdom. The newcomers (Hallen, Hemsby, Kendra, Suliet, Oliwwia) are naked and their bodies are painted with runes. The witches are hostile and aggressive if their ceremony is interrupted. They demand that the adventuring party forget what they have seen, and will geas them to do so.
  - A suspicious party of women (Lady Arundel, Jenneth, Sidwyr, Sutton, Widley) are traveling on the roads. They are heading to hex 1305 to seek help from Yorghan, the Stag Lord. They need to arrive by the new moon, so are either hurrying, or traveling slowly.
  - An aged witch (Helebor) and her apprentice (Callis) survey a corrupted area of the dolmenwood. When the adventuring company is noticed, the witch will question them suspiciously.
  - Witches (Griska, Lirja, Rosa, Wynni) dig for mandrakes in the bogs. The adventuring company can hear their screams from a distance.
  - A witch (Mhorgusk) has charmed a giant dark widow, and is drawing spidersilk from its body.
  - A peddler (Ingrid) is selling pastries. The peddler is a witch and the pastries contain oddberries.
  - At the full moon, a coven of 13 led by Nhaelwydd is gathered around an ancient oak worshiping a Gwyrigon. The worship culminates in a quasi-sexual union with the oak.
  - An elderly crone (Mardle) kneels on a mossy boulder. She is communing with spirits in the boulder. She is guarded by her familiar, a winged monkey.
  - A witch (Haycomel) invites the adventuring company to sit for herbal tea. Participating member of the company must succeed on a DC 15 Luck check or be invisibly marked that gives all witches advantage on spellchecks to scry on, or cast charm spells on, the marked members. The mark can be seen by detect magic. The mark fades after one year.
  - A witch (Cressida) moves acorns around in the dust as a means of reading the future. If interrupted, she will be angry.
  - A witch (Ranhild) argues with a scarecrow effigy, trying to convince it to leave her alone; the good-natured scarecrow refuses with a smile. The witch will try to get the scarecrow to follow the adventuring company instead.
  - A witch (Gremil) approaches the adventuring company. She needs the "seed" of a player character to manufacture a golem. She willing to trade a cloak of mist in exchange. If the player character agrees, she hands him a clay pot and directs him to "do it" behind a tree.
  - In the woods, the adventuring company discovers a witch's cottage, but the witch (Morgyth) is not home right now. Several children (Bonni, Tansel, Fledrick) are locked in iron cages; the witch plans to trade them to Shub's Nanna (pg 47 DCB). The cottage also contains a large number of dried herbs.
  - In the woods, the adventuring company meets a strange cloaked woman (Yldraith) riding bareback on a wild horse. She will geas a member of the adventuring company to "do a kindness every day for a year."
  - Scruggina, a witch with a commanding nature, is examining a patch of crimson red scales. She volunteers to the adventuring company that these scales must have come from a blood wyrm. She also says that every true wyrm has a weakness, which can be divined by a sage or alchemist studying the wyrm's body parts, such as discarded scales. For that reason, it is very rare for a wyrm to leave behind anything such as these scales.
  - The weather makes a sudden turn for the worse, heavy squalls and rain. Suddenly, Corolleth the witch drops from the sky right in front of the company. She is a with sworn to Ertta (DCB p 37). She claims that something carried by the PCs rightfully belongs to the witches and demands its return. If they do, Corolleth invites them to Hoarblight Keep (hex 0505).
  - A witch (Bragwen Hoad, see hex 1108) approaches the adventuring company. She is travelling to the hill of Henlann (hex 1602), where she will ask about the plans of the Naglord. She asks the company to escort her through the woods of Duke Maifleur. As a reward, she will "sponsor" the company and allow them to ask a question of the watchers (no check necessary). If there are promising young women in the adventuring company, she may attempt to recruit them as witches.
- name: Men, Wizard
  type: Creature
  description: Person in colorful or eccentric robes; carries staff, spellbook, and arcane implements. Scholarly, imperious bearing.
  habitat: [Meadows, Farmland, Rolling Hills, Light Forest, Dense Forest, Roads, Ruins, Dungeons]
  habitat_notes: null
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 10%, late night: 10%}
  season: All 100%
  sparks:
  - A man (Mickernell the Crimson) in outlandish red robes, clearly a wizard. He is seeking tusks from a miniature mammoth that he must kill himself. He is accompanied by a pair of hunters (Canhoreal and Drave), all mounted.
  - The wizard Sulor (from far outside Dolmenwood) accompanied by a clay golem. The wizard is testy, He is traveling to Blackeswell to search for hag iron. Mammalian animals are nervous in the presence of the wizard.
  - Xwill has been severely corrupted. Its skin is warty, it has small horns, and it randomly cackles and gibbers. The wizard is researching wood to construct a magical staff and is traveling to hex 1303.
  - The wizard Uprix mounted on trained griffon. The wizard dresses all in blue. He is flying to Castle Everdusk (hex 0410) to see Lady Berryld Ramius (or possibly the sorceress Ygraine in hex 1802). It is likely he will simply fly over the adventuring company without stopping.
  - Abrear, a journeyman wizard is traveling to Prigwort, hoping to apprentice himself to Mostlemyre Drouge. If the adventuring company assists, he will succeed. If not, Mostlemyre will refuse him.
  - Segwine, a cobbin wizard (see hex 1904). She is traveling to see her former master, the audrune Hermanach (hex 0804). The audrune will be favorably disposed to anyone who travels with her. Segwine is also taking the opportunity to travel to Castle Brackenwold, seeking optical instruments to help her stargazing.
  - Windore Hoblewort, a longhorn sorcerer, (see hex 0708) with a half-dozen shorthorn attendants is traveling to Dreg under orders of Lord Malbleat. Windore is cranky and unhappy with the task.
  - Myrrsian the Mutable (see hex 1110), traveling incognito, is seeking magic crystals. He is accompanied by his three invisible sprite servants. With a positive interaction, he may reveal himself to the adventuring company. He is especially interested in information about the white way and crystalline apples that may be found there.
  - Ozur the Sibilant, an elderly wizard with a tall oaken staff, is travelling Dolmenwood, seeking a suitable apprentice. He may be interested in a member of the adventuring company. The first step of apprenticeship is to seal oneself in a cave and meditate silently for 100 years.
- name: Men, Woodcutter
  type: Creature
  description: Laborer in rough work clothes; axe; muscular build. Hardworking demeanor.
  habitat: [Light Forest, Dense Forest, Roads, Settlements]
  habitat_notes: null
  watch: {dawn: 15%, morning: 30%, afternoon: 30%, dusk: 15%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - A ghostly woodcutter (Eorran) is seen chopping a tree at night. If questioned, he explains that, as a mortal, he was caught trying to harvest a fairy tree. The fey cursed him to chop the tree until it falls. Every night he cops, but during the day the fairy tree regrows.
  - While cutting wood, a woodcutter's magic axe is singing a haunting melody. He claims it was a gift of the "green lady of the woods." It keeps ghosts and fey at bay, but now whenever he cuts woods, ghostly spirits gather at the perimeter. His name is Gunther, and he is friendly and cheerful.
  - Woodcutters are felling trees. They need large, very straight lodgepole poplars. The woodcutters are led by Jerrin and Meershawm. They are friendly enough, but really only interested in finding and cutting appropriate trees.
  - The adventuring company comes across a woodcutter's camp. Over supper, they tell ghost stories. The woodcutter's leader is named Bramley, but the most talkative woodcutter, who is also the best storyteller, is Osbalt.
  - A group of woodcutters are sharing a mid-day meal, boasting of their strength and skill. If anyone in the adventuring company appears strong, a woodcutter (Hurst) will challenge them to a test of strength to see who can lift the largest log; if not, he will ask the adventuring company to judge between the woodcutters Prowse and Lumm.
  - A single woodcutter (Brayby) stands guard over a massive oak. He was charmed by a witch to protect it.
  - A solitary woodcutter (Lurents) is examining a tree with a face carved into it; a potential treowere.
  - Grimbold, a woodcutter, emerges from the woods. He senses that something is "off" about the woods and says he is hurrying home. He is correct; a group of walking corpses are in the area.
  - Four woodcutters, led by Grey Sandy, float huge logs down the Hameth to Dreg. They call out heartily to the adventuring company.
  - Baren the woodcutter has found a small fairy door hidden in the crevices of an oak tree. He is very excited and eagerly tells the adventuring company, and even offers to show them the way. The small door leads into an interior space larger on the inside than outside, decorated as a cozy home. However, time in the space passes 7 times faster than in the mortal world.
  - Merle the woodcutter is gathering Hawthorn wood looking for very specific shaped pieces. He wants to construct a wooden puppet, hoping to attract an effigy spirit. Merle's son died a few years ago and the puppet is his emotional replacement.
- name: Merfaun
  type: Creature
  description: Humanoid with fish tail; small goat horns; bouncy. Singing and laughing.
  habitat: [Rivers, Lakes, Seas]
  habitat_notes: Coastal areas and waterways.
  watch: {dawn: 20%, morning: 20%, afternoon: 25%, dusk: 20%, early night: 10%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Hygen, a merfaun messenger, is speeding his way to an underwater fairy road to deliver a birthday greeting to the sorceress Ygraine (hex 1802) from King Capricorn. He has a magic amulet that allows him to grow legs and breathe air (necessary to reach Ygraine's home at Chateau Mauvesse), but will hire the adventuring company as guides, paying with a sack of silver coins.
  - A group of merfauns (Aegeon, Julaton, Ippocri, Pelagion, Silvarion, Tappho) frolic in the water. They call out to attractive passersby, inviting them to join in swimming in the water.
  - Oenopo, a merfaun, lounges half-asleep atop a domesticated giant crab as it moves back and forth across a beach, looking for food. If approached, the merfauns let the crustacean give sentient creatures a little scare before calling it off.
  - Pello, a merfaun trader, barters with a pair of halflings (Clement and Nash) for different kinds of pipeleaf. He insists on trying the merchandise before buying, much to the annoyance of the halflings.
  - Timun and Sarmion, merfaun warriors are lying in wait as a kelpie lures a handsome young man to the water's edge with its enchanting song.
  - A group of playful merfaun splash in the water. Their spokesman, Pisco, invites the adventuring company to return to the pool in the moonlight, where they will see "wondrous treasures and spectacles." Pisco is good to his word, and if the company returns during moonlight, they will see visions of beauty and desire, and with a DC 10 Luck check, will receive clues to achieve their desires.
  - Frallon, an elderly merfaun with a long beard, rises from the water and warns the adventuring company to beware the Big Chook (hex 0605). If the adventuring company inquires, Frallon can describe the Big Chook and tells the company that King Capricorn will surely reward anyone who drives away the Big Chook.
  - Bathyl the merfaun warrior is bleeding from a battle with a giant pike. Bathyl requests the adventuring company to provide him with the herb Heals-All (known by humans as St. Aevila's Wort). Bathyl cannot reward the company, but if they can do so, he extends an invitation to be his guest at King Capricorn's court (hex 0605).
  - Oddo, a merfaun, calls out to the adventuring company. He is seeking a mithril and aquamarine crown that was stolen from the merfauns by a horrible ogre. Oddo offers a reward in gold, plus an audience with King Capricorn if the company and recover the crown.
- name: Merman
  type: Creature
  description: Human from waist up; scaled fish tail from waist down; blonde or white hair; gills on neck. Melodic voices, speaking in bubbling tones.
  habitat: [Seas]
  habitat_notes: Coral reefs and coastal waters.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: All 100%
  sparks:
  - A trio of mermen are herding fish through coral formations with long goads.
  - Mermen are basking on sun-warmed rocks while mermaids sing and play harps made of shell and driftwood.
  - A merman hunter surfaces near the adventuring company's boat, eager to show land-dwellers his new tattoo of a kraken.
  - The adventuring company spots the shimmer of fish scales beneath the waves as a merman warband patrols the reef.
  - A group of mermen and mermaids perform an elaborate underwater dance, visible through the clear water.
  - A solitary merman sits on a rocky outcrop at low tide, mending a fishing net woven from kelp.
  - Mermen warriors challenge the adventuring company's ship, demanding tribute for safe passage through their waters.
- name: Mimic
  type: Creature
  description: Appears as medium-sized object made of wood, stone and metal. Single eye may appear. Sticky texture.
  habitat: [Ruins, Caverns, Dungeons]
  habitat_notes: Avoids sunlight.
  watch: {dawn: 20%, morning: 20%, afternoon: 25%, dusk: 20%, early night: 10%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The mimic is in a classic form- a treasure chest.
  - The mimic is in the form of a stone archway, waiting for humans to walk underneath.
  - A mimic is in the form of a door.
  - The mimic is in the form of a barrel. If anyone reaches inside, the mimic bites.
  - The mimic took the form of a pile of copper coins.
  - The adventuring company sees the mimic change from a wooden pillar to a box.
- name: Minotaur
  type: Creature
  description: "9-foot tall humanoid with bull's head; powerful muscular body; sharp horns; brown or black fur on head and shoulders. Deep bellowing and snorting."
  habitat: [Ruins, Caverns, Dungeons]
  habitat_notes: Especially maze-like caverns and underground labyrinths.
  watch: {dawn: 15%, morning: 20%, afternoon: 20%, dusk: 15%, early night: 15%, late night: 15%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - The minotaur is in a rage, smashing stone decorations to bits with its greataxe.
  - The minotaur is threatening cave orcs for tribute, bellowing demands.
  - The minotaur is clearing out cave spider webs, preparing its lair.
  - Deep snorting echoes through stone passages. The minotaur is tracking intruders by scent.
  - A minotaur lopes through a labyrinthine series of tunnels, carrying a greataxe.
  - The adventuring company finds gnawed human bones arranged in a grotesque pattern - the minotaur's territorial marker.
  - A minotaur crouches in ambush at the junction of twisty passages.
- name: Monkey, Flying
  type: Creature
  description: 3-foot monkey; white feathered wings; brown fur; tail. Monkey screeches.
  habitat: [Light Forest]
  habitat_notes: null
  watch: {dawn: 20%, morning: 30%, afternoon: 30%, dusk: 15%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 70%}
  sparks:
  - A troop of flying monkeys is resting in a tree, eating fruit.
  - A flying monkey perches on a tree, watching the adventuring company. The monkey is a spy for a witch.
  - 3 flying monkeys drop from the sky and snatch something interesting from the adventuring company members. They fly away with their new acquisitions.
  - In winter, a troop of flying monkeys bathes in the warm waters of a hot spring while snow falls around them.
- name: Mossling, Bargeman
  type: Creature
  description: Dwarflike humanoid with mossy beard and lichen skin; rough clothing. Quiet, shy demeanor.
  habitat: [Light Forest, Fungal Forest, Bogs, Rivers, Caverns]
  habitat_notes: null
  watch: {dawn: 10%, morning: 35%, afternoon: 40%, dusk: 10%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Pimbur, a mossling bargeman, poles by on his pirogue. He calls out to the adventuring company, asking if they need a ride. He asks 1 sp per person. Pimbur is a solemn, quiet mossling who will speak only in short sentences in response to questions, but is an excellent water guide.
  - Mirefud, a mossling bargeman with two assistants, carries a load of edible fungi in his small boat to Dreg. He also carries a small stash of poisonous fungi for Madame Shantywood. He asks if the adventuring company has any news of Dreg or Madame Shantywood.
  - A mossling's barge is stuck in duckweed choking the small creek he is traversing. Furbur will be glad of any assistance. However, the adventuring company must submerse themselves up their stomach to push out the barge. While in the water, they will be attacked by a giant carp, looking for an easy meal.
  - Moell's pirogue is in the middle of the water, where he uses a hooked pole to pull moss from overhanding trees. He will grunt a greeting to the adventuring company, but would prefer not to be disturbed.
  - A family of mosslings, led by Urmul are migrating to new grounds, carrying all of their worldly possessions in a cart. Urmul will explain that their fungal cave farm was infected by chaos.
- name: Mossling, Mold Oracle
  type: Creature
  description: Dwarflike humanoid covered in shelf fungi, molds, and mushrooms; body dripping with slime. Wild-eyed, ecstatic or trance-like demeanor.
  habitat: [Light Forest, Fungal Forest, Bogs, Caverns]
  habitat_notes: null
  watch: {dawn: 20%, morning: 15%, afternoon: 15%, dusk: 20%, early night: 20%, late night: 10%}
  season: All 100%
  sparks:
  - A mold oracle (Yweboll) is crawling through the undergrowth on a vision quest in wide-eyed, psychedelic glee, drooling pink slime. His body is completely covered in red and yellow shelf fungi. He is likely to believe passersby to be divinatory hallucinations.
  - A mold oracle (Zembur) totters under the weight of a gigantic yellow mushroom covered in pale green froth—a giant, 50-dose specimen of Shaggy Sage (DCB pg 429).
  - A mold oracle (Rimbuli) stirs a pool of star-spangled blackness in the hollow bole of a tree, attended by 3 spore clouds in a vaguely humanoid shape. Tiny blue-black toadstools cover the oracle's face and arms. If disturbed, all vanish and the pool of blackness evaporates.
  - A mold oracle (Slemburri) leads her congregation of a half-dozen mosslings in anointing a 15 foot tall, rotting stinkhorn mushroom with sloppy, fermented milk. Red slime molds and blue puffballs cover the mushroom. The ritual culminates with the voice of the Myconom (DCB pg 38) prophesying a fungal uprising in the Nagwood, expelling the alien Nag-Lord.
  - Mid-day, the adventuring company stumbles across a forest glade under a night, moonlit sky. Multi-colored comets streak across the sky. In the center, a mold oracle sits in contemplation of the universe. Sheets of black and white fungi cover her entire body, and her eyes are milky white. She invites the adventuring company to join her by inhaling spores. Any member that does so has advantage on their ability to learn the Astronomy skill during the next seasonal turn.
  - A venerable mold oracle (Jombulum) is merged with and atop a decayed tree stump. When the adventuring company appears, they see Jombulum, his skin a powdery yellow with brown puffballs. The oracle pronounces a cryptic prophecy concerning their current goals, then dies, collapsing in a puff of spores.
  - A young mold oracle (Limoli) cheerfully greets the adventuring company. He appears mostly normal, with only a few tom-a-merry mushrooms sprouting from his shoulders. He offers to share the tom-a-merrys with the adventuring company.
  - A group of mosslings are preparing a fungal feast, mostly roasted mushrooms. They are led by a mold oracle (Obluli), with brown and red shelf fungi. Giant fireflies hover above, providing cheerful lighting for the feast. If the adventuring company partakes, they recover a hit die and a will die.
- name: Mossling, Moss Gatherer
  type: Creature
  description: Dwarflike humanoid with mossy beard and lichen skin; carries baskets, tools, or herding implements. Cautious, territorial demeanor.
  habitat: [Light Forest, Dense Forest, Fungal Forest, Bogs]
  habitat_notes: Fungal gathering grounds and mossling settlements.
  watch: {dawn: 20%, morning: 30%, afternoon: 30%, dusk: 15%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 60%}
  sparks:
  - A half dozen mosslings are carefully setting upright a dolmenstone that toppled over. They believe the dolmenstone is important to the continued health of their nearby fungal gardens. Pannanum, their spokesperson, is an elderly gnarled mossling with an immense beard in which copious moss is interwoven. Pannanum is fearful of the increasing human and chaos presence in the Dolmenwood. He would like to encourage the adventuring company to pressure humans to leave the area, but without much hope.
  - Snobul, a mossling swineherd, is chasing a prized flying pig. The pig ate some bad fungus, and suffers from paranoid hallucinations. Every time Snobul approaches the pig, it takes flight.
  - Gimbim and Loblom, a matched pair of married mosslings, are gathering wild fungus from the forest. They have found a patch of witch's purple and mawburg's jam (DCB pg 429) in 5 foot tall wicker basket. They will gladly share their use with the adventuring company, since it is more than they can use.
  - Bilseebum, a mossling scout, is silently observing the adventuring company from a hidden spot in undergrowth. As the company passes, a snuffling boar uncovers the mossling. Bilseebum is not hostile, but warns the adventuring company not to harvest fungi which rightfully belong to the mosslings.
  - The adventuring company finds a lone turfhouse deep in the woods. Gaabin, its owner is inside preparing mushroom tea. Gaabin is a free-thinker, originally from Orbswallow (hex 1405) who rejected the communal mind-meld with Blosquom. He is eager for news of the outside world. Gaabin has cultivated the friendship of giant fireflies who lurk nearby, creating a fascinating color show.
  - A trio of mossling warriors, armed with spears and slings that throw poisonous puffballs, are battling a carcass crawler that is too close to their fungal gardens. Their leader is Byangum. Although grateful for help, they are uncomfortable around humans and will leave unless convinced to stay.
  - The adventuring company stumbles across a mossling's cultivated fungal garden. Unlike wild growths, these fungi are organized in orderly rows, growing on boxes of soil or felled tree limbs. If the company stays an hour, the owner, Beberri, appears with a rake. He is possessive, but will offer the adventuring company 3 doses of Lover's Gasp (DCB pg 429) if they will leave without molesting him (and will explain its use).
  - Four mosslings (Skolmur, Dwimby, Wobbol, Eblimi) are transferring cheeses from a hand-drawn wagon into an underground grotto to cure. They offer the adventuring company some already-cured cheeses with purple veins. The cheese has an aniseed taste. It is made with Witches Purple (DCB pg 429).
  - Gilly the mossling seeks assistance. Her clan's mould oracle as seemingly been corrupted by chaos, and has transmogrified half the clan, and wounding the remainder. Gilly seeks to rescue the wounded and recover her clans secret cheese recipes. See Moonscar Manor in separate adventure Dolmenwood Dozen.
- name: Moth, Giant Eye
  type: Creature
  description: 4-foot wingspan; pale green wings with large yellow eye-spots; fuzzy antennae.
  habitat: [Light Forest, Dense Forest, Thorny Forest, Ruins]
  habitat_notes: null
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 15%, early night: 45%, late night: 35%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 40%}
  sparks:
  - At night, the moth is attracted to the adventuring company's campfire. Once it arrives, it seeks and eats alcohol, honey, dried fruit and magic potions. It will prefer items left in the open, but will dig into backpacks and similar containers (although will not enter a tent). If confronted, it will use its disorienting cloud ability to attempt to put guards to sleep.
  - At night, the adventuring company hears the sound of slurping. If they follow the sounds, they discover a pair of giant eye moths raiding a honey tree. The bees are swarming, but they cannot fly at night.
  - The adventuring company discovers a mossling brewer snoring on the trail. His barrel is empty and a fine white powder coats the area. If awakened, he explains that he was put to sleep by large, aggressive giant eye moth.
  - The adventuring company comes across an enormous wild cherry tree. Nesting in its top branches are three giant eye moths. They will aggressively defend the cherry trees from interlopers.
  - While traveling at night, a giant eye moth, attracted by their torchlight, stumbles directly into the adventuring company. It immediately uses its disorienting cloud ability, then flies off.
  - Rizzle, a goblin alchemist has trapped a giant eye-moth in a wooden cage. Laid underneath the cage is a leather sheet. Rizzle is tickling the moth with a 20 foot pole, trying to get it to release its powder, but the moth is exhausted. Rizzle will gleefully explain this to the adventuring company, and if they express interest, may sell them some powder. However, the powder is inert unless reactivated through magical or alchemical means.
- name: Murmurin
  type: Creature
  description: Short humanoid; gray clothing; long nose; twinkling eyes.
  habitat: [Light Forest, Dense Forest, Thorny Forest, Fungal Forest, Ruins]
  habitat_notes: Near faerie roads and boundaries.
  watch: {dawn: 10%, morning: 10%, afternoon: 10%, dusk: 30%, early night: 20%, late night: 20%}
  season: All 100%
  sparks:
  - As the adventuring company settles down for the night, a lone Murmurin timidly approaches their campfire, drawn by the light and warmth. Lanterglow asks, with wide, twinkling eyes, if they might have any thrilling tales to share. If they do so, the Murmurin tells a story he heard from other adventurers, revealing the location of a lost treasure or entrance to a fairy road.
  - Sweetleaf, a murmurin, is sitting on a giant toadstool, in a ring of toadstools. The murmurin invites the adventuring company to sit and exchange stories, but the stories must be told in rhyme (and for the company) must relate their greatest adventures to-date. If every member of the adventuring company does so, the murmurin will reward them with a bit of a gold saintly statue from a nearby lost shrine. The murmurin can't recall the location of the shrine.
  - The murmurin, Bobweaver, weaves his stories into a tapestry he keeps in a huldra's home tree. In exchange for telling their stories, Bobweaver will show them the tapestry, which has many clues to nearby locations. The huldra is protective of Bobweaver.
  - Songsure, a murmurin on the trail, challenges the adventuring company to a contest of riddles. If they participate, he will warn them of a dangerous monster ahead.
  - Winkleborn, a murmurin, demands a story from the adventuring company as payment for passing through a particular trail. If they refuse, he becomes insistent and a minor nuisance. If they comply, he will tell them where the trail leads.
  - Treeskimmer the murmurin recently met a merfaun who shared King Capricorn's enmity for Big Chook (hex 0605). He will share the story without demanding recompense and will proudly announce that the adventuring company is the first who've heard the story.
  - Wordmonger the murmurin approaches the adventuring company and demands they tell a story featuring a specific strong emotion (deep sorrow, true love, true joy, abject fear). In exchange he will relate 1d6 bits of gossip he's recently overheard (see Rumors, DCB pg 440).
  - At night, a sharp-eared member of the adventuring company hears a rustle in the underbrush. It's a murmurin (Longlyric), too timid to approach, but desperate to hear the company's stories. When caught, he flees.
- name: Mushroom Men
  type: Creature
  description: 4-foot tall humanoid mushrooms with arms and legs; light beige skin; brightly colored caps; cute, button eyes.
  habitat: [Dense Forest, Fungal Forest, Caverns]
  habitat_notes: Mushroom colonies.
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {Spring: 90%, Summer: 100%, Autumn: 100%, Winter: 50%}
  sparks:
  - A half-dozen mushroom men are leading a group of befuddled, befriended humans back to their colony. If stopped or questioned, they will protest "But they want to come with us; see how happy they are."
  - A mushroom man elder, accompanied by 3 mushroom men, are conversing via spores with a pair of mossling mold oracles. They are discussing the growing threat of chaos in the Dolmenwood.
  - A wounded mushroom man stumbles through the forest, scorched by fire. He is the victim of a Chimera.
  - As the adventuring company travels through the fungal forest, a 4 foot tall mushroom suddenly comes to life. It won't try to befriend the company, but wishes to communicate via telepathy spores. The mushroom man is curious about human religion, and in particular why humans worship far-away gods rather than the gwyrgion.
  - Egber, a lost child, is holding the hand of a mushroom man, happily following him into the woods. The mushroom man is just trying to make a friend and believes he is doing a good thing.
  - A trio of mushroom men sit in a circle surrounded by woodcutters, all befriended to the mushroom men's spores. If the adventuring company does nothing, eventually the mushroom men will move off, leaving the woodcutters in a pleasant, spore-induced state of happiness.
  - An elk stumbles through the woods, in a state of dreamy psychedlia from getting too close to mushroom men.
- name: Nack
  type: Creature
  description: Beautiful, waif-like elven woman; hair and eye color matching the color of the water.
  habitat: [Rivers, Lakes]
  habitat_notes: Clear pools and waterways.
  watch: {dawn: 20%, morning: 20%, afternoon: 25%, dusk: 20%, early night: 10%, late night: 5%}
  season: All 100%
  sparks:
  - The nack, Ainur, rests on an outcropping over her home pool, singing a joyful song.
  - Nacks (Kjalkyr, Bleikur, Eyrun, Fornyr, Hylvir, Thorfi) swim and play with lake otters.
  - A nack (Volu) has given birth to a changeling. She asks the adventuring company to take it from her.
  - A nack (Rindyr) floats beguilingly underwater, her hair spread out floating. Her pet sturgeon lurks nearby.
  - A nack (Undyr) warns the adventuring company that a fierce kelpie (Andrid) lives a mile upstream. If the company looks competent, she will use her suggestion ability to suggest they kill it.
  - The nack (Mynthyr) excitedly proposes to exchange gifts with a female member of the adventuring company. The nack offers a large river pearl worth 50 gp.
  - While traveling on a river, an elderly and terrible nack (Graemir) arises from the water. She demands that the adventuring company make an offering of great magic or gold, by throwing it in the river. Depending on the value of the sacrifice, the adventuring company's passages on the river for the next year will be easy or difficult.
  - Two nacks, Hyrdur and Greyth, are racing down a river, past the adventuring company. If the company offers congratulations to the winner, they will win the favor the nack.
- name: Newt, Bog
  type: Creature
  description: 5-foot long newt; flattened head; translucent, clammy white skin; glassy claws; bulbous, glowing eyes. Slurping and wheezing.
  habitat: [Bogs, Swamps, Rivers, Lakes]
  habitat_notes: null
  watch: {dawn: 25%, morning: 15%, afternoon: 10%, dusk: 25%, early night: 15%, late night: 10%}
  season: {Spring: 90%, Summer: 100%, Autumn: 80%, Winter: 5%}
  sparks:
  - The newt is spawning in an algal pool, laying fist-size eggs in a mass of sticky jelly.
  - A pair of newts are listening to a tune played by a satyr harpist.
  - The newt is dragging a paralyzed, near-dead mossling trapper back to its nest.
  - The newt is eating a giant leech, gulping its body down in stages.
  - A newt and a giant frog are staring at each other, unblinking.
  - Three newts are swimming lazily in a creek.
  - A newt recently ate glowing fungi, and now its entire body is softly glowing.
  - A newt is lurking in the deep mud. As the adventuring company passes, it will ambush the last member of the company, trying to bite it and drag it into deeper water.
  - A giant snapping turtle is trying to regurgitate a bog newt it swallowed.
  - A goblin fisher (Threedle) is trying to lure a bog newt with a giant fly at the end of a stick. The fisher is trying to slip a noose over the neck of the newt, in order to harvest the newt's toxins.
- name: Newt, Cave
  type: Creature
  description: 12-foot long newt; near-transparent flesh; vestigial eyes; mucus trail. Chirps.
  habitat: [Caverns]
  habitat_notes: null
  watch: {dawn: 25%, morning: 15%, afternoon: 15%, dusk: 25%, early night: 10%, late night: 10%}
  season: {Spring: 90%, Summer: 100%, Autumn: 80%, Winter: 5%}
  sparks:
  - The newt is curled around a stalagmite, watching for victims.
  - The newt is waiting in an opening near the ceiling, waiting to ambush prey.
  - The newt is hidden in a pool of clear water, watching for blind cave fish.
  - The newt is eating a cave locust.
  - Two adult male newts are staring at each other, disputing territory.
- name: Newt, Red
  type: Creature
  description: 3-foot long newt; bright, red skin; black eyes; clumsy. Chirps.
  habitat: [Light Forest, Dense Forest, Bogs, Swamps, Rivers, Lakes]
  habitat_notes: null
  watch: {dawn: 25%, morning: 15%, afternoon: 15%, dusk: 25%, early night: 10%, late night: 10%}
  season: {Spring: 90%, Summer: 100%, Autumn: 80%, Winter: 5%}
  sparks:
  - The newt is sitting on a rock in a pond, chirping to attract a mate.
  - A pair of newts are sitting in a tree, watching the adventuring company closely.
  - The newt is calmly eating a giant fly.
  - A young witch (Lothild) in a brown shift has charmed a red newt. She is luring it closer, intending to kill it and harvest the newt's eyes.
  - The adventuring company finds a huge hollow tree, suitable for a night's shelter. Unfortunately, it is inhabited by a dozen red newts.
  - The adventuring company spots a mutated red newt with a second head. This is a clue that this region of the woods is tainted by chaos. The newt has a second head (and bite attack) but is no more aggressive than normal.
  - As the adventuring company passes a dead tree, a rotten branch splits open and a red newt emerges.
  - A slimy tree trunk is the only way to cross a muddy creek. Lurking under the trunk is a group of red newts. Attacks and other vigorous activity require a Dexterity check to avoid falling off the log into the muddy depths below.
- name: Newt, Spotted
  type: Creature
  description: 2-foot long newt; black skin with yellow dots; black eyes; clumsy. Chirps.
  habitat: [Rolling Hills, Light Forest, Dense Forest, Bogs, Rivers]
  habitat_notes: null
  watch: {dawn: 25%, morning: 15%, afternoon: 15%, dusk: 25%, early night: 10%, late night: 10%}
  season: {Spring: 90%, Summer: 100%, Autumn: 80%, Winter: 5%}
  sparks:
  - A pair of newts is sheltering in a crack under a rock. They watch the adventuring company closely.
  - Three newts are playing in the mud.
  - The newt is eating a crab.
  - A newt is digging in the sand on the beach, preparing to lay eggs. Another newt watches.
  - At night, a pod of spotted newts invades the adventuring company's campsite. Members that are unwary may step on a newt.
  - A spotted newt ambles by. Oddly, it has a silver chain around its neck. The elven word for "guardian" is written on the chain.
  - A member of the adventuring company steps on a rotted log in which a spotted newt is sleeping. The log collapses, and the member must make a DC 10 Dexterity saving check or be exposed to spotted newt toxins. The newt will make a single bite attack then scurry off.
  - A wicker basket trap holds a pair of spotted newts. The trap has witch sigils on it, and the witch (Ygril) will be upset if the adventuring company messes with her stuff; but it's unlikely she will find out.
  - After rainfall, a section of trail is thick with spotted newts. The adventuring company sees one or two every 50 feet.
  - Atop a wooden statue of a bear, perches a spotted newt.
- name: Nord Barrow
  type: Creature
  description: Ancient burial mound with stone entrance; often carved with runes. Musty smell of graves and decay.
  habitat: [Meadows, Rolling Hills, Craggy Hills, Ruins]
  habitat_notes: Ancient burial sites.
  watch: {dawn: 10%, morning: 30%, afternoon: 30%, dusk: 10%, early night: 10%, late night: 10%}
  season: All 100%
  sparks:
  - The adventuring company discovers a Nord hill barrow. Inside are barrow-wights.
  - An ancient Nord lord sits on his throne in catacombs under ruins. Guarding the entrance to his tomb are four barrow-wights. Swords line the passage to the throne.
  - Some ancient Nord killed his enemy, and then raised him as a barrow-wight. Now the barrow-wight is trapped under a silvered cage which painfully presses on it.
  - An exhumed barrow-mound. Clerics have dug it out, exposing the barrow-wights inside to the cleansing power of the sun.
  - A miserly barrow wight counts coins in his coffers, moving them from one coffer to another for eternity.
  - Unbeknownst to the adventuring company, a barrow-wight is buried in an unmarked grave underneath the campsite. In the middle of the night, the barrow-wight bursts forth, scattering flames everywhere.
  - The adventuring company slightly hears a haunting melody; it's a harp from a crack in the ground. By tracing the sound, they can discover the entrance to a cave. Inside is a barrow-wight playing a gorgeous silver harp set with moonstones.
  - In his burial cairn, a barrow-wight sits surrounded by undead ravens. The barrow-wight will challenge those that enter his cairn to a riddle contest, but he is not violent. The stakes of the contest are treasure; the barrow-wight offers a gold cup.
  - A conjure-man is painting crude runes on a barrow, hoping to bind it closed.
  - Arlo the balladeer is playing his lute atop a barrow-mound. He explains that he does so in order to keep the "cold ones" in their bed on moonless nights. His village is just a few miles away.
- name: Nutcap
  type: Creature
  description: Diminutive humanoid; sycamore seed wings; acorn caps; hands and feet like roots; smooth beech bark skin.
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: null
  watch: {dawn: 15%, morning: 30%, afternoon: 30%, dusk: 20%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 70%}
  sparks:
  - A group of nutcaps (Greepeeg, Weepoorlee, Poeleemee, Queegleen, several others) are drunk on amberberry wine, and fighting over a bag of magical acorns that grant a haste effect for 10 minutes.
  - A flight of nutcaps are raiding a farmer's cart laden with turnips. The farmer (Brant) is trying to fend them off with a rake.
  - Nutcaps (Droleep, Keethelwee, Reegeenlee, Moreepeen, Eemomolee, etc.) are decorating the face of a dormant treowere, hoping to attract a treowere spirit.
  - Nutcaps (Brolee, Pweeno, Eegoleen, Opeedreelee, Pleemeemo, Leejuju) are bathing their tenderlings (6 inch tall, green, leafy faces) in a pool.
  - The nutcaps (Oporee, Beebee, Quemeelee, Reekreek, Eebleek, Eekpo, Gropeegee) have harvested a huge sack of hazelnuts, and are carrying it back to their colony.
  - A single nutcap (Queelee) has a pouch of silver pieces. He wants to trade it for caltrops.
  - A group of nutcaps (Weeklee, Ooloree, Squolee, Seegleemee) are fighting squirrels.
  - The adventuring company finds a goldberry bush. If they eat any berries, a flight of nutcaps (led by Nopeemee) emerges nearby, scolds the company and demands payment for their berries.
  - A flight of nutcaps, with a nutcap princess (Kethelwee), is searching for a new home. They are looking for a cavity in a tree.
  - A dead woodcutter, its mouth filled with dirt. Nearby, its woodaxe is embedded in the trunk of a young oak tree. The woodcutter was killed by angry nutcaps, who live nearby.
  - A nutcap woodcarver (Queegomee), with his two assistants (Neepneep and Hweepmee), is polishing a nearly finished yew staff – several times larger than the nutcap. The staff can be used as an arcane focus and grants a +2 bonus on spell checks relating to wood and plants. The staff is intended to be a gift for an elven lord, but if the adventuring company befriends the nutcaps, they may gift it to them.
  - A team of nutcaps (led by Poreeree) is repairing a bridge made of living wood over a small stream. The nutcaps maintain this bridge for a nearby huldra. If the adventuring company approaches, they will flee, but will attack if the adventuring company damages the bridge.
- name: Ochre Ooze
  type: Creature
  description: Protoplasm of wet, yellow-brown color.
  habitat: [Bogs, Swamps, Caverns]
  habitat_notes: It avoids sunlight.
  watch: {dawn: 5%, morning: 0%, afternoon: 0%, dusk: 10%, early night: 40%, late night: 45%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 40%}
  sparks:
  - The ochre ooze is lurking in the deepest part of a slow river. While fishing, a player character pulls it up.
  - The ochre ooze is resting in a natural bowl in a cavern.
  - The ochre ooze lays on a natural cavern floor, its color blending into the stone.
  - The ochre ooze is lying quiescent in red dirt. The ooze is disturbed by digging.
  - In a bog, the ochre ooze lies motionless, waiting for the adventuring company to cross.
  - A wading deer screams in terror. It is trapped in an ochre ooze.
- name: Ogre
  type: Creature
  description: 9 foot tall humanoid; crude features in disproportionately large head; light green or lavender skin; huge gut; tusks; primitive weapons and hide clothing. Foul stench. Booming, guffawing laughter.
  habitat: [Rolling Hills, Craggy Hills, Light Forest, Dense Forest, Thorny Forest, Ruins, Caverns]
  habitat_notes: null
  watch: {dawn: 10%, morning: 30%, afternoon: 30%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - Travelling ogres (Hedd, Jugg, Peck) have kidnapped children, planning to barbecue them, as soon as they are fattened up. The ogres carry the children in large, wooden cages mounted on wagons. As they travel, the ogres bicker, making it easy for the adventuring company to ambush the ogres.
  - An ogre (Rundle) is fishing for a giant pike using an immense fishing pole and a crude iron hook.
  - Enoch the ogre has captured a cart of wine barrels, and is systematically guzzling the barrels while singing lewd songs. With each barrel, it gets drunker and louder.
  - The ogres (Frunk and Goethel) are grabbing turnips from a farmer's field, stuffing them in a giant sack. The ogres don't care if they are seen, confident that nobody can bully them.
  - Ogres (Othir, Curd, Mae) are setting up house in an abandoned windmill. They are using the millstone as an enormous table.
  - The ogre (Hake) is making an enormous porridge from a sack of grain and cask of water in a cauldron.
  - The ogre (Munder) is sitting on a boulder, picking its nose.
  - The ogre (Throg) is cultivating a giant pumpkin in his own garden.
  - Jack the ogre has covered himself in chains to which he has attached severed heads; the ogre carries an enormous flail. He delights in scaring humans (issuing commands in a booming voice), but won't attack unless attacked.
  - An ogre (Mumbles) is carrying a cackling goblin (Rizzle) on its shoulder. They make a comic duo, with the goblin serving as the brains of the duo. He issues orders to the ogre, who often misunderstands.
  - A group of ogres (Morgh, Mush, Trog, Prok) is preparing to throw captured humans into the "all-consuming maw" (a pit with no apparent bottom) in some dark gwyrigon ritual.
  - A massive ogre (Odell), stinking of sour beer, is trying to stuff a dead horse into a giant cauldron. It keeps complaining loudly to itself that it can't find a pot big enough to boil the entire thing.
  - The adventuring company finds a crude hut made of small logs and bones. Inside is a crude firepit. A man-eating ogre (Borger) lives here. The ogre will return in several hours, bringing a Drune child he has caught.
  - Barnaby the ogre rambles through the forest. He is wearing a wooden crown. He believes this means that humans must obey him, and he insists that the adventuring company bow before him and address him as "sire."
  - Garmin the ogre is sitting on boulder, flipping the pages of a human-sized book. The book, A Pilgrim's Progress to Three Martyrs Minster, is a travelogue from far lands to the minster. Garmin can't read but he is very curious. If the adventuring company offers to teach him to read, he will tag along with the company for the remainder of season, fighting on behalf of the company, but insisting on reading lessons every night. Needless to say, Garmin is not welcome in civilized areas.
  - Goblin sneakthieves attempt to steal from the adventuring company at night. If followed or tracked, they lead back to the lair of Shovelhead the Ogre. See Among Mirky and Mirthless Mires in separate adventure Dolmenwood Dozen.
- name: Orc
  type: Creature
  description: Grey-skinned humanoid with prominent tusks and squinty eyes; muscular build; dressed in furs and leather armor.
  habitat: [Meadows, Rolling Hills]
  habitat_notes: Orcs prefer marginal lands, especially dry badlands and steppe grasslands that support their ponies and livestock.
  watch: {dawn: 15%, morning: 25%, afternoon: 25%, dusk: 15%, early night: 10%, late night: 10%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - An orc warband patrols their territory, weapons ready.
  - Orcs have set up a crude camp, cooking meat over an open fire.
  - The adventuring company hears orcish war chants echoing through the hills.
  - An orc hunting party tracks prey through the wilderness.
  - Orcs argue loudly over the division of spoils from a recent raid.
- name: Orc, Cave
  type: Creature
  description: Thin, short humanoid; pale grey skin; bulging eyes; hide clothing; primitive weapons.
  habitat: [Caverns, Dungeons]
  habitat_notes: null
  watch: {dawn: 10%, morning: 0%, afternoon: 0%, dusk: 10%, early night: 40%, late night: 40%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 80%}
  sparks:
  - On a moonlit night, cave orcs, led by Murkzad, emerge to raid for pigs.
  - At night, cave orcs (led by Harkad) are foraging for fungi aboveground in the forest.
  - Cave orcs (led by Dorban and Dezko) have set up an ambush along a cavern trail. They will throw spears from a ledge above.
  - Cave orcs (with their warleader Urzok and shaman Sarol) are gathered in a sacred grotto, bowing down to an obsidian demon idol.
  - Cave orcs (led by Hdazar) are herding beetles.
  - Cave orcs have hooked a giant crayfish; several orcs are hauling it out of a lake on a rope. Worzi is their leader.
  - Cave orcs are locked in combat with a tunnel hulk. Their champion Gyforka is slowly losing ground to the hulk.
  - Low-pitched drums echo through the cavern. Cave orcs are communicating over long distances. Nearby, the orcs are dancing.
  - Cave orcs are carving a disposable canoe from the trunk of a giant mushroom. Orzal is their leader.
  - Cave orcs (Bezga, Istvan, Czala and Sebet) are fishing for blind cave fish.
  - Cave orcs argue over a wagon of stolen goods- iron tools, a bag of coal and a jug of oddberry wine.
- name: Otyugh
  type: Creature
  description: Round body; three long tentacles (one with three eyes); toothy maw and three legs.
  habitat: [Settlements, Ruins, Dungeons]
  habitat_notes: Sewers, middens, filth and dung.
  watch: {dawn: 15%, morning: 5%, afternoon: 5%, dusk: 15%, early night: 30%, late night: 30%}
  season: {Spring: 90%, Summer: 100%, Autumn: 90%, Winter: 60%}
  sparks:
  - The otyugh has burrowed in a filthy midden, leaving its eyestalk sticking out.
  - The otyugh has burrowed into mud and is asleep.
  - The otyugh is aware and aware, but it recently ate and is not hungry.
  - The otyugh is noisily slurping vast quantities or dung and organic matter.
  - The otyugh has mounted a skull on its tentacle, and waves it above the midden, hoping to entice prey.
- name: Owlbear
  type: Creature
  description: "10 feet tall; owl's head on bear's body; light brown fur, feathers mostly white with brown patterns. Deep hoots in warning."
  habitat: [Light Forest, Dense Forest, Thorny Forest]
  habitat_notes: null
  watch: {dawn: 25%, morning: 20%, afternoon: 20%, dusk: 25%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 5%}
  sparks:
  - At night, the owlbear invades the adventuring company's campsite, seeking a good meal.
  - The owlbear is marking its territory by gouging tree trunks.
  - An owlbear has heard the adventuring party and is following the noise. At an appropriate place, it will rush to defend its territory.
  - The owlbear is devouring a deer.
  - The adventuring company hears a series of deep hoots. It is an owlbear warning intruders who have entered its territory. If they continue, the owlbear will attack. If they abandon the trail (losing 2 travel points), the owlbear will let them alone.
  - A sickly looking owlbear has contracted mange (2/3 normal hit points). The mange makes it desperate enough to attack the adventuring company. Anyone in melee contact with the owlbear is exposed to mange.
- name: Peryton
  type: Creature
  description: "Body and wings of a large raptor; stag's head with antlers; prominent tusks."
  habitat: [Craggy Hills, Mountains, Ruins]
  habitat_notes: null
  watch: {dawn: 20%, morning: 30%, afternoon: 30%, dusk: 20%, early night: 0%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 70%}
  sparks:
  - The peryton is circling overhead, waiting for a clear break in trees to cast its shadow on the adventuring company.
  - The peryton is trailing a traveling merchant's wagon on the road, waiting for an opportune time to attack.
  - A peryton's antlers are firmly stuck in a tree trunk. It watches helplessly as the adventuring company approaches.
  - A pair of perytons fly overhead. They have recently fed, so they will not attack, but will cruelly pass over the adventuring company with their frightening shadow.
  - In a niche in a cliff wall, the adventuring company finds a 4 foot nest, littered with feathers, blood and some treasure. If the adventuring company lingers, the peryton owner returns, furious at the invasion of its nest.
  - A rare two-headed mutant peryton is chasing three crookhorn breggles.
- name: Pike, Giant
  type: Creature
  description: 10-foot long thin fish; light blue, green or tan scales; pronounced snout and inward-pointing needle-like teeth.
  habitat: [Rivers, Lakes]
  habitat_notes: null
  watch: {dawn: 20%, morning: 25%, afternoon: 30%, dusk: 20%, early night: 5%, late night: 0%}
  season: {Spring: 100%, Summer: 100%, Autumn: 100%, Winter: 30%}
  sparks:
  - The pike is lurking in shallow water, hiding among the weeds, waiting to ambush a meal.
  - The pike is carrying a giant frog away to eat.
  - A pike leaps out of the water, snapping at an eagle.
  - A pair of pike hover below a log crossing a river, waiting for someone to cross. If anyone tries to cross, they will disturb the log, attempting to make the person fall in the water.
  - If traveling by boat, the pike strikes the boat in frustration. If the boat is small or fragile, it is in danger of being destroyed.
  - The adventuring company chases some deer. They flee swimming into a lake. Suddenly one gets pulled underwater; the adventuring company sees the shadow of a giant pike.
