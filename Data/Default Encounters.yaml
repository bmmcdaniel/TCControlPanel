  habitat: [Meadows, Rolling Hills, Light Forest, Ruins]
  habitat_notes: null
  watch: {dawn: 15%, morning: 35%, afternoon: 35%, dusk: 15%, early night: 0%, late night: 0%}
  season: {Spring: 80%, Summer: 100%, Autumn: 60%, Winter: 0%}
  sparks:
  - A group of six paper wasps finds the adventuring company and attempt to take clothing (cloaks first), tents, and especially paper books and scrolls, attacking if disturbed.
  - The adventuring company finds an abandoned one-room hut. A giant paper wasp nest fills the room above the rafters. A swarm of wasps will attack if the nest is disturbed. Several Drune scrolls are embedded in the nest.
  - Five giant paper wasps are feeding on the corpse of a false unicorn. They will half-heartedly defend their meal from interlopers.
  - Four giant wasps are flying back to their nest. 25% chance they are carrying a stolen spellbook; 50% chance they are carrying clothing; 25% chance they are carrying two blankets.
- name: Water Elemental
  type: Creature
  description: Mass of churning water; roughly humanoid shape; constantly flowing and rippling. Rushing water sounds.
  habitat: [Rivers, Lakes, Seas]
  habitat_notes: Anywhere there are masses of pure water.
  watch: {dawn: 20%, morning: 25%, afternoon: 25%, dusk: 20%, early night: 5%, late night: 5%}
  season: {Spring: 100%, Summer: 80%, Autumn: 100%, Winter: 20%}
  sparks:
  - A wizard has summoned a water elemental to guard his aqueous port.
  - A gate in the ocean depths allows water elementals to pass.
  - A powerful tidal wave generates a water elemental.
  - A water elemental rises from a lake, its form towering above the surface before crashing back down.
- name: Water Termite, Giant
  type: Creature
  description: 2.5 feet long; beetle or roach-like; brown carapace; legs adapted as swimmers and mandibles. Scratching noises while eating wood.
  habitat: [Rivers, Lakes]
  habitat_notes: null
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: {Spring: 80%, Summer: 100%, Autumn: 80%, Winter: 10%}
  sparks:
  - Water termites have latched to the underside of the adventuring company's boat. After a while, the adventuring company may notice the boat is sluggish with a successful DC 10 Intelligence check.
  - The adventuring company discovers an abandoned rowboat in the shallow water. It is full of holes, a clear sign of nearby water termites.
  - The adventuring company sees a log in a lake. There are several giant water termites, clearly visible, feeding on the log.
  - A mossling bargeman on a pirogue is fending off giant water termites with his pole. Argrand the mossling will be grateful if the adventuring company helps.
  - The adventuring company disturbs a riverside nest of giant water termites. They swarm out and attack to defend their lair.
- name: Water Weird
  type: Creature
  description: Fountain filled with cool, pure water; water pours from mouth of carved serpents.
  habitat: [Rivers, Settlements, Ruins, Dungeons]
  habitat_notes: Built into artificial pools.
  watch: {dawn: 20%, morning: 20%, afternoon: 20%, dusk: 20%, early night: 10%, late night: 10%}
  season: All 100%
  sparks:
  - A water weird guards the entrance to a cultist's grotto.
  - A water weird acts as a castle's emergency water supply in case of siege.
  - At the river's edge, an elaborate bathing pool is guarded by a water weird.
  - The adventuring company finds a decrepit old water-mill. Incredibly, the waterwheel still slowly turns, seemingly on its own. The whaterwheel is powered by a bound weater weird. If questioned, the water weird begs for release (but it doesn't know how).
- name: Wax Golem
  type: Creature
