  - The crabs are moving alongside the shore, methodically turning over rocks looking for food.
  - A stone crab is overturned; it is struggling to turn itself over.
  - A single Medium-sized crab lumbers around, its shell covered with barnacles and moss.
  - A fisher has accidentally tangled a crab in its net. The fisher fears the crab will destroy the net and asks for the adventuring company's help.
  - Among a group of stone crabs, one has painted-on arcane runes. It was used (live) by witches in a summoning ritual, then released back to nature.
  - Smashed oyster shells and freshwater pearls are scattered around the riverside. Stone crabs lurk here and smash the oysters for food. If player characters linger here, they will be attacked.
