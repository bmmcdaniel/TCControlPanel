  watch: {dawn: 15%, morning: 25%, afternoon: 25%, dusk: 15%, early night: 10%, late night: 10%}
  season: All 100%
  sparks:
  - A fist-sized stone, it is magically cold.
  - An abandoned cart, carrying the possessions of a forest cottager (an axe, cut wood, an iron pot, a bedroll, etc.). It is perfectly intact, and there is no sign of the owner.
  - In a silver scroll case, the adventuring company finds a treasure map to Sir Chyde's tomb (see Winter's Daughter, stand-alone adventure). Written on the map is "retrieve the lady's ring."
  - An eroded cliff, exposing long-covered rock carving of a pot-bellied cyclops with a single, hexagonal eye. Runes in a lost language direct the viewer to travel to Prigmarinn Hill (hex 0805) and explains the consequences of carving its name there (see DCB p 276). Magic is required to read the language.
  - Half-buried in the dirt is a heavily corroded bronze bell, 18 inches tall and 12 inches diameter weighing 60 pounds (12 slots). The bell shows scenes of clergy in acts of worship, aiding villagers and fighting demons; it is inscribed with the phrase (in old liturgical) "I call the living, I mourn the dead, I ward against demons." The bell is not magical but would fetch 100 gp from church authorities.
  - The adventuring company finds a dead body.
