  - In the Table Downs, the wandering tower is still. Servants of the tower (Owain, Wilhelm, Dill, Dunwood, Coggern, Garrick, Vernon) are offering food and assistance to shepherds.
  - In the Table Downs, the wandering tower is still. Servants of the tower (Owain, Wilhelm, Dill, Dunwood, Coggern, Garrick, Vernon) have captured a werewolf. Tomorrow they will hold a trial.
- name: Wasp, Giant Paper
  type: Creature
