  - An otherwise ordinary frog croaks "Betrayal" then hops away.
  - Far away from the woodcutter's encampment, a grove of ancient furnged trees (DCB p 182). The trees form intricate shapes, in smooth arcs.
  - A wind carries the sound of distant battle horns and bellowing. This is an echo of ancient battles.
  - A ring of twelve birch saplings in a sunny clearing, spaced too regularly to have grown this way by chance. Anyone who enters the clearing hears whispers in the air. Anyone who spends more than 10 minutes in the ring takes 1d20 psychic damage (falling unconscious if they drop to 0), and is magically transported to the nearest faerie road. Those that know the secret can use the ring to travel to the faerie road without taking damage.
